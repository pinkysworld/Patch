# HISTORICAL v0.8 compatibility runtime. Not the Ready v1.4 line.
# Ready publishes native-linux-runtime-v1.4 via native-sealed-slider-runtime-v14.yml.
name: Patch Native Linux Runtime v0.8 (historical)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/native-linux-runtime.yml
      - native-runtime/gtk-sealed-gui-v07.cpp
      - native-runtime/gtk-sealed-gui-v08.cpp
      - scripts/seal-native-linux.js
      - src/sealed-native-gui.js
      - src/native-gui-ir.js
      - examples/forms-navigation.patch
      - examples/combo-window.patch
      - examples/listbox-window.patch
      - examples/tabs-window.patch
      - examples/radio-window.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - tests/sealed-native-gui.test.js
      - tests/sealed-native-accessibility.test.js
      - tests/combobox-window.test.js
      - tests/listbox-window.test.js
      - tests/tabs-window.test.js
      - tests/radio-window.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - tests/studio-linux-native-gui.test.js
  push:
    branches: [main]
    paths:
      - .github/workflows/native-linux-runtime.yml
      - native-runtime/gtk-sealed-gui-v07.cpp
      - native-runtime/gtk-sealed-gui-v08.cpp
      - scripts/seal-native-linux.js
      - src/sealed-native-gui.js
      - src/native-gui-ir.js
      - examples/forms-navigation.patch
      - examples/combo-window.patch
      - examples/listbox-window.patch
      - examples/tabs-window.patch
      - examples/radio-window.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - tests/sealed-native-gui.test.js
      - tests/sealed-native-accessibility.test.js
      - tests/combobox-window.test.js
      - tests/listbox-window.test.js
      - tests/tabs-window.test.js
      - tests/radio-window.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - tests/studio-linux-native-gui.test.js

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCH_SEALED_GUI_VERSION: '7'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Check sealed accessibility contract
        run: node --test tests/sealed-native-accessibility.test.js
      - name: Compile generic native GTK3 GUI runtime v0.8
        shell: bash
        run: |
          mkdir -p dist-runtime
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v08.cpp -o dist-runtime/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-runtime/patch-linux-native-gui-runtime.bin
      - name: Seal and smoke canonical Forms app
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/forms-navigation.patch dist-runtime/patch-linux-native-gui-runtime.bin dist-runtime/PatchSealedForms PatchSealedForms
          chmod +x dist-runtime/PatchSealedForms
          xvfb-run -a dist-runtime/PatchSealedForms --patch-smoke
      - name: Seal and smoke native ComboBox application
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/combo-window.patch dist-runtime/patch-linux-native-gui-runtime.bin dist-runtime/PatchSealedCombo PatchSealedCombo
          chmod +x dist-runtime/PatchSealedCombo
          xvfb-run -a dist-runtime/PatchSealedCombo --patch-smoke
      - name: Seal and smoke native ListBox application
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/listbox-window.patch dist-runtime/patch-linux-native-gui-runtime.bin dist-runtime/PatchSealedListBox PatchSealedListBox
          chmod +x dist-runtime/PatchSealedListBox
          xvfb-run -a dist-runtime/PatchSealedListBox --patch-smoke
      - name: Seal and smoke native Tabs application
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/tabs-window.patch dist-runtime/patch-linux-native-gui-runtime.bin dist-runtime/PatchSealedTabs PatchSealedTabs
          chmod +x dist-runtime/PatchSealedTabs
          xvfb-run -a dist-runtime/PatchSealedTabs --patch-smoke
      - name: Seal and smoke native Radio application
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/radio-window.patch dist-runtime/patch-linux-native-gui-runtime.bin dist-runtime/PatchSealedRadio PatchSealedRadio
          chmod +x dist-runtime/PatchSealedRadio
          xvfb-run -a dist-runtime/PatchSealedRadio --patch-smoke
      - name: Seal and smoke native Menu Dialog application
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/menu-dialog-window.patch dist-runtime/patch-linux-native-gui-runtime.bin dist-runtime/PatchSealedMenuDialog PatchSealedMenuDialog
          chmod +x dist-runtime/PatchSealedMenuDialog
          xvfb-run -a dist-runtime/PatchSealedMenuDialog --patch-smoke
      - name: Seal and smoke native Result Dialog application
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/result-dialog-window.patch dist-runtime/patch-linux-native-gui-runtime.bin dist-runtime/PatchSealedResultDialog PatchSealedResultDialog
          chmod +x dist-runtime/PatchSealedResultDialog
          xvfb-run -a dist-runtime/PatchSealedResultDialog --patch-smoke
      - name: Verify ELF and payload-v7 contract
        shell: bash
        run: |
          file dist-runtime/patch-linux-native-gui-runtime.bin
          file dist-runtime/PatchSealedResultDialog
          node - <<'NODE'
          const fs=require('fs');
          const runtime=fs.readFileSync('dist-runtime/patch-linux-native-gui-runtime.bin');
          const sealed=fs.readFileSync('dist-runtime/PatchSealedResultDialog');
          if(runtime[0]!==0x7f||runtime[1]!==0x45||runtime[2]!==0x4c||runtime[3]!==0x46) throw new Error('Runtime is not ELF.');
          if(sealed.length<=runtime.length) throw new Error('Sealed application did not append a payload.');
          if(sealed.subarray(sealed.length-20,sealed.length-12).toString('ascii')!=='PCHGUI01') throw new Error('Footer magic missing.');
          if(sealed.readUInt32LE(sealed.length-12)!==7) throw new Error('Expected sealed native GUI payload v7.');
          const text=sealed.toString('latin1');
          for(const forbidden of ['Electron','Chromium','node_modules']) if(text.includes(forbidden)) throw new Error(`Unexpected compatibility runtime marker: ${forbidden}`);
          console.log(`Generic GTK runtime v0.8: ${runtime.length} bytes; sealed Result Dialog app: ${sealed.length} bytes`);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: patch-linux-native-gui-runtime
          path: dist-runtime/patch-linux-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patch-linux-native-gui-runtime
          path: runtime
      - name: Publish native runtime template
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-linux-runtime-v0.8
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Patch Native Linux Runtime v0.8' --notes 'Native GTK3 sealed-GUI runtime template for token-free Patch Studio builds. Runtime v0.8 preserves sealed payload v7 and adds GTK3/ATK accessibility names with executable smoke readback for Input, ComboBox, ListBox, Tabs and grouped Radio controls.'
          fi
          gh release upload "$TAG" runtime/patch-linux-native-gui-runtime.bin --repo "$GITHUB_REPOSITORY" --clobber
