name: Calendar Studio Parity Helper

on:
  push:
    branches:
      - rad/calendar-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/calendar-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply Calendar Studio parity patch
        run: node scripts/_calendar-studio-parity.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused Calendar tests
        run: npm test -- tests/calendar-stage1.test.js tests/input-presentation.test.js tests/datepicker-stage1.test.js tests/timepicker-stage1.test.js
      - name: Full repository tests
        run: npm test
      - name: Commit verified Studio parity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/window-input-presentation.js tests/calendar-stage1.test.js
          git commit -m "RAD: render Calendar in Studio surfaces [skip ci]"
          git push origin HEAD:rad/calendar-stage1
