name: SplitContainer webapp wire

on:
  push:
    branches: [splitcontainer-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splitcontainer-stage1
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/webapp.js')
          s = p.read_text()
          a = "import { enhanceStandaloneWindowPaintBoxes } from './window-web-paintbox.js';"
          if "window-web-splitcontainer.js" not in s:
              if s.count(a) != 1:
                  raise SystemExit('webapp import anchor changed')
              s = s.replace(a, a + "\nimport { enhanceStandaloneWindowSplitContainers } from './window-web-splitcontainer.js';")
          lines=[]
          wrapped=0
          for line in s.splitlines(True):
              if 'return enhanceStandaloneWindowPaintBoxes(' in line:
                  line=line.replace('return enhanceStandaloneWindowPaintBoxes(', 'return enhanceStandaloneWindowSplitContainers(enhanceStandaloneWindowPaintBoxes(', 1)
                  newline='\n' if line.endswith('\n') else ''
                  core=line[:-1] if newline else line
                  if not core.endswith(';'):
                      raise SystemExit('webapp return line shape changed')
                  line=core[:-1]+');'+newline
                  wrapped+=1
              lines.append(line)
          if wrapped != 2:
              raise SystemExit(f'expected two Window return wrappers, got {wrapped}')
          p.write_text(''.join(lines))
          PY
          rm -f .github/workflows/splitcontainer-webapp-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/webapp.js .github/workflows/splitcontainer-webapp-wire.yml
          git commit -m "Web: wire SplitContainer renderer into standalone builds"
          git push origin HEAD:splitcontainer-stage1
