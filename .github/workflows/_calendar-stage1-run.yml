name: Calendar Stage 1 Verification Helper

on:
  push:
    branches:
      - rad/calendar-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/calendar-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply Calendar Stage 1 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_calendar-stage1-dev.mjs')
          lines = path.read_text().splitlines()
          replacement = r'''  s = once(s, "      } else if (time) {\n        clearMaskFromStudioInput(input);\n        input.setAttribute('aria-label', `${id || 'Time'} time input`);\n      } else if (mask && !password) applyMaskToStudioInput(input, id, mask);", "      } else if (time) {\n        clearMaskFromStudioInput(input);\n        input.setAttribute('aria-label', `${id || 'Time'} time input`);\n      } else if (calendar) {\n        clearMaskFromStudioInput(input);\n        input.setAttribute('aria-label', `${id || 'Calendar'} calendar input`);\n      } else if (mask && !password) applyMaskToStudioInput(input, id, mask);", 'Calendar Studio aria');'''
          matches = [i for i, line in enumerate(lines) if 'Calendar DOM aria' in line]
          if len(matches) != 1:
              raise SystemExit(f'Expected one Calendar DOM aria anchor, found {len(matches)}')
          lines[matches[0]] = replacement
          path.write_text('\n'.join(lines) + '\n')
          PY
          node scripts/_calendar-stage1-dev.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused Calendar and input-presentation tests
        run: npm test -- tests/input-presentation.test.js tests/datepicker-stage1.test.js tests/timepicker-stage1.test.js tests/calendar-stage1.test.js
      - name: Full repository tests
        run: npm test
      - name: Commit verified Calendar core
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/input-presentation.js src/window-input-presentation.js src/window-webapp.js src/native-current-contract.js tests/input-presentation.test.js tests/datepicker-stage1.test.js tests/timepicker-stage1.test.js tests/calendar-stage1.test.js
          git commit -m "RAD: implement Calendar Stage 1 core [skip ci]"
          git push origin HEAD:rad/calendar-stage1
