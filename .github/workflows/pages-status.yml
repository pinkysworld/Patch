name: Publish Patch Studio Deployment Status

on:
  workflow_run:
    workflows: [Deploy Patch Studio]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    # Only main deployments may influence the public-site commit status. The
    # workflow itself can legitimately complete as skipped/cancelled when a
    # runtime-triggered Pages attempt is inapplicable or superseded; those
    # conclusions are not evidence that the currently published site failed.
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish public-site commit status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOY_CONCLUSION" in
            success)
              state=success
              description='Patch Studio public deployment verified'
              ;;
            failure|timed_out|startup_failure|action_required)
              state=failure
              description='Patch Studio public deployment failed'
              ;;
            cancelled|skipped|neutral|stale)
              echo "Ignoring non-authoritative Pages conclusion: $DEPLOY_CONCLUSION"
              exit 0
              ;;
            *)
              echo "Ignoring unknown Pages conclusion: $DEPLOY_CONCLUSION"
              exit 0
              ;;
          esac

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state="$state" \
            -f context='patch-studio/public-site' \
            -f description="$description" \
            -f target_url="$DEPLOY_URL" >/dev/null
          echo "Published patch-studio/public-site=$state for $STATUS_SHA"
