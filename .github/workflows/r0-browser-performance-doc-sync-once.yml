name: R0 browser performance documentation sync

on:
  push:
    branches: [gpt/r0-browser-performance-gates-282]
    paths:
      - .github/workflows/r0-browser-performance-doc-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact performance status updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'docs/ROADMAP.md',
              '- [x] explicit `?patch-runtime-render=full` uses the canonical full renderer as a deterministic diagnostics/recovery fallback and preserves transient runtime state\n- [x] Tabs page switches update only their local tab panel instead of rebuilding the complete runtime window tree',
              '- [x] explicit `?patch-runtime-render=full` uses the canonical full renderer as a deterministic diagnostics/recovery fallback and preserves transient runtime state\n- [x] `patch-studio-browser-performance/0.1` measures real-Chrome Workshop Run/event paint plus 10-Form/200-control Run and Designer Form-switch timing, with generous 3s Run / 2s interaction CI hard limits\n- [x] Tabs page switches update only their local tab panel instead of rebuilding the complete runtime window tree'
          )
          replace_once(
              'docs/ROADMAP.md',
              '- [ ] Workshop click-to-first-app-paint, large-form event-to-paint and Form-switch performance gates\n',
              ''
          )
          replace_once(
              'docs/RAD_STUDIO_MASTER_BACKLOG.md',
              '- [ ] event-to-paint regression gates.',
              '- [x] real-Chrome event-to-paint regression gate through `patch-studio-browser-performance/0.1`.'
          )
          replace_once(
              'docs/RAD_STUDIO_MASTER_BACKLOG.md',
              '- [ ] Workshop Run click-to-first-app-paint measurement;\n- [ ] 10-Form / 200-control initial Run timing;\n- [ ] large-Form event-to-paint timing;\n- [ ] active-Form switch timing;\n- [ ] generous hosted-runner CI thresholds that detect regressions without creating noise.',
              '- [x] Workshop Run click-to-first-app-paint measurement;\n- [x] 10-Form / 200-control initial Run timing;\n- [x] large-Form Workshop event-to-paint timing;\n- [x] active-Form switch timing on the 10-Form / 200-control fixture;\n- [x] generous hosted-runner CI thresholds through `patch-studio-browser-performance/0.1`: 3000 ms for Run-to-paint and 2000 ms for event/Form-switch timing.'
          )
          PY
      - name: Verify documentation consistency
        run: |
          set -euo pipefail
          grep -F 'patch-studio-browser-performance/0.1' docs/ROADMAP.md
          grep -F '3000 ms for Run-to-paint' docs/RAD_STUDIO_MASTER_BACKLOG.md
          npm run check:project
      - name: Commit synchronized docs and remove workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/r0-browser-performance-doc-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/RAD_STUDIO_MASTER_BACKLOG.md
          git commit -m 'Document Studio browser performance gates'
          git push
