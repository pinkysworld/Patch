name: Assistant TimePicker Showcase Polish

on:
  push:
    branches:
      - rad/timepicker-showcase-polish

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[assistant-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/timepicker-showcase-polish
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Route Workshop details migration through upgrade bridge
        run: python scripts/assistant-timepicker-prefix-fix.py
      - name: Repair temporary harness and synchronize retained samples
        run: python scripts/assistant-timepicker-harness-fix.py
      - name: Apply product updates
        run: node scripts/assistant-timepicker-showcase-polish.mjs
      - name: Syntax check
        run: npm run check:syntax
      - name: Targeted RAD regression suite
        run: >-
          node --test
          tests/input-presentation.test.js
          tests/passwordedit-stage1.test.js
          tests/maskededit-stage1.test.js
          tests/numberedit-stage1.test.js
          tests/datepicker-stage1.test.js
          tests/timepicker-stage1.test.js
          tests/studio-showcase.test.js
          tests/studio-showcase-loader.test.js
          tests/studio-authoring-surface.test.js
          tests/docs-current-studio-surface.test.js
          tests/workshop-desk.test.js
          tests/workshop-native-ready.test.js
      - name: Full repository tests
        run: npm test
      - name: Example smoke tests
        run: npm run check
      - name: Build public site
        run: npm run build:site
      - name: Validate public site
        run: npm run check:site
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/assistant-timepicker-showcase-polish.yml
          rm -f scripts/assistant-timepicker-showcase-polish.mjs
          rm -f scripts/assistant-timepicker-harness-fix.py
          rm -f scripts/assistant-timepicker-prefix-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "RAD: add TimePicker and polish showcase [assistant-applied]"
          git push origin HEAD:rad/timepicker-showcase-polish
