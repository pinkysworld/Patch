name: NumberEdit backing-state lifecycle

on:
  push:
    branches: [numberedit-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numberedit-stage1
          fetch-depth: 0
      - name: Add NumberEdit duplicate and clipboard state handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: expected one anchor, found {s.count(old)}')
              p.write_text(s.replace(old,new))

          patch('web/designer-control-duplicate-model.js',
            "const PROGRESSBAR_RE = /^\\s*#\\s*@slider-mode\\s+progress\\s*$/i;",
            "const PROGRESSBAR_RE = /^\\s*#\\s*@slider-mode\\s+progress\\s*$/i;\nconst NUMBEREDIT_RE = /^\\s*#\\s*@input-number\\s+min\\s+.+\\s+max\\s+.+\\s+step\\s+.+\\s*$/i;")
          patch('web/designer-control-duplicate-model.js',
            "  } else if (control.type === 'slider' && copied.some(line => PROGRESSBAR_RE.test(line))) {\n    valueType = 'number';\n    label = 'ProgressBar';\n  } else {",
            "  } else if (control.type === 'slider' && copied.some(line => PROGRESSBAR_RE.test(line))) {\n    valueType = 'number';\n    label = 'ProgressBar';\n  } else if (control.type === 'input' && copied.some(line => NUMBEREDIT_RE.test(line))) {\n    valueType = 'number';\n    label = 'NumberEdit';\n  } else {")

          patch('web/designer-control-clipboard-model.js',
            "const PROGRESSBAR_RE = /^\\s*#\\s*@slider-mode\\s+progress\\s*$/i;",
            "const PROGRESSBAR_RE = /^\\s*#\\s*@slider-mode\\s+progress\\s*$/i;\nconst NUMBEREDIT_RE = /^\\s*#\\s*@input-number\\s+min\\s+.+\\s+max\\s+.+\\s+step\\s+.+\\s*$/i;")
          patch('web/designer-control-clipboard-model.js',
            "    if (record.type === 'slider' && PROGRESSBAR_RE.test(rows[index])) return { valueType: 'number', label: 'ProgressBar' };",
            "    if (record.type === 'slider' && PROGRESSBAR_RE.test(rows[index])) return { valueType: 'number', label: 'ProgressBar' };\n    if (record.type === 'input' && NUMBEREDIT_RE.test(rows[index])) return { valueType: 'number', label: 'NumberEdit' };")

          Path('.github/workflows/numberedit-lifecycle.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve NumberEdit backing states across Designer lifecycle"
          git push origin HEAD:numberedit-stage1
