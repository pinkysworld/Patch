name: Pages compiler brand smoke hotfix

on:
  push:
    branches:
      - gpt/pages-compiler-brand-smoke
    paths:
      - .github/scripts/pages_brand_smoke_hotfix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt/pages-compiler-brand-smoke
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply live compiler-brand verification
        run: python3 .github/scripts/pages_brand_smoke_hotfix.py
      - name: Verify hotfix
        run: |
          node --test tests/studio-branding.test.js
          npm run build:site
          npm run check:site
      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix live Pages compiler-brand smoke"
          git push origin HEAD:gpt/pages-compiler-brand-smoke
