name: SplitContainer wiring patch

on:
  push:
    branches: [splitcontainer-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splitcontainer-stage1
          fetch-depth: 0
      - name: Wire SplitContainer Studio and Web modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/webapp.js')
          s = p.read_text()
          anchor = "import { enhanceStandaloneWindowPaintBoxes } from './window-web-paintbox.js';"
          added = anchor + "\nimport { enhanceStandaloneWindowSplitContainers } from './window-web-splitcontainer.js';"
          if s.count(anchor) != 1 or 'window-web-splitcontainer.js' in s:
              raise SystemExit('webapp import anchor changed')
          s = s.replace(anchor, added)
          lines = []
          wrapped = 0
          for line in s.splitlines(True):
              if 'return enhanceStandaloneWindowPaintBoxes(' in line:
                  line = line.replace('return enhanceStandaloneWindowPaintBoxes(', 'return enhanceStandaloneWindowSplitContainers(enhanceStandaloneWindowPaintBoxes(', 1)
                  stripped = line.rstrip('\n')
                  if not stripped.endswith(';'):
                      raise SystemExit('webapp Window return line shape changed')
                  suffix = '\n' if line.endswith('\n') else ''
                  line = stripped[:-1] + ');' + suffix
                  wrapped += 1
              lines.append(line)
          if wrapped != 2:
              raise SystemExit(f'expected two Window Web return wrappers, got {wrapped}')
          p.write_text(''.join(lines))

          p = Path('web/designer-workspace.js')
          s = p.read_text()
          a = "import './designer-panel.js';\nimport './designer-ui-namespace.js';"
          b = "import './designer-panel.js';\nimport './designer-splitcontainer.js';\nimport './designer-ui-namespace.js';"
          if s.count(a) != 1:
              raise SystemExit('designer workspace anchor changed')
          p.write_text(s.replace(a, b))

          p = Path('scripts/build-site.js')
          s = p.read_text()
          a = "'window-web-accessibility.js','window-web-paintbox.js','window-build.js'"
          b = "'window-web-accessibility.js','window-web-paintbox.js','window-web-splitcontainer.js','window-build.js'"
          c = "'designer-panel.js','designer-ui-namespace.js'"
          d = "'designer-panel.js','designer-splitcontainer.js','designer-ui-namespace.js'"
          if s.count(a) != 1 or s.count(c) != 1:
              raise SystemExit('build-site anchors changed')
          p.write_text(s.replace(a, b).replace(c, d))

          p = Path('web/sw.js')
          s = p.read_text()
          a = "'./designer-menu-designer.js', './designer-panel.js', './designer-layout-actions.js'"
          b = "'./designer-menu-designer.js', './designer-panel.js', './designer-splitcontainer.js', './designer-layout-actions.js'"
          c = "'../src/window-web-accessibility.js', '../src/window-web-paintbox.js', '../src/window-build.js'"
          d = "'../src/window-web-accessibility.js', '../src/window-web-paintbox.js', '../src/window-web-splitcontainer.js', '../src/window-build.js'"
          if s.count(a) != 1 or s.count(c) != 1:
              raise SystemExit('service-worker anchors changed')
          p.write_text(s.replace(a, b).replace(c, d))

          p = Path('.github/workflows/pages.yml')
          s = p.read_text()
          a = '      - src/window-web-accessibility.js\n      - src/window-build.js'
          b = '      - src/window-web-accessibility.js\n      - src/window-web-splitcontainer.js\n      - src/window-build.js'
          c = '      - src/panel-scroll.js\n      - src/input-presentation.js'
          d = '      - src/panel-scroll.js\n      - src/panel-split.js\n      - src/input-presentation.js'
          if s.count(a) != 1 or s.count(c) != 1:
              raise SystemExit('Pages trigger anchors changed')
          p.write_text(s.replace(a, b).replace(c, d))
          PY
          rm .github/workflows/splitcontainer-wire.yml .splitcontainer-wire-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/webapp.js web/designer-workspace.js scripts/build-site.js web/sw.js .github/workflows/pages.yml .github/workflows/splitcontainer-wire.yml .splitcontainer-wire-trigger
          git commit -m "Studio: wire SplitContainer Web and offline modules"
          git push origin HEAD:splitcontainer-stage1
