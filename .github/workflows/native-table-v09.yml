name: Native Table v0.9

on:
  pull_request:
    paths:
      - 'src/native-gui-ir-v08.js'
      - 'src/native-table-backend-adapter.js'
      - 'src/win32-gui-v09.js'
      - 'src/appkit-gui-v09.js'
      - 'src/appkit-table-overlay-v09.js'
      - 'src/gtk-gui-v09.js'
      - 'src/gtk-table-overlay-v09.js'
      - 'src/window-layout-policy.js'
      - 'scripts/build-native-win32.js'
      - 'scripts/build-native-appkit.js'
      - 'scripts/build-native-gtk.js'
      - 'examples/table-native-v09.patch'
      - '.github/workflows/native-table-v09.yml'
  push:
    branches: [main]
    paths:
      - 'src/native-gui-ir-v08.js'
      - 'src/native-table-backend-adapter.js'
      - 'src/win32-gui-v09.js'
      - 'src/appkit-gui-v09.js'
      - 'src/appkit-table-overlay-v09.js'
      - 'src/gtk-gui-v09.js'
      - 'src/gtk-table-overlay-v09.js'
      - 'src/window-layout-policy.js'
      - 'scripts/build-native-win32.js'
      - 'scripts/build-native-appkit.js'
      - 'scripts/build-native-gtk.js'
      - 'examples/table-native-v09.patch'
      - '.github/workflows/native-table-v09.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-table-v09-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 native Table
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile and smoke Win32 Table
        run: node scripts/build-native-win32.js examples/table-native-v09.patch PatchTableSmoke dist/table-win --table-v09 --smoke

  macos:
    name: macOS AppKit native Table
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile and smoke AppKit Table
        run: node scripts/build-native-appkit.js examples/table-native-v09.patch PatchTableSmoke dist/table-macos --table-v09 --smoke

  linux:
    name: Linux GTK3 native Table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install GTK3 smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb xauth
      - name: Compile and smoke GTK3 Table
        run: node scripts/build-native-gtk.js examples/table-native-v09.patch PatchTableSmoke dist/table-linux --table-v09 --smoke
