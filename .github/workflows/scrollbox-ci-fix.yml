name: ScrollBox CI fix

on:
  push:
    branches: [scrollbox-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrollbox-stage1
          fetch-depth: 0
      - name: Fix ScrollBox native regression and UI model propagation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          nl = chr(10)

          p = Path('src/interpreter.js')
          s = p.read_text()
          needle = "          item.panelPresentation=node.panelPresentation??'plain';"
          replacement = needle + nl + "          item.panelScroll=node.panelScroll??'none';"
          if s.count(needle) != 1 or "item.panelScroll=node.panelScroll??'none'" in s:
              raise SystemExit('interpreter Panel model anchor is not in the expected state')
          p.write_text(s.replace(needle, replacement))

          p = Path('tests/scrollbox-stage1.test.js')
          s = p.read_text()
          import_needle = "import { compile } from '../src/compiler.js';"
          if "PatchInterpreter" not in s:
              s = s.replace(import_needle, import_needle + nl + "import { PatchInterpreter } from '../src/interpreter.js';", 1)
          assertion_needle = "  assert.equal(panel.panelScroll, 'auto');"
          assertion_extra = assertion_needle + nl + "  const runtimePanel = new PatchInterpreter().runAst(compiled.ast).ui[0].controls.find(control => control.type === 'panel');" + nl + "  assert.equal(runtimePanel.panelScroll, 'auto');"
          if "runtimePanel.panelScroll" not in s:
              if s.count(assertion_needle) != 1:
                  raise SystemExit('runtime assertion anchor not unique')
              s = s.replace(assertion_needle, assertion_extra, 1)
          compile_needle = "  const compiled = compile(SOURCE, { name: 'ScrollBoxStage1', kind: 'window', entry: 'main.patch' });"
          last = s.rfind(compile_needle)
          if last < 0:
              raise SystemExit('native compile anchor missing')
          compile_replacement = "  const compiled = compile(SOURCE.replace('  # @panel-mode group\\n', ''), { name: 'ScrollBoxStage1', kind: 'window', entry: 'main.patch' });"
          s = s[:last] + s[last:].replace(compile_needle, compile_replacement, 1)
          p.write_text(s)
          PY
          rm .github/workflows/scrollbox-ci-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/interpreter.js tests/scrollbox-stage1.test.js .github/workflows/scrollbox-ci-fix.yml
          git commit -m "fix: complete ScrollBox UI model and native gate test"
          git push origin HEAD:scrollbox-stage1
