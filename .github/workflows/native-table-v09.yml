name: Native Table v0.9

# Frozen direct-native compatibility smoke. Current CI and sealed-runtime
# workflows cover normal development changes; run this explicitly when
# auditing the historical v0.9 Table backend.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 native Table
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile and smoke Win32 Table
        run: node scripts/build-native-win32.js examples/table-native-v09.patch PatchTableSmoke dist/table-win --table-v09 --smoke

  macos:
    name: macOS AppKit native Table
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile and smoke AppKit Table
        run: node scripts/build-native-appkit.js examples/table-native-v09.patch PatchTableSmoke dist/table-macos --table-v09 --smoke

  linux:
    name: Linux GTK3 native Table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install GTK3 smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb xauth
      - name: Compile and smoke GTK3 Table
        run: node scripts/build-native-gtk.js examples/table-native-v09.patch PatchTableSmoke dist/table-linux --table-v09 --smoke
