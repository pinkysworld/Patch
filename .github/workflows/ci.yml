name: Patch CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Syntax check
        run: node --check src/parser.js && node --check src/interpreter.js && node --check src/cli.js && node --check src/compiler.js && node --check src/change-analysis.js && node --check src/range-analysis.js && node --check src/formal-range.js && node --check src/formal-bridge.js && node --check src/formal-source.js && node --check src/certificate.js && node --check src/wasm.js && node --check src/wasm-direct.js && node --check src/webapp.js && node --check src/native-app.js && node --check src/direct-trace-validator.js && node --check src/direct-effect-validator.js && node --check src/designer.js && node --check scripts/validate-direct-trace.js && node --check web/playground.js
      - name: Language, compiler, formal, certificate, direct-Wasm, app-build, trace-validator, designer and bootstrap-Wasm tests
        run: npm test
      - name: Example smoke tests
        run: npm run check
      - name: Formal correspondence and range-coverage smoke test
        run: npm run formal:example
      - name: Generate Lean-checkable range/source/evidence certificate
        run: npm run certify:example
      - name: Portable application build
        run: npm run build:example
      - name: Bootstrap WebAssembly application build
        run: npm run build:wasm
      - name: Direct WebAssembly application build
        run: npm run build:wasm-direct
      - name: Standalone single-file Web App build
        run: npm run build:web
      - name: Execute direct WebAssembly application
        run: npm run run:wasm-direct
      - name: Independently validate direct WebAssembly transition trace
        run: npm run validate:wasm-direct
      - name: Build public Patch Studio site
        run: npm run build:site
      - name: Validate public Patch Studio site
        run: npm run check:site
