name: Patch Native GTK GUI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/native-gui-ir.js
      - src/native-result-dialog-overlay.js
      - src/native-accessibility.js
      - src/gtk-gui.js
      - src/gtk-gui-v07.js
      - src/gtk-gui-v08.js
      - scripts/build-native-gtk.js
      - tests/native-accessibility.test.js
      - tests/gtk-gui.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - examples/forms-navigation.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - docs/NATIVE_ACCESSIBILITY.md
      - .github/workflows/native-gtk-gui.yml
  push:
    branches: [main]
    paths:
      - src/native-gui-ir.js
      - src/native-result-dialog-overlay.js
      - src/native-accessibility.js
      - src/gtk-gui.js
      - src/gtk-gui-v07.js
      - src/gtk-gui-v08.js
      - scripts/build-native-gtk.js
      - tests/native-accessibility.test.js
      - tests/gtk-gui.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - examples/forms-navigation.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - docs/NATIVE_ACCESSIBILITY.md
      - .github/workflows/native-gtk-gui.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-gtk:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Check GTK backend JavaScript
        run: |
          node --check src/native-result-dialog-overlay.js
          node --check src/native-accessibility.js
          node --check src/gtk-gui.js
          node --check src/gtk-gui-v07.js
          node --check src/gtk-gui-v08.js
          node --check scripts/build-native-gtk.js
          node --check tests/native-accessibility.test.js
          node --check tests/gtk-gui.test.js
          node --check tests/menu-dialog-window.test.js
          node --check tests/result-dialog-window.test.js
      - name: Run GTK lowering and accessibility tests
        run: node --test tests/native-accessibility.test.js tests/gtk-gui.test.js tests/menu-dialog-window.test.js tests/result-dialog-window.test.js
      - name: Compile, link and run native Patch GTK Forms application
        run: |
          mkdir -p dist-native-gtk
          node scripts/build-native-gtk.js examples/forms-navigation.patch PatchNativeGtkSmoke dist-native-gtk --smoke
      - name: Compile and execute native Patch GTK Menu Dialog application
        run: node scripts/build-native-gtk.js examples/menu-dialog-window.patch PatchNativeGtkMenuDialog dist-native-menu-dialog --smoke
      - name: Compile and execute native Patch GTK Result Dialog application
        run: node scripts/build-native-gtk.js examples/result-dialog-window.patch PatchNativeGtkResultDialog dist-native-result-dialog --smoke
      - name: Verify native GTK output contract
        run: |
          for pair in 'dist-native-gtk PatchNativeGtkSmoke' 'dist-native-menu-dialog PatchNativeGtkMenuDialog' 'dist-native-result-dialog PatchNativeGtkResultDialog'; do
            set -- $pair
            dir=$1; name=$2
            test -x "$dir/$name"
            node -e "const m=require('./$dir/$name.gtk-build.json'); if(m.electron!==false||m.shell!=='native-gtk3'||m.toolkit!=='GTK3'||m.nativeGuiIrVersion!=='0.7'||m.backendVersion!=='0.8') process.exit(1)"
          done
          ! find dist-native-gtk dist-native-menu-dialog dist-native-result-dialog -iname '*Electron*' -print -quit | grep -q .
      - name: Upload native GTK compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: patch-native-gtk-gui
          path: |
            dist-native-gtk/**
            dist-native-menu-dialog/**
            dist-native-result-dialog/**
          if-no-files-found: error
