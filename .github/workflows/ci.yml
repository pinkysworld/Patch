name: Patch CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Syntax check
        run: node --check src/parser.js && node --check src/interpreter.js && node --check src/cli.js && node --check src/compiler.js && node --check src/change-analysis.js && node --check src/range-analysis.js && node --check src/formal-bridge.js && node --check src/certificate.js && node --check src/wasm.js && node --check src/designer.js && node --check web/playground.js
      - name: Language, compiler, formal-bridge, certificate, designer and Wasm tests
        run: npm test
      - name: Example smoke tests
        run: npm run check
      - name: Formal bridge smoke test
        run: npm run formal:example
      - name: Generate Lean-checkable certificate
        run: npm run certify:example
      - name: Portable application build
        run: npm run build:example
      - name: WebAssembly application build
        run: npm run build:wasm
      - name: Build public Patch Studio site
        run: npm run build:site
      - name: Validate public Patch Studio site
        run: npm run check:site
