name: ScrollBox branch packaging patch

on:
  push:
    branches: [scrollbox-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrollbox-stage1
          fetch-depth: 0
      - name: Patch browser packaging lists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-site.js')
          s = p.read_text()
          a = "'form-layout.js','window-layout-policy.js','input-presentation.js'"
          b = "'form-layout.js','window-layout-policy.js','panel-scroll.js','input-presentation.js'"
          c = "'project-lifecycle.js','project-config-restore.js','recovery-manager.js'"
          d = "'project-lifecycle.js','project-config-restore.js','studio-showcase-project.js','recovery-manager.js'"
          if s.count(a) != 1 or s.count(c) != 1:
              raise SystemExit('expected packaging anchors are not unique')
          s = s.replace(a, b).replace(c, d)
          p.write_text(s)
          PY
          rm .github/workflows/scrollbox-branch-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-site.js .github/workflows/scrollbox-branch-patch.yml
          git commit -m "fix: package ScrollBox Studio modules"
          git push origin HEAD:scrollbox-stage1
