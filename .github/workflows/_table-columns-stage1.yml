name: Table Columns Stage 1 Helper

on:
  push:
    branches:
      - rad/table-columns-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/table-columns-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stabilize helper anchors
        run: node scripts/_table-columns-harness-fix.mjs
      - name: Apply advanced Table columns Stage 1
        run: node scripts/_table-columns-stage1.mjs
      - name: Add browser source closure
        run: node scripts/_table-columns-site-fix.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused Table column regressions
        run: npm test -- tests/table-columns-stage1.test.js tests/table-window.test.js tests/table-support-surface.test.js tests/table-stage1-reconciliation.test.js tests/designer-data-editors.test.js tests/designer-table-actions.test.js tests/studio-showcase.test.js tests/studio-live-update.test.js
      - name: Full repository tests
        run: npm test
      - name: Example and project gates
        run: |
          npm run check
          npm run check:project
      - name: Public site gate
        run: |
          npm run build:site
          npm run check:site
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-site.js \
            src/window-layout-policy.js \
            src/compiler.js \
            src/window-build.js \
            src/window-compiled.js \
            src/window-webapp.js \
            src/webapp.js \
            web/table-stage1.js \
            web/designer-table-model.js \
            web/designer-data-editor.js \
            web/designer-tabs-nested.js \
            web/designer-table-actions.js
          git commit -m "RAD: add advanced Table columns Stage 1 [skip ci]"
          git push origin HEAD:rad/table-columns-stage1
