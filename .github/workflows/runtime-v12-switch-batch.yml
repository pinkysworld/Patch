name: Patch Runtime v1.2 Consumer Migration

on:
  push:
    branches: [agent/current-runtime-v12-switch]
    paths:
      - scripts/apply-runtime-v12-switch.js
      - runtime-v12-switch.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/current-runtime-v12-switch
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Normalize migration self-check ordering
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/apply-runtime-v12-switch.js')
          s = p.read_text()
          docs_block = "replaceExact('scripts/check-site-v12.js', \"requireText(docs, 'payload v10/runtime v1.1', 'Documentation current list contract');\", \"requireText(docs, 'payload v11/runtime v1.2', 'Documentation current Menu contract');\");\n"
          old_table = "replaceExact('scripts/check-site-v10.js', 'PATCH_SEALED_NATIVE_GUI_LIST_VERSION', 'PATCH_SEALED_NATIVE_GUI_MENU_VERSION');\nreplaceExact('scripts/check-site-v10.js', 'payloadVersion: PATCH_SEALED_NATIVE_GUI_LIST_VERSION', 'payloadVersion: PATCH_SEALED_NATIVE_GUI_MENU_VERSION');\n"
          new_table = "replaceAtLeast('scripts/check-site-v10.js', 'PATCH_SEALED_NATIVE_GUI_LIST_VERSION', 'PATCH_SEALED_NATIVE_GUI_MENU_VERSION', 2);\n"
          redundant_payload = "replaceAtLeast('.github/workflows/offline-compiler.yml', 'payload v10.', 'payload v11.', 1);\n"
          old_appkit_trigger = "replaceExact('.github/workflows/offline-compiler.yml', '      - native-runtime/appkit-sealed-gui-v11.mm', '      - native-runtime/appkit-sealed-gui-v11.mm\\n      - native-runtime/appkit-sealed-gui-v12.mm', 2);\n"
          new_appkit_trigger = "replaceExact('.github/workflows/offline-compiler.yml', '      - native-runtime/appkit-sealed-gui-v12.mm', '      - native-runtime/appkit-sealed-gui-v11.mm\\n      - native-runtime/appkit-sealed-gui-v12.mm', 2);\n"
          redundant_index = "replaceAtLeast('web/index.html', 'runtime v1.1', 'runtime v1.2', 1);\n"
          for label, block in [('docs', docs_block), ('table', old_table), ('payload', redundant_payload), ('appkit trigger', old_appkit_trigger), ('Studio lowercase runtime', redundant_index)]:
              if block not in s:
                  raise SystemExit(f'Expected {label} migration block not found')
          s = s.replace(docs_block, '')
          s = s.replace(old_table, new_table)
          s = s.replace(redundant_payload, '')
          s = s.replace(old_appkit_trigger, new_appkit_trigger)
          s = s.replace(redundant_index, '')
          p.write_text(s)
      - name: Apply fail-closed v1.2 migration
        run: node scripts/apply-runtime-v12-switch.js
      - name: Enable verified v1.2 Menu capability
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one current-v1.2 boundary, found {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'src/offline-linker.js',
              'validateWindowRuntimeSupport(compiled);',
              '''validateWindowRuntimeSupport(compiled, {
            allowTables: true,
            allowLists: true,
            allowListControls: true,
            allowMenuDecorations: true
          });'''
          )
          replace_once(
              'web/native-build.js',
              'const support = validateWindowRuntimeSupport(preflight);',
              '''const support = validateWindowRuntimeSupport(preflight, {
              allowTables: true,
              allowLists: true,
              allowListControls: true,
              allowMenuDecorations: true
            });'''
          )
          replace_once('scripts/check-site.js', './src/sealed-native-gui.js', './src/sealed-native-gui-v11.js')
          replace_once('scripts/check-site.js', "'buildNativeGuiIR', 'sealNativeGuiRuntime',", "'buildNativeGuiIR', 'sealNativeGuiRuntimeV11',")
          replace_once('scripts/check-site.js', "'PATCH_SEALED_NATIVE_GUI_LIST_VERSION', 'Ready app download (no token)',", "'PATCH_SEALED_NATIVE_GUI_MENU_VERSION', 'Ready app download (no token)',")
      - name: Validate migrated JavaScript and current contracts
        run: |
          node --check src/offline-linker.js
          node --check src/sealed-native-package.js
          node --check web/native-build.js
          node --check scripts/seal-native-win32.js
          node --check scripts/seal-native-linux.js
          node --check scripts/seal-native-macos.js
          node --test tests/sealed-menu-payload-v11.test.js tests/offline-linker.test.js tests/studio-ready-v12.test.js tests/studio-runtime-integrity.test.js
          npm run build:site
          npm run check:site
      - name: Commit migrated consumer surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Migration produced no changes.'
            exit 0
          fi
          git commit -m 'Switch current sealed consumers to runtime v1.2'
          git push origin HEAD:agent/current-runtime-v12-switch
