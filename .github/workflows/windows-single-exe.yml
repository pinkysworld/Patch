name: Patch Windows Single EXE
run-name: Windows Single EXE ${{ inputs.request_id || inputs.app_name || 'PatchFormsDemo' }}

on:
  workflow_dispatch:
    inputs:
      source_b64:
        description: Base64-encoded Patch source from Patch Studio; leave empty to use source_path
        required: false
        default: ''
      source_path:
        description: Patch source file already committed in this repository when source_b64 is empty
        required: false
        default: examples/forms-navigation.patch
      app_name:
        description: Application name
        required: true
        default: PatchFormsDemo
      request_id:
        description: Studio request identifier
        required: false
        default: manual
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/windows-single-exe.yml
      - scripts/build-native-win32.js
      - src/native-gui-ir.js
      - src/win32-gui.js
      - src/compiler.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - web/native-build.js
      - tests/studio-windows-single-exe.test.js
      - examples/forms-navigation.patch
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-single-exe.yml
      - scripts/build-native-win32.js
      - src/native-gui-ir.js
      - src/win32-gui.js
      - src/compiler.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - examples/forms-navigation.patch

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      INPUT_SOURCE_B64: ${{ inputs.source_b64 }}
      INPUT_SOURCE_PATH: ${{ inputs.source_path }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Select Patch source and app name
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if (-not [string]::IsNullOrWhiteSpace($env:INPUT_SOURCE_B64)) {
              try {
                $bytes = [Convert]::FromBase64String($env:INPUT_SOURCE_B64)
              } catch {
                throw 'Studio source_b64 is not valid Base64.'
              }
              [System.IO.File]::WriteAllBytes((Join-Path $PWD 'studio.patch'), $bytes)
              $source = 'studio.patch'
            } else {
              $source = $env:INPUT_SOURCE_PATH
            }
            $name = $env:INPUT_APP_NAME
          } else {
            $source = 'examples/forms-navigation.patch'
            $name = 'PatchFormsDemo'
          }
          $safe = ($name -replace '[^A-Za-z0-9_-]', '_')
          if ($safe.Length -gt 64) { $safe = $safe.Substring(0, 64) }
          if ([string]::IsNullOrWhiteSpace($safe)) { $safe = 'PatchApp' }
          if (-not (Test-Path $source -PathType Leaf)) { throw "Patch source '$source' does not exist in this checkout." }
          if ([System.IO.Path]::GetExtension($source) -ne '.patch') { throw 'Windows Single EXE source must be a .patch file.' }
          "PATCH_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATCH_SAFE_NAME=$safe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check Patch source
        shell: pwsh
        run: node src/cli.js check $env:PATCH_SOURCE

      - name: Build direct native Win32 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-single-exe | Out-Null
          node scripts/build-native-win32.js $env:PATCH_SOURCE $env:PATCH_SAFE_NAME dist-single-exe --smoke

      - name: Verify single executable contract
        shell: pwsh
        run: |
          $exe = Join-Path 'dist-single-exe' ($env:PATCH_SAFE_NAME + '.exe')
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Direct Win32 build did not produce the expected executable.' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Output is not a Windows PE executable (missing MZ header).' }
          if ($bytes.Length -gt 5242880) { throw "Native executable unexpectedly exceeds 5 MiB: $($bytes.Length) bytes." }
          $metaPath = Join-Path 'dist-single-exe' ($env:PATCH_SAFE_NAME + '.win32-build.json')
          $meta = Get-Content $metaPath -Raw | ConvertFrom-Json
          if ($meta.shell -ne 'native-win32' -or $meta.electron -ne $false -or $meta.crt -ne 'static') {
            throw 'Native build metadata does not satisfy the single-EXE Win32 contract.'
          }
          if (Get-ChildItem dist-single-exe -Recurse -Filter 'patch-app.json') { throw 'patch-app.json must never be shipped with the single-EXE build.' }
          if (Test-Path 'dist-single-exe/node_modules') { throw 'node_modules must never be shipped with the single-EXE build.' }
          if (Get-ChildItem dist-single-exe -Recurse | Where-Object { $_.Name -match 'Electron|chrome-sandbox|resources' }) {
            throw 'Electron/Chromium runtime content was found in the direct native build output.'
          }
          Write-Host "Single native Windows executable verified: $exe ($($bytes.Length) bytes)"

      - name: Stage downloadable EXE only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deliverable | Out-Null
          Copy-Item (Join-Path 'dist-single-exe' ($env:PATCH_SAFE_NAME + '.exe')) (Join-Path 'deliverable' ($env:PATCH_SAFE_NAME + '.exe'))
          $files = @(Get-ChildItem deliverable -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') { throw 'Deliverable must contain exactly one .exe file.' }

      - uses: actions/upload-artifact@v7
        with:
          name: patch-windows-single-exe
          path: deliverable/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patch-windows-single-exe
          path: deliverable
      - name: Verify release payload remains one EXE
        shell: pwsh
        run: |
          $files = @(Get-ChildItem deliverable -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') { throw 'Release payload must contain exactly one .exe file.' }
          "PATCH_RELEASE_EXE=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish preview EXE release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-win32-preview-v0.1
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --title 'Patch Native Win32 Preview v0.1' --notes 'Direct Win32 Patch GUI preview. The Windows download is one statically linked application EXE with no patch-app.json, Electron, Chromium, Node.js, or sidecar runtime.'
          }
          gh release upload $env:TAG $env:PATCH_RELEASE_EXE --repo $env:GITHUB_REPOSITORY --clobber
