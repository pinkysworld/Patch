name: Patch Offline Compiler

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - native-runtime/**
      - scripts/build-offline-compiler.js
      - scripts/offline-compiler-runner.cjs
      - scripts/build-native-sea-template.js
      - scripts/offline-compiler-source-graph.js
      - scripts/offline-compiler-affected.js
      - scripts/copy-offline-compiler-source.js
      - package.json
      - docs/OFFLINE_COMPILER.md
      - web/downloads.html
      - examples/direct-wasm-recipes.patch
      - examples/responsive-window.patch
      - examples/table-native-v09.patch
      - examples/listbox-multiselect-native.patch
      - examples/menu-state-window.patch
      - examples/treeview-window.patch
      - examples/slider-window.patch
      - examples/chrome-window.patch
      - examples/shape-window.patch
      - examples/paintbox-window.patch
      - examples/paintbox-image-window.patch
      - .github/workflows/offline-compiler.yml
      - .github/workflows/native-sealed-window-icon-runtime-v110.yml
  push:
    branches: [main]
    paths:
      - src/**
      - native-runtime/**
      - scripts/build-offline-compiler.js
      - scripts/offline-compiler-runner.cjs
      - scripts/build-native-sea-template.js
      - scripts/offline-compiler-source-graph.js
      - scripts/offline-compiler-affected.js
      - scripts/copy-offline-compiler-source.js
      - package.json
      - docs/OFFLINE_COMPILER.md
      - web/downloads.html
      - examples/direct-wasm-recipes.patch
      - examples/responsive-window.patch
      - examples/table-native-v09.patch
      - examples/listbox-multiselect-native.patch
      - examples/menu-state-window.patch
      - examples/treeview-window.patch
      - examples/slider-window.patch
      - examples/chrome-window.patch
      - examples/shape-window.patch
      - examples/paintbox-window.patch
      - examples/paintbox-image-window.patch
      - .github/workflows/offline-compiler.yml
      - .github/workflows/native-sealed-window-icon-runtime-v110.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  affected:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
      reason: ${{ steps.affected.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Collect changed paths
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/offline-compiler-changed.txt"
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > "$out"
          else
            if [[ "${BEFORE:-}" =~ ^0+$ ]] || [ -z "${BEFORE:-}" ]; then
              gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[].filename' > "$out"
            else
              gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' > "$out"
            fi
          fi
          sort -u -o "$out" "$out"
          echo 'Changed paths considered by Offline Compiler preflight:'
          cat "$out"
      - name: Check real Offline Compiler dependency closure
        id: affected
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            echo 'reason=manual workflow dispatch' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/offline-compiler-affected.js --stdin < "$RUNNER_TEMP/offline-compiler-changed.txt"

  build:
    needs: affected
    if: needs.affected.outputs.affected == 'true'
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            asset: patch-windows-x64.exe
            runtime_tag: native-win32-runtime-v1.10
            runtime_asset: patch-windows-native-gui-runtime.exe
          - os: ubuntu-latest
            platform: linux
            asset: patch-linux-x64
            runtime_tag: native-linux-runtime-v1.10
            runtime_asset: patch-linux-native-gui-runtime.bin
          - os: macos-15
            platform: macos
            asset: patch-macos-arm64
            runtime_tag: native-macos-runtime-v1.10
            runtime_asset: patch-macos-native-gui-runtime.bin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install Linux Window build and smoke dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Download and verify Current Ready runtime v1.10
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ matrix.runtime_tag }}
          RUNTIME_ASSET: ${{ matrix.runtime_asset }}
          RUNTIME_SOURCE_SHA: e31a426dc21cb0929241fe96ab96e270ad182b32
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-runtime
          gh release download "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$RUNTIME_ASSET" --pattern SHA256SUMS.txt --dir current-runtime
          grep -Eq "^[0-9a-f]{64}  ${RUNTIME_ASSET}$" current-runtime/SHA256SUMS.txt
          (cd current-runtime && sha256sum -c SHA256SUMS.txt)
          expected="sha256:$(awk '{print $1}' current-runtime/SHA256SUMS.txt)"
          recorded="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RUNTIME_TAG" --jq ".assets[] | select(.name == \"$RUNTIME_ASSET\") | .digest")"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RUNTIME_TAG" --jq '.object.sha')"
          test "$recorded" = "$expected"
          test "$tag_sha" = "$RUNTIME_SOURCE_SHA"
      - name: Build host Console runtime
        shell: bash
        run: |
          mkdir -p offline-runtime dist-offline dist-smoke
          node scripts/build-native-sea-template.js --name PatchOfflineConsoleRuntime --out dist-offline/PatchOfflineConsoleRuntime --raw-out offline-runtime/console.bin
      - name: Build legacy Win32 runtime v1.8 compatibility underlay
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          $script = Join-Path $PWD 'offline-runtime\build-gui-legacy.cmd'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v18.cpp user32.lib gdi32.lib gdiplus.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:offline-runtime\gui-legacy.bin',
            'exit /b %errorlevel%'
          ) | Set-Content -Path $script -Encoding ascii
          & cmd.exe /d /c $script
          if ($LASTEXITCODE -ne 0) { throw "MSVC legacy GUI runtime build failed with exit code $LASTEXITCODE." }
      - name: Build legacy GTK runtime v1.8 compatibility underlay
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v18.cpp -o offline-runtime/gui-legacy.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x offline-runtime/gui-legacy.bin
      - name: Build legacy AppKit runtime v1.8 compatibility underlay
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -framework Cocoa \
            native-runtime/appkit-sealed-gui-v18.mm -o offline-runtime/gui-legacy.bin
          chmod +x offline-runtime/gui-legacy.bin
          test "$(lipo -archs offline-runtime/gui-legacy.bin)" = "arm64"
      - name: Build standalone Patch compiler with Current Ready v1.10
        shell: bash
        run: |
          node scripts/build-offline-compiler.js \
            --platform '${{ matrix.platform }}' \
            --console-runtime offline-runtime/console.bin \
            --gui-runtime offline-runtime/gui-legacy.bin \
            --gui-runtime-v19 'current-runtime/${{ matrix.runtime_asset }}' \
            --out "dist-offline/${{ matrix.asset }}"
      - name: Smoke compiler and Current Ready Window linking
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          "dist-offline/${{ matrix.asset }}" --version
          "dist-offline/${{ matrix.asset }}" check examples/direct-wasm-recipes.patch
          "dist-offline/${{ matrix.asset }}" build examples/direct-wasm-recipes.patch --kind console --target web --out dist-smoke/OfflineSmoke.html
          "dist-offline/${{ matrix.asset }}" link examples/direct-wasm-recipes.patch --name OfflineLinked --out dist-smoke/OfflineLinked
          "dist-offline/${{ matrix.asset }}" link examples/responsive-window.patch --name OfflineResponsive --out dist-smoke/OfflineResponsive
          "dist-offline/${{ matrix.asset }}" link examples/table-native-v09.patch --name OfflineTable --out dist-smoke/OfflineTable
          "dist-offline/${{ matrix.asset }}" link examples/listbox-multiselect-native.patch --name OfflineMulti --out dist-smoke/OfflineMulti
          "dist-offline/${{ matrix.asset }}" link examples/menu-state-window.patch --name OfflineMenu --out dist-smoke/OfflineMenu
          "dist-offline/${{ matrix.asset }}" link examples/treeview-window.patch --name OfflineTree --out dist-smoke/OfflineTree
          "dist-offline/${{ matrix.asset }}" link examples/slider-window.patch --name OfflineSlider --out dist-smoke/OfflineSlider
          "dist-offline/${{ matrix.asset }}" link examples/chrome-window.patch --name OfflineChrome --out dist-smoke/OfflineChrome
          "dist-offline/${{ matrix.asset }}" link examples/shape-window.patch --name OfflineShape --out dist-smoke/OfflineShape
          "dist-offline/${{ matrix.asset }}" link examples/paintbox-window.patch --name OfflinePaintBox --out dist-smoke/OfflinePaintBox
          "dist-offline/${{ matrix.asset }}" link examples/paintbox-image-window.patch --name OfflinePaintImage --out dist-smoke/OfflinePaintImage
          "dist-offline/${{ matrix.asset }}" link examples/responsive-window.patch --gui-payload-version 17 --name OfflineLegacy17 --out dist-smoke/OfflineLegacy17
          test -s dist-smoke/OfflineSmoke.html
      - name: Smoke linked Window apps on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          & ./dist-smoke/OfflineLinked.exe
          if ($LASTEXITCODE -ne 0) { throw "Linked Console smoke failed with exit code $LASTEXITCODE." }
          foreach ($name in @('OfflineResponsive','OfflineTable','OfflineMulti','OfflineMenu','OfflineTree','OfflineSlider','OfflineChrome','OfflineShape','OfflinePaintBox','OfflinePaintImage')) {
            & "./dist-smoke/$name.exe" --patch-smoke
            if ($LASTEXITCODE -ne 0) { throw "$name smoke failed with exit code $LASTEXITCODE." }
            $sealed = [System.IO.File]::ReadAllBytes((Resolve-Path "dist-smoke/$name.exe"))
            if ([BitConverter]::ToUInt32($sealed, $sealed.Length - 12) -ne 19) { throw "$name is not sealed Current Ready payload v19." }
          }
          & ./dist-smoke/OfflineLegacy17.exe --patch-smoke
          if ($LASTEXITCODE -ne 0) { throw "Legacy payload v17 smoke failed with exit code $LASTEXITCODE." }
          $legacy = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist-smoke/OfflineLegacy17.exe'))
          if ([BitConverter]::ToUInt32($legacy, $legacy.Length - 12) -ne 17) { throw 'Explicit compatibility output is not payload v17.' }
      - name: Smoke linked Window apps on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          chmod +x dist-smoke/OfflineLinked dist-smoke/OfflineResponsive dist-smoke/OfflineTable dist-smoke/OfflineMulti dist-smoke/OfflineMenu dist-smoke/OfflineTree dist-smoke/OfflineSlider dist-smoke/OfflineChrome dist-smoke/OfflineShape dist-smoke/OfflinePaintBox dist-smoke/OfflinePaintImage dist-smoke/OfflineLegacy17
          ./dist-smoke/OfflineLinked
          for name in OfflineResponsive OfflineTable OfflineMulti OfflineMenu OfflineTree OfflineSlider OfflineChrome OfflineShape OfflinePaintBox OfflinePaintImage; do
            xvfb-run -a "./dist-smoke/$name" --patch-smoke
          done
          xvfb-run -a ./dist-smoke/OfflineLegacy17 --patch-smoke
          node - <<'NODE'
          const fs=require('fs');
          for(const name of ['OfflineResponsive','OfflineTable','OfflineMulti','OfflineMenu','OfflineTree','OfflineSlider','OfflineChrome','OfflineShape','OfflinePaintBox','OfflinePaintImage']){
            const sealed=fs.readFileSync(`dist-smoke/${name}`);
            if(sealed.readUInt32LE(sealed.length-12)!==19) throw new Error(`${name} is not sealed Current Ready payload v19.`);
          }
          const legacy=fs.readFileSync('dist-smoke/OfflineLegacy17');
          if(legacy.readUInt32LE(legacy.length-12)!==17) throw new Error('Explicit compatibility output is not payload v17.');
          NODE
      - name: Smoke linked Window apps on macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          CONSOLE_APP=dist-smoke/OfflineLinked.app/Contents/MacOS/OfflineLinked
          test -x "$CONSOLE_APP"
          "$CONSOLE_APP"
          for name in OfflineResponsive OfflineTable OfflineMulti OfflineMenu OfflineTree OfflineSlider OfflineChrome OfflineShape OfflinePaintBox OfflinePaintImage; do
            APP="dist-smoke/$name.app/Contents/MacOS/$name"
            test -x "$APP"
            "$APP" --patch-smoke
            node - "$APP" <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync(process.argv[2]);
          if(sealed.readUInt32LE(sealed.length-12)!==19) throw new Error(`${process.argv[2]} is not sealed Current Ready payload v19.`);
          NODE
          done
          LEGACY=dist-smoke/OfflineLegacy17.app/Contents/MacOS/OfflineLegacy17
          "$LEGACY" --patch-smoke
          node - "$LEGACY" <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync(process.argv[2]);
          if(sealed.readUInt32LE(sealed.length-12)!==17) throw new Error('Explicit compatibility output is not payload v17.');
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: offline-compiler-${{ matrix.platform }}-${{ matrix.asset }}
          path: dist-offline/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  macos-intel-kit:
    needs: affected
    if: needs.affected.outputs.affected == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Download and verify universal Current Ready AppKit runtime v1.10
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SOURCE_SHA: e31a426dc21cb0929241fe96ab96e270ad182b32
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current-runtime
          gh release download native-macos-runtime-v1.10 --repo "$GITHUB_REPOSITORY" --pattern patch-macos-native-gui-runtime.bin --pattern SHA256SUMS.txt --dir current-runtime
          (cd current-runtime && sha256sum -c SHA256SUMS.txt)
          expected="sha256:$(awk '{print $1}' current-runtime/SHA256SUMS.txt)"
          recorded="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/native-macos-runtime-v1.10" --jq '.assets[] | select(.name == "patch-macos-native-gui-runtime.bin") | .digest')"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/native-macos-runtime-v1.10" --jq '.object.sha')"
          test "$recorded" = "$expected"
          test "$tag_sha" = "$RUNTIME_SOURCE_SHA"
          lipo -archs current-runtime/patch-macos-native-gui-runtime.bin | grep -qw x86_64
      - name: Build portable Intel macOS compiler kit with Current Ready v1.10
        shell: bash
        run: |
          ROOT=dist-intel/patch-macos-x64
          mkdir -p "$ROOT/runtime" dist-smoke
          node scripts/copy-offline-compiler-source.js "$ROOT"
          cp package.json LICENSE "$ROOT/"
          cp "$(command -v node)" "$ROOT/runtime/node"
          chmod +x "$ROOT/runtime/node"
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch x86_64 -framework Cocoa \
            native-runtime/appkit-sealed-gui-v18.mm -o "$ROOT/runtime/gui.bin"
          cp current-runtime/patch-macos-native-gui-runtime.bin "$ROOT/runtime/gui-v19.bin"
          chmod +x "$ROOT/runtime/gui.bin" "$ROOT/runtime/gui-v19.bin"
          cat > "$ROOT/patch" <<'EOF'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export PATCH_OFFLINE_NODE_RUNTIME="$ROOT/runtime/node"
          export PATCH_OFFLINE_GUI_RUNTIME="$ROOT/runtime/gui.bin"
          export PATCH_OFFLINE_GUI_RUNTIME_V19="$ROOT/runtime/gui-v19.bin"
          exec "$ROOT/runtime/node" "$ROOT/src/cli-entry.js" "$@"
          EOF
          chmod +x "$ROOT/patch"
          cat > "$ROOT/README.txt" <<'EOF'
          Patch macOS Intel offline compiler kit
          No installed Node.js runtime is required. The Intel Node runtime is included.
          Use: ./patch check app.patch
               ./patch run app.patch
               ./patch build app.patch --target web --out App.html
               ./patch link app.patch --out App
          Console link creates a portable .app containing direct Patch Wasm plus the embedded Intel Node runtime.
          Current Ready Window link uses Native GUI IR 1.9 / payload v19 / runtime v1.10 with Button ImageList and application/Form icon support. Use --gui-payload-version 17 only for explicit runtime-v1.8 compatibility output.
          EOF
          (cd dist-intel && tar -czf patch-macos-x64.tar.gz patch-macos-x64)
          test -s dist-intel/patch-macos-x64.tar.gz
      - name: Smoke Intel kit and Current Ready Window link paths
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          KIT=dist-intel/patch-macos-x64
          "$KIT/patch" check examples/direct-wasm-recipes.patch
          "$KIT/patch" build examples/direct-wasm-recipes.patch --kind console --target web --out dist-smoke/IntelSmoke.html
          "$KIT/patch" link examples/direct-wasm-recipes.patch --name IntelConsole --out dist-smoke/IntelConsole
          test -s dist-smoke/IntelSmoke.html
          CONSOLE_APP=dist-smoke/IntelConsole.app/Contents/MacOS/IntelConsole
          test -x "$CONSOLE_APP"
          actual="$("$CONSOLE_APP")"
          test "$actual" = "8"
          for pair in "responsive-window.patch IntelWindow" "table-native-v09.patch IntelTable" "listbox-multiselect-native.patch IntelMulti" "menu-state-window.patch IntelMenu" "treeview-window.patch IntelTree" "slider-window.patch IntelSlider" "chrome-window.patch IntelChrome" "shape-window.patch IntelShape" "paintbox-window.patch IntelPaintBox" "paintbox-image-window.patch IntelPaintImage"; do
            set -- $pair
            "$KIT/patch" link "examples/$1" --name "$2" --out "dist-smoke/$2"
            APP="dist-smoke/$2.app/Contents/MacOS/$2"
            test -x "$APP"
            "$APP" --patch-smoke
            node - "$APP" <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync(process.argv[2]);
          if(sealed.readUInt32LE(sealed.length-12)!==19) throw new Error('Intel offline compiler Window output is not sealed Current Ready payload v19.');
          NODE
          done
          "$KIT/patch" link examples/responsive-window.patch --gui-payload-version 17 --name IntelLegacy17 --out dist-smoke/IntelLegacy17
          LEGACY=dist-smoke/IntelLegacy17.app/Contents/MacOS/IntelLegacy17
          "$LEGACY" --patch-smoke
          node - "$LEGACY" <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync(process.argv[2]);
          if(sealed.readUInt32LE(sealed.length-12)!==17) throw new Error('Intel explicit compatibility output is not payload v17.');
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: offline-compiler-macos-intel
          path: dist-intel/patch-macos-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  freebsd-kit:
    needs: affected
    if: needs.affected.outputs.affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build portable FreeBSD offline kit
        shell: bash
        run: |
          ROOT=dist-freebsd/patch-freebsd-x64
          mkdir -p "$ROOT"
          node scripts/copy-offline-compiler-source.js "$ROOT"
          cp package.json LICENSE "$ROOT/"
          cat > "$ROOT/patch" <<'EOF'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec node "$ROOT/src/cli-entry.js" "$@"
          EOF
          chmod +x "$ROOT/patch"
          cat > "$ROOT/README.txt" <<'EOF'
          Patch FreeBSD offline compiler kit
          Requires Node.js 22+ and a C99-compatible cc on the FreeBSD host.
          After download no network access is required.
          Use: ./patch check app.patch
               ./patch run app.patch
               ./patch build app.patch --target web --out App.html
               ./patch link app.patch --out App
          Window/GUI linking is not supported on FreeBSD yet.
          EOF
          (cd dist-freebsd && tar -czf patch-freebsd-x64.tar.gz patch-freebsd-x64)
          test -s dist-freebsd/patch-freebsd-x64.tar.gz
          node --test tests/offline-linker.test.js tests/offline-compiler-source-graph.test.js tests/copy-offline-compiler-source.test.js
      - name: Smoke portable kit inside FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1.5.4
        with:
          release: '15.1'
          usesh: true
          run: |
            pkg install -y node24
            node --version
            cc --version | head -1
            tar -xzf dist-freebsd/patch-freebsd-x64.tar.gz -C dist-freebsd
            dist-freebsd/patch-freebsd-x64/patch check examples/direct-wasm-recipes.patch
            dist-freebsd/patch-freebsd-x64/patch link examples/direct-wasm-recipes.patch --name OfflineFreeBSD --out dist-freebsd/OfflineFreeBSD
            actual="$(dist-freebsd/OfflineFreeBSD)"
            test "$actual" = "8"
      - uses: actions/upload-artifact@v7
        with:
          name: offline-compiler-freebsd
          path: dist-freebsd/patch-freebsd-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.affected.outputs.affected == 'true'
    needs: [affected, build, macos-intel-kit, freebsd-kit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: offline-compiler-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum patch-windows-x64.exe patch-macos-arm64 patch-macos-x64.tar.gz patch-linux-x64 patch-freebsd-x64.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish Patch offline compiler v0.2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: offline-compiler-v0.2
        shell: bash
        run: |
