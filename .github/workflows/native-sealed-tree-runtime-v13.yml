name: Patch Native Sealed TreeView Runtime v1.3

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/sealed-native-gui-v12.js
      - src/native-gui-ir-v12.js
      - src/native-tree-backend-adapter.js
      - native-runtime/sealed-tree-v13.hpp
      - native-runtime/sealed-menu-v12.hpp
      - native-runtime/win32-sealed-gui-v13.cpp
      - native-runtime/appkit-sealed-gui-v13.mm
      - native-runtime/gtk-sealed-gui-v13.cpp
      - examples/treeview-window.patch
      - tests/sealed-tree-payload-v12.test.js
      - .github/workflows/native-sealed-tree-runtime-v13.yml
  push:
    branches: [main]
    paths:
      - src/sealed-native-gui-v12.js
      - src/native-gui-ir-v12.js
      - src/native-tree-backend-adapter.js
      - native-runtime/sealed-tree-v13.hpp
      - native-runtime/sealed-menu-v12.hpp
      - native-runtime/win32-sealed-gui-v13.cpp
      - native-runtime/appkit-sealed-gui-v13.mm
      - native-runtime/gtk-sealed-gui-v13.cpp
      - examples/treeview-window.patch
      - tests/sealed-tree-payload-v12.test.js
      - .github/workflows/native-sealed-tree-runtime-v13.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test sealed TreeView payload v12 contract
        run: node --test tests/sealed-tree-payload-v12.test.js tests/native-treeview.test.js

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build Win32 sealed TreeView runtime v1.3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-runtime-v13 | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v13.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-runtime-v13\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content dist-runtime-v13\build-tree-runtime.cmd -Encoding ascii
          & cmd.exe /d /c dist-runtime-v13\build-tree-runtime.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal canonical TreeView app as payload v12
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV12 } from './src/native-gui-ir-v12.js';
          import { sealNativeGuiRuntimeV12 } from './src/sealed-native-gui-v12.js';
          const source = fs.readFileSync('examples/treeview-window.patch', 'utf8');
          const ir = buildNativeGuiIRV12(compile(source, { name: 'SealedTreeView', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v13/patch-windows-native-gui-runtime.exe');
          const sealed = sealNativeGuiRuntimeV12(runtime, ir, { platform: 'windows' });
          fs.writeFileSync('SealedTreeView.exe', sealed);
          const footer = new DataView(sealed.buffer, sealed.byteOffset + sealed.byteLength - 20, 20);
          if (footer.getUint32(8, true) !== 12) throw new Error('Expected sealed payload v12.');
          NODE
      - name: Smoke sealed Win32 TreeView runtime v1.3
        shell: pwsh
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          $process = Start-Process -FilePath (Resolve-Path './SealedTreeView.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed TreeView runtime smoke failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v7
        with:
          name: patch-windows-native-gui-runtime-v13
          path: dist-runtime-v13/patch-windows-native-gui-runtime.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build universal AppKit sealed TreeView runtime v1.3
        run: |
          mkdir -p dist-runtime-v13
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -arch x86_64 -framework Cocoa native-runtime/appkit-sealed-gui-v13.mm -o dist-runtime-v13/patch-macos-native-gui-runtime.bin
          chmod +x dist-runtime-v13/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime-v13/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal canonical TreeView app as payload v12
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV12 } from './src/native-gui-ir-v12.js';
          import { sealNativeGuiRuntimeV12 } from './src/sealed-native-gui-v12.js';
          const source = fs.readFileSync('examples/treeview-window.patch', 'utf8');
          const ir = buildNativeGuiIRV12(compile(source, { name: 'SealedTreeView', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v13/patch-macos-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV12(runtime, ir, { platform: 'macos' });
          fs.writeFileSync('SealedTreeView', sealed); fs.chmodSync('SealedTreeView', 0o755);
          NODE
      - name: Smoke sealed AppKit TreeView runtime v1.3
        run: ./SealedTreeView --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-macos-native-gui-runtime-v13
          path: dist-runtime-v13/patch-macos-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build GTK3 sealed TreeView runtime v1.3
        run: |
          mkdir -p dist-runtime-v13
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v13.cpp -o dist-runtime-v13/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-runtime-v13/patch-linux-native-gui-runtime.bin
      - name: Seal canonical TreeView app as payload v12
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV12 } from './src/native-gui-ir-v12.js';
          import { sealNativeGuiRuntimeV12 } from './src/sealed-native-gui-v12.js';
          const source = fs.readFileSync('examples/treeview-window.patch', 'utf8');
          const ir = buildNativeGuiIRV12(compile(source, { name: 'SealedTreeView', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v13/patch-linux-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV12(runtime, ir, { platform: 'linux' });
          fs.writeFileSync('SealedTreeView', sealed); fs.chmodSync('SealedTreeView', 0o755);
          NODE
      - name: Smoke sealed GTK TreeView runtime v1.3
        run: xvfb-run -a ./SealedTreeView --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-linux-native-gui-runtime-v13
          path: dist-runtime-v13/patch-linux-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patch-windows-native-gui-runtime-v13
          path: runtime/windows
      - uses: actions/download-artifact@v8
        with:
          name: patch-macos-native-gui-runtime-v13
          path: runtime/macos
      - uses: actions/download-artifact@v8
        with:
          name: patch-linux-native-gui-runtime-v13
          path: runtime/linux
      - name: Publish native runtime v1.3 templates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          publish_runtime() {
            local tag="$1" title="$2" asset="$3" notes="$4"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          }
          publish_runtime native-win32-runtime-v1.3 'Patch Native Win32 Runtime v1.3' runtime/windows/patch-windows-native-gui-runtime.exe 'Token-free Win32 sealed-GUI runtime v1.3. Consumes payload v12 / Native GUI IR 1.2 with hierarchical TreeView and semantic root-to-node text-list selection, plus the full v1.2 Table, persistent list, ListBox and Menu contract.'
          publish_runtime native-macos-runtime-v1.3 'Patch Native macOS Runtime v1.3' runtime/macos/patch-macos-native-gui-runtime.bin 'Unsigned universal AppKit sealed-GUI runtime v1.3. Consumes payload v12 / Native GUI IR 1.2 with hierarchical TreeView and semantic root-to-node text-list selection, plus the full v1.2 Table, persistent list, ListBox and Menu contract.'
          publish_runtime native-linux-runtime-v1.3 'Patch Native Linux Runtime v1.3' runtime/linux/patch-linux-native-gui-runtime.bin 'GTK3 sealed-GUI runtime v1.3. Consumes payload v12 / Native GUI IR 1.2 with hierarchical TreeView and semantic root-to-node text-list selection, plus the full v1.2 Table, persistent list, ListBox and Menu contract.'
