name: Patch Native Sealed PaintBox Image Runtime v1.8

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/sealed-native-gui-v17.js'
      - 'src/native-gui-ir-v17.js'
      - 'src/native-paintbox-image-backend-adapter.js'
      - 'src/native-current-contract.js'
      - 'native-runtime/sealed-paintbox-image-v18.hpp'
      - 'native-runtime/sealed-paintbox-v17.hpp'
      - 'native-runtime/win32-sealed-gui-v18.cpp'
      - 'native-runtime/appkit-sealed-gui-v18.mm'
      - 'native-runtime/gtk-sealed-gui-v18.cpp'
      - 'examples/paintbox-image-window.patch'
      - 'examples/paintbox-window.patch'
      - 'examples/shape-window.patch'
      - 'tests/native-paintbox-image.test.js'
      - 'tests/native-runtime-v18-sources.test.js'
      - '.github/workflows/native-sealed-paintbox-image-runtime-v18.yml'
  push:
    branches: [main]
    paths:
      - 'src/sealed-native-gui-v17.js'
      - 'src/native-gui-ir-v17.js'
      - 'src/native-paintbox-image-backend-adapter.js'
      - 'src/native-current-contract.js'
      - 'native-runtime/sealed-paintbox-image-v18.hpp'
      - 'native-runtime/sealed-paintbox-v17.hpp'
      - 'native-runtime/win32-sealed-gui-v18.cpp'
      - 'native-runtime/appkit-sealed-gui-v18.mm'
      - 'native-runtime/gtk-sealed-gui-v18.cpp'
      - 'examples/paintbox-image-window.patch'
      - 'examples/paintbox-window.patch'
      - 'examples/shape-window.patch'
      - 'tests/native-paintbox-image.test.js'
      - 'tests/native-runtime-v18-sources.test.js'
      - '.github/workflows/native-sealed-paintbox-image-runtime-v18.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test sealed PaintBox image payload v17 / runtime v1.8 contract
        run: node --test tests/native-runtime-v18-sources.test.js tests/native-paintbox-image.test.js

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build Win32 sealed PaintBox image runtime v1.8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-runtime-v18 | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v18.cpp user32.lib gdi32.lib gdiplus.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-runtime-v18\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content dist-runtime-v18\build-paintbox-runtime.cmd -Encoding ascii
          & cmd.exe /d /c dist-runtime-v18\build-paintbox-runtime.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal payload v17 and smoke Win32 runtime
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV17 } from './src/native-gui-ir-v17.js';
          import { sealNativeGuiRuntimeV17 } from './src/sealed-native-gui-v17.js';
          const source = fs.readFileSync('examples/paintbox-image-window.patch', 'utf8');
          const ir = buildNativeGuiIRV17(compile(source, { name: 'SealedPaintImage', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v18/patch-windows-native-gui-runtime.exe');
          const sealed = sealNativeGuiRuntimeV17(runtime, ir, { platform: 'windows' });
          fs.writeFileSync('SealedPaintImage.exe', sealed);
          '@ | Set-Content seal-paintbox.mjs -Encoding utf8
          node seal-paintbox.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload v17 sealing failed.' }
          $process = Start-Process -FilePath (Resolve-Path './SealedPaintImage.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed PaintBox image runtime smoke failed with exit code $($process.ExitCode)." }
      - name: Seal Shape and PaintBox Stage 1 examples through image runtime
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV17 } from './src/native-gui-ir-v17.js';
          import { sealNativeGuiRuntimeV17 } from './src/sealed-native-gui-v17.js';
          const source = fs.readFileSync('examples/shape-window.patch', 'utf8');
          const ir = buildNativeGuiIRV17(compile(source, { name: 'SealedShape', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v18/patch-windows-native-gui-runtime.exe');
          const sealed = sealNativeGuiRuntimeV17(runtime, ir, { platform: 'windows' });
          fs.writeFileSync('SealedShape.exe', sealed);
          '@ | Set-Content seal-shape.mjs -Encoding utf8
          node seal-shape.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Shape-on-v18 sealing failed.' }
          $process = Start-Process -FilePath (Resolve-Path './SealedShape.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed Shape-on-v18 smoke failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v7
        with:
          name: patch-windows-native-gui-runtime-v18
          path: dist-runtime-v18/patch-windows-native-gui-runtime.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build universal AppKit sealed PaintBox image runtime v1.8
        run: |
          mkdir -p dist-runtime-v18
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -arch x86_64 -framework Cocoa native-runtime/appkit-sealed-gui-v18.mm -o dist-runtime-v18/patch-macos-native-gui-runtime.bin
          chmod +x dist-runtime-v18/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime-v18/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal payload v17 and smoke AppKit runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV17 } from './src/native-gui-ir-v17.js';
          import { sealNativeGuiRuntimeV17 } from './src/sealed-native-gui-v17.js';
          const source = fs.readFileSync('examples/paintbox-image-window.patch', 'utf8');
          const ir = buildNativeGuiIRV17(compile(source, { name: 'SealedPaintImage', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v18/patch-macos-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV17(runtime, ir, { platform: 'macos' });
          fs.writeFileSync('SealedPaintImage', sealed); fs.chmodSync('SealedPaintImage', 0o755);
          NODE
          ./SealedPaintImage --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-macos-native-gui-runtime-v18
          path: dist-runtime-v18/patch-macos-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build GTK3 sealed PaintBox image runtime v1.8
        run: |
          mkdir -p dist-runtime-v18
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v18.cpp -o dist-runtime-v18/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-runtime-v18/patch-linux-native-gui-runtime.bin
      - name: Seal payload v17 and smoke GTK runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV17 } from './src/native-gui-ir-v17.js';
          import { sealNativeGuiRuntimeV17 } from './src/sealed-native-gui-v17.js';
          const source = fs.readFileSync('examples/paintbox-image-window.patch', 'utf8');
          const ir = buildNativeGuiIRV17(compile(source, { name: 'SealedPaintImage', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v18/patch-linux-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV17(runtime, ir, { platform: 'linux' });
          fs.writeFileSync('SealedPaintImage', sealed); fs.chmodSync('SealedPaintImage', 0o755);
          NODE
          xvfb-run -a ./SealedPaintImage --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-linux-native-gui-runtime-v18
          path: dist-runtime-v18/patch-linux-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patch-windows-native-gui-runtime-v18
          path: runtime/windows
      - uses: actions/download-artifact@v8
        with:
          name: patch-macos-native-gui-runtime-v18
          path: runtime/macos
      - uses: actions/download-artifact@v8
        with:
          name: patch-linux-native-gui-runtime-v18
          path: runtime/linux
      - name: Publish native runtime v1.8 templates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          publish_runtime() {
            local tag="$1" title="$2" asset="$3" notes="$4"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          }
          publish_runtime native-win32-runtime-v1.8 'Patch Native Win32 Runtime v1.8' runtime/windows/patch-windows-native-gui-runtime.exe 'Token-free Win32 sealed GUI runtime v1.8 for payload v17 / Native GUI IR 1.7. Adds PaintBox draw image PNG/JPEG while retaining PaintBox Stage 1, Shape, Chrome, Slider, TreeView, Table, ListBox and Menu behavior.'
          publish_runtime native-macos-runtime-v1.8 'Patch Native macOS Runtime v1.8' runtime/macos/patch-macos-native-gui-runtime.bin 'Unsigned universal AppKit sealed GUI runtime v1.8 for payload v17 / Native GUI IR 1.7. Adds NSImage PaintBox draw image while retaining the frozen v1.7 PaintBox Stage 1 contract.'
          publish_runtime native-linux-runtime-v1.8 'Patch Native Linux Runtime v1.8' runtime/linux/patch-linux-native-gui-runtime.bin 'GTK3 sealed GUI runtime v1.8 for payload v17 / Native GUI IR 1.7. Adds GdkPixbuf PaintBox draw image while retaining the frozen v1.7 PaintBox Stage 1 contract.'
