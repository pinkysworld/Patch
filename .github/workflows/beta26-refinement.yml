name: Patch Beta26 Call Refinement

on:
  pull_request:
  push:
    branches: [feature/beta26-concrete-call-substitution]

permissions:
  contents: read

jobs:
  lean-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Check beta.26 concrete call binding and abstract-interval bridge
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls
          lake env lean PatchCallSubstitution.lean
          lake env lean PatchCallRefinement.lean
      - name: Reject unfinished beta.26 proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/PatchCallSubstitution.lean formal/PatchCallRefinement.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi
