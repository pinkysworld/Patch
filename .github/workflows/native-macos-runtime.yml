name: Patch Native macOS Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/native-macos-runtime.yml
      - native-runtime/appkit-sealed-gui.mm
      - scripts/seal-native-macos.js
      - src/sealed-native-gui.js
      - src/sealed-native-package.js
      - src/native-gui-ir.js
      - src/compiler.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - examples/forms-navigation.patch
      - web/native-build.js
      - scripts/build-site.js
      - scripts/check-site.js
      - tests/sealed-native-gui.test.js
      - tests/studio-macos-native-gui.test.js
      - docs/NATIVE_GUI.md
      - docs/ROADMAP.md
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/native-macos-runtime.yml
      - native-runtime/appkit-sealed-gui.mm
      - scripts/seal-native-macos.js
      - src/sealed-native-gui.js
      - src/sealed-native-package.js
      - src/native-gui-ir.js
      - src/compiler.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - examples/forms-navigation.patch
      - web/native-build.js
      - scripts/build-site.js
      - scripts/check-site.js
      - tests/sealed-native-gui.test.js
      - tests/studio-macos-native-gui.test.js
      - docs/NATIVE_GUI.md
      - docs/ROADMAP.md
      - .github/workflows/pages.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Compile universal native AppKit GUI runtime
        shell: bash
        run: |
          mkdir -p dist-runtime
          clang++ -std=c++17 -O2 -mmacosx-version-min=11.0 \
            -arch arm64 -arch x86_64 -framework Cocoa \
            native-runtime/appkit-sealed-gui.mm \
            -o dist-runtime/patch-macos-native-gui-runtime.bin
          chmod +x dist-runtime/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime/patch-macos-native-gui-runtime.bin)"
          echo "Universal runtime architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal canonical Patch Forms app into runtime
        shell: bash
        run: |
          node scripts/seal-native-macos.js \
            examples/forms-navigation.patch \
            dist-runtime/patch-macos-native-gui-runtime.bin \
            dist-runtime/PatchSealedForms \
            PatchSealedForms
      - name: Smoke run sealed native AppKit executable
        shell: bash
        run: dist-runtime/PatchSealedForms --patch-smoke
      - name: Verify universal Mach-O and sealed runtime contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const runtime = fs.readFileSync('dist-runtime/patch-macos-native-gui-runtime.bin');
          const sealed = fs.readFileSync('dist-runtime/PatchSealedForms');
          const magic = runtime.subarray(0, 4).toString('hex');
          const allowed = new Set(['cffaedfe','feedfacf','cefaedfe','feedface','cafebabe','bebafeca','cafebabf','bfbafeca']);
          if (!allowed.has(magic)) throw new Error(`Runtime is not a recognized Mach-O binary: ${magic}`);
          if (sealed.length <= runtime.length) throw new Error('Sealed application did not append a payload.');
          if (sealed.subarray(sealed.length - 20, sealed.length - 12).toString('ascii') !== 'PCHGUI01') throw new Error('Sealed executable footer magic is missing.');
          if (runtime.length > 4 * 1024 * 1024) throw new Error(`Universal native AppKit runtime unexpectedly exceeds 4 MiB: ${runtime.length} bytes.`);
          console.log(`Universal AppKit runtime: ${runtime.length} bytes; sealed Forms app: ${sealed.length} bytes`);
          NODE
          test -x dist-runtime/PatchSealedForms
          file dist-runtime/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          if otool -L dist-runtime/patch-macos-native-gui-runtime.bin | grep -Ei 'electron|chromium|node' ; then
            echo 'Native AppKit runtime unexpectedly links an Electron/Chromium/Node library.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: patch-macos-native-gui-runtime
          path: dist-runtime/patch-macos-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: patch-macos-native-gui-runtime
          path: runtime
      - name: Publish native AppKit runtime template
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-macos-runtime-v0.1
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Patch Native macOS Runtime v0.1' --notes 'Unsigned universal AppKit sealed-GUI runtime template for token-free Patch Studio builds. The Mach-O runtime contains arm64 and x86_64 slices. Studio appends checked Native GUI IR and creates a macOS app bundle. No Electron, Chromium, Node.js or sidecar payload is used. Signing/notarization is separate because browser-side sealing changes the executable after template publication.'
          fi
          gh release upload "$TAG" runtime/patch-macos-native-gui-runtime.bin --repo "$GITHUB_REPOSITORY" --clobber
