name: TreeView Node Icons Stage 1 Helper

on:
  push:
    branches:
      - rad/treeview-node-icons-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/treeview-node-icons-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply TreeView node icons Stage 1
        run: node scripts/_treeview-node-icons-stage1.mjs
      - name: Apply TreeView compatibility fixes
        run: node scripts/_treeview-node-icons-fix.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused TreeView regressions
        run: npm test -- tests/treeview-node-icons-stage1.test.js tests/treeview-stage1.test.js tests/treeview-standalone-web.test.js tests/designer-data-editors.test.js tests/designer-tree-duplicate.test.js tests/studio-window-renderer.test.js tests/studio-showcase.test.js
      - name: Full repository tests
        run: npm test
      - name: Example and project gates
        run: |
          npm run check
          npm run check:project
      - name: Public site gate
        run: |
          npm run build:site
          npm run check:site
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.js src/compiler.js src/designer-data.js src/designer-tabs-nested.js src/designer.js src/interpreter.js src/window-build.js src/window-webapp.js src/window-compiled.js src/webapp.js web/studio-window-renderer.js web/style.css web/designer-data-editor.js web/designer-tabs-nested.js src/tree-node-image.js tests/treeview-node-icons-stage1.test.js tests/treeview-standalone-web.test.js
          git commit -m "RAD: add TreeView node icons Stage 1 [skip ci]"
          git push origin HEAD:rad/treeview-node-icons-stage1
