name: SpinEdit Stage 1 helper

on:
  push:
    branches:
      - spinedit-stage1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spinedit-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SpinEdit Stage 1
        run: python scripts/apply-spinedit-stage1.py
      - name: Run focused regressions
        run: node --test tests/spinedit-stage1.test.js tests/progressbar-stage1.test.js tests/slider-stage1.test.js
      - name: Commit generated implementation
        run: |
          rm .github/workflows/spinedit-core-helper.yml scripts/apply-spinedit-stage1.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/window-layout-policy.js src/slider-presentation.js src/window-build.js src/window-compiled.js src/window-webapp.js src/native-current-contract.js src/window-web-paintbox.js web/slider-stage1.js tests/progressbar-stage1.test.js tests/spinedit-stage1.test.js .github/workflows/spinedit-core-helper.yml scripts/apply-spinedit-stage1.py
          git commit -m "feat: add SpinEdit Stage 1 for Studio and Web"
          git push origin HEAD:spinedit-stage1
