name: Patch Formal Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4 proofs + generated certificates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate static certificate from production compiler
        run: npm run certify:example
      - name: Execute direct Wasm and generate runtime correspondence certificate
        run: npm run runtime-certify:example
      - name: Generate recipe-call composition certificate from production compiler
        run: npm run call-certify:example
      - name: Install Elan and pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Build Lean formalization, checker, evidence, source, range, runtime, guarded and call boundaries
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls
      - name: Verify generated production certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedCertificate.lean
      - name: Verify generated direct-runtime correspondence certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedRuntimeCertificate.lean
      - name: Verify generated recipe-call composition certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedCallCertificate.lean
      - name: Reject unfinished proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -R -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/*.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Unfinished Lean proof found.'
            exit 1
          fi
