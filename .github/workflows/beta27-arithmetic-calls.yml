name: Patch Beta27 Arithmetic Calls

# Compatibility gate retained for explicit/manual use. Beta.27 coverage is also
# exercised by the standard Patch CI and Formal Verification workflows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run concrete call certificate tests
        run: node --test tests/concrete-call-certificate.test.js
      - name: Generate arithmetic concrete call certificate
        run: node scripts/generate-concrete-call-certificate.js examples/formal-calls-arithmetic.patch --out formal/GeneratedArithmeticCallCertificate.lean
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Check arithmetic call certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls PatchCallSubstitution PatchCallRefinement PatchCallEffect
          lake env lean GeneratedArithmeticCallCertificate.lean
      - name: Reject unfinished arithmetic certificate proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/GeneratedArithmeticCallCertificate.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi
