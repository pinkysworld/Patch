name: ScrollBar Stage 1 Helper

on:
  push:
    branches:
      - rad/scrollbar-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/scrollbar-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fix helper anchors
        run: node scripts/_scrollbar-harness-fix.mjs
      - name: Apply ScrollBar Stage 1
        run: node scripts/_scrollbar-stage1.mjs
      - name: Apply ScrollBar integration fixes
        run: node scripts/_scrollbar-product-fix.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused ScrollBar regression tests
        run: npm test -- tests/scrollbar-stage1.test.js tests/progressbar-stage1.test.js tests/designer-presentation-metadata-lifecycle.test.js tests/studio-showcase.test.js tests/studio-showcase-loader.test.js tests/docs-current-studio-surface.test.js
      - name: Full repository tests
        run: npm test
      - name: Example and project gates
        run: |
          npm run check
          npm run check:project
      - name: Public site gate
        run: |
          npm run build:site
          npm run check:site
      - name: Commit verified ScrollBar Stage 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/window-layout-policy.js \
            src/slider-presentation.js \
            src/window-build.js \
            src/window-compiled.js \
            src/window-webapp.js \
            src/native-current-contract.js \
            src/window-web-paintbox.js \
            web/slider-stage1.js \
            tests/progressbar-stage1.test.js \
            tests/scrollbar-stage1.test.js \
            docs/RAD_STUDIO_MASTER_BACKLOG.md \
            docs/ROADMAP.md \
            docs/STUDIO_AUTHORING_SURFACE.md \
            README.md \
            web/index.html \
            examples/patch-studio-showcase/main.patch \
            examples/patch-studio-showcase/forms.patch \
            examples/patch-studio-showcase/logic.patch \
            examples/patch-studio-showcase/README.md \
            examples/patch-studio-showcase.patchproject \
            web/studio-showcase-project.js \
            tests/studio-showcase.test.js \
            tests/docs-current-studio-surface.test.js
          git commit -m "RAD: add ScrollBar Stage 1 [skip ci]"
          git push origin HEAD:rad/scrollbar-stage1
