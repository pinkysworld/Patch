name: Patch Native Win32 GUI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/native-gui-ir.js
      - src/native-result-dialog-overlay.js
      - src/native-accessibility.js
      - src/win32-gui.js
      - src/win32-gui-v07.js
      - src/win32-gui-v08.js
      - scripts/build-native-win32.js
      - tests/native-accessibility.test.js
      - tests/win32-gui.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - examples/forms-navigation.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - docs/NATIVE_ACCESSIBILITY.md
      - .github/workflows/native-win32-gui.yml
  push:
    branches: [main]
    paths:
      - src/native-gui-ir.js
      - src/native-result-dialog-overlay.js
      - src/native-accessibility.js
      - src/win32-gui.js
      - src/win32-gui-v07.js
      - src/win32-gui-v08.js
      - scripts/build-native-win32.js
      - tests/native-accessibility.test.js
      - tests/win32-gui.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - examples/forms-navigation.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - docs/NATIVE_ACCESSIBILITY.md
      - .github/workflows/native-win32-gui.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-win32:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Check native GUI backend JavaScript
        shell: pwsh
        run: |
          node --check src/native-gui-ir.js
          node --check src/native-result-dialog-overlay.js
          node --check src/native-accessibility.js
          node --check src/win32-gui.js
          node --check src/win32-gui-v07.js
          node --check src/win32-gui-v08.js
          node --check scripts/build-native-win32.js
          node --check tests/native-accessibility.test.js
          node --check tests/win32-gui.test.js
          node --check tests/menu-dialog-window.test.js
          node --check tests/result-dialog-window.test.js
      - name: Run native GUI lowering and accessibility tests
        shell: pwsh
        run: node --test tests/native-accessibility.test.js tests/win32-gui.test.js tests/menu-dialog-window.test.js tests/result-dialog-window.test.js
      - name: Compile and link native Patch Win32 Forms application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-native | Out-Null
          node scripts/build-native-win32.js examples/forms-navigation.patch PatchNativeWin32Smoke dist-native --smoke
      - name: Compile and execute native Patch Win32 Menu Dialog application
        shell: pwsh
        run: node scripts/build-native-win32.js examples/menu-dialog-window.patch PatchNativeWin32MenuDialog dist-native-menu-dialog --smoke
      - name: Compile and execute native Patch Win32 Result Dialog application
        shell: pwsh
        run: node scripts/build-native-win32.js examples/result-dialog-window.patch PatchNativeWin32ResultDialog dist-native-result-dialog --smoke
      - name: Verify native output contract
        shell: pwsh
        run: |
          $apps = @(
            @{ Name='PatchNativeWin32Smoke'; Dir='dist-native' },
            @{ Name='PatchNativeWin32MenuDialog'; Dir='dist-native-menu-dialog' },
            @{ Name='PatchNativeWin32ResultDialog'; Dir='dist-native-result-dialog' }
          )
          foreach ($app in $apps) {
            $name = $app.Name; $dir = $app.Dir
            $exe = Get-Item "$dir/$name.exe"
            if (-not $exe) { throw "Native Patch Win32 executable $name was not produced." }
            if ($exe.Length -gt 10MB) { throw "Native Patch Win32 executable is unexpectedly large: $($exe.Length) bytes" }
            $meta = Get-Content "$dir/$name.win32-build.json" | ConvertFrom-Json
            if ($meta.electron -ne $false -or $meta.shell -ne 'native-win32' -or $meta.crt -ne 'static') { throw "Native Win32 metadata failed for $name." }
            if ($meta.nativeGuiIrVersion -ne '1.2' -or $meta.backendVersion -ne '1.3') { throw "Expected Native GUI IR 1.2 / backend 1.3 for $name." }
          }
          if ((Test-Path dist-native/resources) -or (Test-Path dist-native/node_modules)) { throw 'Native Win32 output unexpectedly contains a web/Electron runtime tree.' }
      - name: Upload native compiler evidence
        uses: actions/upload-artifact@v7
        with:
          name: patch-native-win32-gui
          path: |
            dist-native/**
            dist-native-menu-dialog/**
            dist-native-result-dialog/**
          if-no-files-found: error