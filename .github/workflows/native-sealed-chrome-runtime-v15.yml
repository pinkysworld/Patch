name: Patch Native Sealed Chrome Runtime v1.5

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/sealed-native-gui-v14.js'
      - 'src/native-gui-ir-v14.js'
      - 'src/native-chrome-backend-adapter.js'
      - 'src/native-current-contract.js'
      - 'native-runtime/sealed-chrome-v15.hpp'
      - 'native-runtime/sealed-slider-v14.hpp'
      - 'native-runtime/picture-data-v15.hpp'
      - 'native-runtime/win32-sealed-gui-v15.cpp'
      - 'native-runtime/appkit-sealed-gui-v15.mm'
      - 'native-runtime/gtk-sealed-gui-v15.cpp'
      - 'examples/chrome-window.patch'
      - 'examples/slider-window.patch'
      - 'tests/sealed-chrome-payload-v14.test.js'
      - 'tests/native-runtime-v15-sources.test.js'
      - '.github/workflows/native-sealed-chrome-runtime-v15.yml'
  push:
    branches: [main]
    paths:
      - 'src/sealed-native-gui-v14.js'
      - 'src/native-gui-ir-v14.js'
      - 'src/native-chrome-backend-adapter.js'
      - 'src/native-current-contract.js'
      - 'native-runtime/sealed-chrome-v15.hpp'
      - 'native-runtime/sealed-slider-v14.hpp'
      - 'native-runtime/picture-data-v15.hpp'
      - 'native-runtime/win32-sealed-gui-v15.cpp'
      - 'native-runtime/appkit-sealed-gui-v15.mm'
      - 'native-runtime/gtk-sealed-gui-v15.cpp'
      - 'examples/chrome-window.patch'
      - 'examples/slider-window.patch'
      - 'tests/sealed-chrome-payload-v14.test.js'
      - 'tests/native-runtime-v15-sources.test.js'
      - '.github/workflows/native-sealed-chrome-runtime-v15.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test sealed Chrome payload v14 / runtime v1.5 contract
        run: node --test tests/native-runtime-v15-sources.test.js tests/sealed-chrome-payload-v14.test.js

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build Win32 sealed Chrome runtime v1.5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-runtime-v15 | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v15.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-runtime-v15\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content dist-runtime-v15\build-chrome-runtime.cmd -Encoding ascii
          & cmd.exe /d /c dist-runtime-v15\build-chrome-runtime.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal payload v14 and smoke Win32 runtime
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV14 } from './src/native-gui-ir-v14.js';
          import { sealNativeGuiRuntimeV14 } from './src/sealed-native-gui-v14.js';
          const source = fs.readFileSync('examples/chrome-window.patch', 'utf8');
          const ir = buildNativeGuiIRV14(compile(source, { name: 'SealedChrome', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v15/patch-windows-native-gui-runtime.exe');
          const sealed = sealNativeGuiRuntimeV14(runtime, ir, { platform: 'windows' });
          fs.writeFileSync('SealedChrome.exe', sealed);
          '@ | Set-Content seal-chrome.mjs -Encoding utf8
          node seal-chrome.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload v14 sealing failed.' }
          $process = Start-Process -FilePath (Resolve-Path './SealedChrome.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed Chrome runtime smoke failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v7
        with:
          name: patch-windows-native-gui-runtime-v15
          path: dist-runtime-v15/patch-windows-native-gui-runtime.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build universal AppKit sealed Chrome runtime v1.5
        run: |
          mkdir -p dist-runtime-v15
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -arch x86_64 -framework Cocoa native-runtime/appkit-sealed-gui-v15.mm -o dist-runtime-v15/patch-macos-native-gui-runtime.bin
          chmod +x dist-runtime-v15/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime-v15/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal payload v14 and smoke AppKit runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV14 } from './src/native-gui-ir-v14.js';
          import { sealNativeGuiRuntimeV14 } from './src/sealed-native-gui-v14.js';
          const source = fs.readFileSync('examples/chrome-window.patch', 'utf8');
          const ir = buildNativeGuiIRV14(compile(source, { name: 'SealedChrome', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v15/patch-macos-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV14(runtime, ir, { platform: 'macos' });
          fs.writeFileSync('SealedChrome', sealed); fs.chmodSync('SealedChrome', 0o755);
          NODE
          ./SealedChrome --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-macos-native-gui-runtime-v15
          path: dist-runtime-v15/patch-macos-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build GTK3 sealed Chrome runtime v1.5
        run: |
          mkdir -p dist-runtime-v15
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v15.cpp -o dist-runtime-v15/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-runtime-v15/patch-linux-native-gui-runtime.bin
      - name: Seal payload v14 and smoke GTK runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV14 } from './src/native-gui-ir-v14.js';
          import { sealNativeGuiRuntimeV14 } from './src/sealed-native-gui-v14.js';
          const source = fs.readFileSync('examples/chrome-window.patch', 'utf8');
          const ir = buildNativeGuiIRV14(compile(source, { name: 'SealedChrome', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v15/patch-linux-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV14(runtime, ir, { platform: 'linux' });
          fs.writeFileSync('SealedChrome', sealed); fs.chmodSync('SealedChrome', 0o755);
          NODE
          xvfb-run -a ./SealedChrome --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-linux-native-gui-runtime-v15
          path: dist-runtime-v15/patch-linux-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patch-windows-native-gui-runtime-v15
          path: runtime/windows
      - uses: actions/download-artifact@v8
        with:
          name: patch-macos-native-gui-runtime-v15
          path: runtime/macos
      - uses: actions/download-artifact@v8
        with:
          name: patch-linux-native-gui-runtime-v15
          path: runtime/linux
      - name: Publish native runtime v1.5 templates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          publish_runtime() {
            local tag="$1" title="$2" asset="$3" notes="$4"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          }
          publish_runtime native-win32-runtime-v1.5 'Patch Native Win32 Runtime v1.5' runtime/windows/patch-windows-native-gui-runtime.exe 'Token-free Win32 sealed GUI runtime v1.5 for payload v14 / Native GUI IR 1.4. Adds native Panel, Timer, PictureBox and StatusBar while retaining Slider, TreeView, Table, ListBox and Menu behavior.'
          publish_runtime native-macos-runtime-v1.5 'Patch Native macOS Runtime v1.5' runtime/macos/patch-macos-native-gui-runtime.bin 'Unsigned universal AppKit sealed GUI runtime v1.5 for payload v14 / Native GUI IR 1.4. Adds NSBox, NSTimer, picture and status controls while retaining the frozen v1.4 contract.'
          publish_runtime native-linux-runtime-v1.5 'Patch Native Linux Runtime v1.5' runtime/linux/patch-linux-native-gui-runtime.bin 'GTK3 sealed GUI runtime v1.5 for payload v14 / Native GUI IR 1.4. Adds GtkFrame, g_timeout_add, picture and GtkStatusbar while retaining the frozen v1.4 contract.'
