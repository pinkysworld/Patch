name: R0 materialization continuity finalize

on:
  push:
    branches: [gpt/r0-materialization-state-continuity-282]
    paths:
      - .github/workflows/r0-materialization-continuity-finalize-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply guarded continuity and handle-stability patches
        run: |
          python3 scripts/r0-materialization-continuity-retry.py
          python3 scripts/r0-resize-handle-stability-fix.py
      - name: Verify Node and real Chrome continuity
        run: |
          set -euo pipefail
          node --check web/designer-selection.js
          node --check web/table-stage1.js
          node --check web/tree-designer.js
          node --check web/designer-data-editor.js
          node --check web/forms-designer.js
          node --check tests/workshop-desk-browser.test.js
          node --test tests/designer-selection-materialization.test.js
          node --test tests/workshop-desk-browser.test.js
      - name: Commit verified product patch and remove temporary tooling
        run: |
          set -euo pipefail
          git rm .github/workflows/r0-materialization-continuity-once.yml
          git rm .github/workflows/r0-materialization-continuity-retry-once.yml
          git rm .github/workflows/r0-materialization-continuity-diagnostic-once.yml
          git rm .github/workflows/r0-materialization-continuity-finalize-once.yml
          git rm scripts/r0-materialization-continuity-retry.py
          git rm scripts/r0-resize-handle-stability-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/designer-selection.js web/table-stage1.js web/tree-designer.js web/designer-data-editor.js web/forms-designer.js tests/workshop-desk-browser.test.js tests/designer-selection-materialization.test.js
          git commit -m 'Preserve Designer state across Form materialization'
          git push
