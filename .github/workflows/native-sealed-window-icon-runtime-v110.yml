name: Patch Native Sealed Window Icon Runtime v1.10

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/sealed-native-gui-v19.js'
      - 'src/native-gui-ir-v19.js'
      - 'src/native-window-icon-backend-adapter.js'
      - 'src/windows-pe-icon-v110.js'
      - 'native-runtime/sealed-button-image-v19.hpp'
      - 'native-runtime/sealed-window-icon-v110.hpp'
      - 'native-runtime/win32-sealed-gui-v19.cpp'
      - 'native-runtime/appkit-sealed-gui-v19.mm'
      - 'native-runtime/gtk-sealed-gui-v19.cpp'
      - 'native-runtime/win32-sealed-gui-v110.cpp'
      - 'native-runtime/appkit-sealed-gui-v110.mm'
      - 'native-runtime/gtk-sealed-gui-v110.cpp'
      - 'examples/window-icons-native.patch'
      - 'tests/native-window-icon-v19.test.js'
      - 'tests/native-window-icon-payload-v19.test.js'
      - 'tests/native-runtime-v110-sources.test.js'
      - 'tests/native-runtime-v110-release-workflow.test.js'
      - 'tests/windows-pe-icon-v110.test.js'
      - '.github/workflows/native-sealed-window-icon-runtime-v110.yml'
  push:
    branches: [main]
    paths:
      - 'src/sealed-native-gui-v19.js'
      - 'src/native-gui-ir-v19.js'
      - 'src/native-window-icon-backend-adapter.js'
      - 'src/windows-pe-icon-v110.js'
      - 'native-runtime/sealed-button-image-v19.hpp'
      - 'native-runtime/sealed-window-icon-v110.hpp'
      - 'native-runtime/win32-sealed-gui-v19.cpp'
      - 'native-runtime/appkit-sealed-gui-v19.mm'
      - 'native-runtime/gtk-sealed-gui-v19.cpp'
      - 'native-runtime/win32-sealed-gui-v110.cpp'
      - 'native-runtime/appkit-sealed-gui-v110.mm'
      - 'native-runtime/gtk-sealed-gui-v110.cpp'
      - 'examples/window-icons-native.patch'
      - 'tests/native-window-icon-v19.test.js'
      - 'tests/native-window-icon-payload-v19.test.js'
      - 'tests/native-runtime-v110-sources.test.js'
      - 'tests/native-runtime-v110-release-workflow.test.js'
      - 'tests/windows-pe-icon-v110.test.js'
      - '.github/workflows/native-sealed-window-icon-runtime-v110.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA: e31a426dc21cb0929241fe96ab96e270ad182b32

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test payload v19, runtime v1.10, release and Windows PE icon contracts
        run: node --test tests/native-window-icon-v19.test.js tests/native-window-icon-payload-v19.test.js tests/native-runtime-v110-sources.test.js tests/native-runtime-v110-release-workflow.test.js tests/windows-pe-icon-v110.test.js

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Prepare reserved Windows PE application-icon resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-runtime-v110 | Out-Null
          @'
          import fs from 'node:fs';
          import { createWindowsPeIconPlaceholderIcoV110 } from './src/windows-pe-icon-v110.js';
          const data = '';
          const png = new Uint8Array(Buffer.from(data, 'base64'));
          fs.writeFileSync('dist-runtime-v110/runtime-placeholder.ico', createWindowsPeIconPlaceholderIcoV110(png));
          fs.writeFileSync('dist-runtime-v110/runtime-placeholder.rc', '1 ICON "runtime-placeholder.ico"\r\n');
          '@ | Set-Content prepare-runtime-icon.mjs -Encoding utf8
          node prepare-runtime-icon.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime PE icon placeholder generation failed.' }
      - name: Build Win32 sealed Window icon runtime v1.10 with PE icon slot
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          $repo = $env:GITHUB_WORKSPACE
          $dist = Join-Path $repo 'dist-runtime-v110'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            "cd /d `"$repo`"",
            "pushd `"$dist`"",
            'rc.exe /nologo /fo runtime-placeholder.res runtime-placeholder.rc',
            'if errorlevel 1 exit /b %errorlevel%',
            'popd',
            "cd /d `"$repo`"",
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v110.cpp dist-runtime-v110\runtime-placeholder.res user32.lib gdi32.lib gdiplus.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-runtime-v110\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content dist-runtime-v110\build-window-icon-runtime.cmd -Encoding ascii
          & cmd.exe /d /c '.\dist-runtime-v110\build-window-icon-runtime.cmd'
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Verify standard Windows v1.10 runtime carries reserved PE icon slot
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import { inspectWindowsPeApplicationIconV110 } from './src/windows-pe-icon-v110.js';
          const runtime = new Uint8Array(fs.readFileSync('dist-runtime-v110/patch-windows-native-gui-runtime.exe'));
          const icon = inspectWindowsPeApplicationIconV110(runtime);
          if (icon.currentSize !== icon.capacity || icon.groupSize !== icon.capacity || icon.width !== 256 || icon.height !== 256) {
            throw new Error('Standard Windows runtime v1.10 does not carry the reserved PE icon slot.');
          }
          '@ | Set-Content verify-runtime-pe-icon.mjs -Encoding utf8
          node verify-runtime-pe-icon.mjs
      - name: Seal payload v19 and smoke Win32 runtime
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV19 } from './src/native-gui-ir-v19.js';
          import { sealNativeGuiRuntimeV19 } from './src/sealed-native-gui-v19.js';
          const data = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNQaPj/HwAFAgKfqfZU2QAAAABJRU5ErkJggg==';
          const sha256 = 'd126901e8b7f82749aee7b7c0ec59838286c9f8d75ffc74147f34ac2b4bad460';
          const makeResource = id => ({ id, path: `resources/${id.replaceAll('.', '-')}.png`, mediaType: 'image/png', size: 70, sha256, data });
          const resources = [makeResource('app.icon'), makeResource('about.icon'), makeResource('icons.open')];
          const source = fs.readFileSync('examples/window-icons-native.patch', 'utf8');
          const ir = buildNativeGuiIRV19(compile(source, { name: 'WindowIconRuntime', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v110/patch-windows-native-gui-runtime.exe');
          const sealed = sealNativeGuiRuntimeV19(runtime, ir, { platform: 'windows', resources });
          fs.writeFileSync('WindowIconRuntime.exe', sealed);
          '@ | Set-Content seal-window-icon.mjs -Encoding utf8
          node seal-window-icon.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload v19 sealing failed.' }
          $process = Start-Process -FilePath (Resolve-Path './WindowIconRuntime.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed Window icon runtime smoke failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v7
        with:
          name: patch-windows-native-gui-runtime-v110-pr
          path: dist-runtime-v110/patch-windows-native-gui-runtime.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build universal AppKit sealed Window icon runtime v1.10
        run: |
          mkdir -p dist-runtime-v110
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -arch x86_64 -DPATCH_RUNTIME_V19_RESTORE_MAIN=PatchRuntimeV18CompatibilityMain -framework Cocoa native-runtime/appkit-sealed-gui-v110.mm -o dist-runtime-v110/patch-macos-native-gui-runtime.bin
          chmod +x dist-runtime-v110/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime-v110/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal payload v19 and smoke AppKit runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV19 } from './src/native-gui-ir-v19.js';
          import { sealNativeGuiRuntimeV19 } from './src/sealed-native-gui-v19.js';
          const data = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNQaPj/HwAFAgKfqfZU2QAAAABJRU5ErkJggg==';
          const sha256 = 'd126901e8b7f82749aee7b7c0ec59838286c9f8d75ffc74147f34ac2b4bad460';
          const makeResource = id => ({ id, path: `resources/${id.replaceAll('.', '-')}.png`, mediaType: 'image/png', size: 70, sha256, data });
          const resources = [makeResource('app.icon'), makeResource('about.icon'), makeResource('icons.open')];
          const source = fs.readFileSync('examples/window-icons-native.patch', 'utf8');
          const ir = buildNativeGuiIRV19(compile(source, { name: 'WindowIconRuntime', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v110/patch-macos-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV19(runtime, ir, { platform: 'macos', resources });
          fs.writeFileSync('WindowIconRuntime', sealed); fs.chmodSync('WindowIconRuntime', 0o755);
          NODE
          ./WindowIconRuntime --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-macos-native-gui-runtime-v110-pr
          path: dist-runtime-v110/patch-macos-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build GTK3 sealed Window icon runtime v1.10
        run: |
          mkdir -p dist-runtime-v110
          g++ -std=c++17 -O2 -DPATCH_RUNTIME_V19_RESTORE_MAIN=PatchRuntimeV18CompatibilityMain native-runtime/gtk-sealed-gui-v110.cpp -o dist-runtime-v110/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-runtime-v110/patch-linux-native-gui-runtime.bin
      - name: Seal payload v19 and smoke GTK runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV19 } from './src/native-gui-ir-v19.js';
          import { sealNativeGuiRuntimeV19 } from './src/sealed-native-gui-v19.js';
          const data = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNQaPj/HwAFAgKfqfZU2QAAAABJRU5ErkJggg==';
          const sha256 = 'd126901e8b7f82749aee7b7c0ec59838286c9f8d75ffc74147f34ac2b4bad460';
          const makeResource = id => ({ id, path: `resources/${id.replaceAll('.', '-')}.png`, mediaType: 'image/png', size: 70, sha256, data });
          const resources = [makeResource('app.icon'), makeResource('about.icon'), makeResource('icons.open')];
          const source = fs.readFileSync('examples/window-icons-native.patch', 'utf8');
          const ir = buildNativeGuiIRV19(compile(source, { name: 'WindowIconRuntime', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v110/patch-linux-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV19(runtime, ir, { platform: 'linux', resources });
          fs.writeFileSync('WindowIconRuntime', sealed); fs.chmodSync('WindowIconRuntime', 0o755);
          NODE
          xvfb-run -a ./WindowIconRuntime --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-linux-native-gui-runtime-v110-pr
          path: dist-runtime-v110/patch-linux-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: patch-windows-native-gui-runtime-v110-pr
          path: runtime/windows
      - uses: actions/download-artifact@v8
        with:
          name: patch-macos-native-gui-runtime-v110-pr
          path: runtime/macos
      - uses: actions/download-artifact@v8
        with:
          name: patch-linux-native-gui-runtime-v110-pr
          path: runtime/linux
      - name: Generate native runtime v1.10 SHA-256 files
        shell: bash
        run: |
          set -euo pipefail
          (cd runtime/windows && sha256sum patch-windows-native-gui-runtime.exe > SHA256SUMS.txt)
          (cd runtime/macos && sha256sum patch-macos-native-gui-runtime.bin > SHA256SUMS.txt)
          (cd runtime/linux && sha256sum patch-linux-native-gui-runtime.bin > SHA256SUMS.txt)
      - name: Preserve release-candidate bytes and digests for audit
        uses: actions/upload-artifact@v7
        with:
          name: patch-native-runtime-v110-release-candidate
          path: |
            runtime/windows/patch-windows-native-gui-runtime.exe
            runtime/windows/SHA256SUMS.txt
            runtime/macos/patch-macos-native-gui-runtime.bin
            runtime/macos/SHA256SUMS.txt
            runtime/linux/patch-linux-native-gui-runtime.bin
            runtime/linux/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verify immutable source boundary and publish only from the release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA" --depth=1
          critical_paths=(
            src/sealed-native-gui-v19.js
            src/native-gui-ir-v19.js
            src/native-window-icon-backend-adapter.js
            src/windows-pe-icon-v110.js
            native-runtime/sealed-button-image-v19.hpp
            native-runtime/sealed-window-icon-v110.hpp
            native-runtime/win32-sealed-gui-v19.cpp
            native-runtime/appkit-sealed-gui-v19.mm
            native-runtime/gtk-sealed-gui-v19.cpp
            native-runtime/win32-sealed-gui-v110.cpp
            native-runtime/appkit-sealed-gui-v110.mm
            native-runtime/gtk-sealed-gui-v110.cpp
          )
          if ! git diff --quiet "$PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA" "$GITHUB_SHA" -- "${critical_paths[@]}"; then
            echo "Immutable runtime v1.10 sources changed after the published release source $PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA. Create a new runtime version instead of replacing v1.10." >&2
            git diff --name-only "$PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA" "$GITHUB_SHA" -- "${critical_paths[@]}" >&2
            exit 1
          fi

          publish_runtime() {
            local tag="$1" title="$2" dir="$3" asset="$4" notes="$5"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              local tag_sha
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
              if [[ "$tag_sha" != "$PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA" ]]; then
                echo "Immutable runtime release $tag is bound to unexpected source $tag_sha; expected $PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA." >&2
                exit 1
              fi
              echo "Leaving immutable runtime release $tag unchanged at $tag_sha."
              return 0
            fi
            if [[ "$GITHUB_SHA" != "$PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA" ]]; then
              echo "Runtime release $tag is missing, but this run is $GITHUB_SHA rather than immutable release source $PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA." >&2
              exit 1
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA" --title "$title" --notes "$notes"
            gh release upload "$tag" "$dir/$asset" "$dir/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          }

          notes='Current Ready runtime v1.10 for Native GUI IR 1.9 / payload v19. Includes Button/ImageList asset transport plus application/Form icon transport and platform packaging support. The release is immutable and remains bound to its verified source commit; explicit payload v17/runtime v1.8 remains the Offline Compiler compatibility line.'
          publish_runtime native-win32-runtime-v1.10 'Patch Native Win32 Runtime v1.10' runtime/windows patch-windows-native-gui-runtime.exe "$notes"
          publish_runtime native-macos-runtime-v1.10 'Patch Native macOS Runtime v1.10' runtime/macos patch-macos-native-gui-runtime.bin "$notes"
          publish_runtime native-linux-runtime-v1.10 'Patch Native Linux Runtime v1.10' runtime/linux patch-linux-native-gui-runtime.bin "$notes"

  verify-published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and verify published runtime bytes, SHA256SUMS and GitHub digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_runtime() {
            local tag="$1" asset="$2"
            local dir="verify/$tag"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern 'SHA256SUMS.txt' --dir "$dir"
            grep -Eq "^[0-9a-f]{64}  ${asset}$" "$dir/SHA256SUMS.txt"
            (cd "$dir" && sha256sum -c SHA256SUMS.txt)

            local expected recorded checksum_digest tag_sha
            expected="sha256:$(awk '{print $1}' "$dir/SHA256SUMS.txt")"
            recorded="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .digest")"
            checksum_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name == "SHA256SUMS.txt") | .digest')"
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"

            if [[ "$recorded" != "$expected" ]]; then
              echo "Published GitHub digest mismatch for $tag/$asset: expected $expected, recorded $recorded" >&2
              exit 1
            fi
            if [[ ! "$checksum_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Published checksum asset for $tag has no valid GitHub SHA-256 digest: $checksum_digest" >&2
              exit 1
            fi
            if [[ "$tag_sha" != "$PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA" ]]; then
              echo "Published runtime tag $tag is not bound to immutable source commit $PATCH_NATIVE_RUNTIME_V110_SOURCE_SHA: $tag_sha" >&2
              exit 1
            fi
          }

          verify_runtime native-win32-runtime-v1.10 patch-windows-native-gui-runtime.exe
          verify_runtime native-macos-runtime-v1.10 patch-macos-native-gui-runtime.bin
          verify_runtime native-linux-runtime-v1.10 patch-linux-native-gui-runtime.bin
