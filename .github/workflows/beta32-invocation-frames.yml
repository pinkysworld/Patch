name: Patch Beta32 Invocation Frames

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - formal/**
      - src/compiler.js
      - src/parser.js
      - src/wasm-direct.js
      - src/formal-calls.js
      - src/formal-guard.js
      - src/concrete-call-witness.js
      - src/concrete-call-certificate.js
      - src/concrete-call-body.js
      - src/concrete-call-body-certificate.js
      - src/transitive-call-body.js
      - src/transitive-call-body-certificate.js
      - src/direct-trace-validator.js
      - src/direct-effect-validator.js
      - src/transitive-runtime-correspondence.js
      - src/transitive-runtime-certificate.js
      - scripts/generate-transitive-call-body-certificate.js
      - scripts/generate-transitive-runtime-certificate.js
      - examples/formal-transitive-calls.patch
      - examples/formal-transitive-calls-repeated.patch
      - tests/direct-trace-validator.test.js
      - tests/direct-effect-validator.test.js
      - tests/direct-invocation-frame-effects.test.js
      - tests/transitive-call-body.test.js
      - tests/transitive-call-body-certificate.test.js
      - tests/transitive-runtime-correspondence.test.js
      - tests/transitive-runtime-certificate.test.js
      - package.json
      - .github/workflows/beta32-invocation-frames.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invocation-frames:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run beta32 frame/runtime regression tests
        run: node --test tests/direct-trace-validator.test.js tests/direct-effect-validator.test.js tests/direct-invocation-frame-effects.test.js tests/transitive-call-body.test.js tests/transitive-call-body-certificate.test.js tests/transitive-runtime-correspondence.test.js tests/transitive-runtime-certificate.test.js
      - name: Generate beta30 exact call-tree regression certificate
        run: npm run transitive-callee-trace-certify:example
      - name: Execute direct Wasm and generate beta32 single-call frame certificate
        run: npm run transitive-runtime-certify:example
      - name: Execute repeated direct Wasm calls and generate beta32 frame certificate
        run: npm run transitive-runtime-certify:repeated
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Build call-tree/runtime formal bridge used by beta32 evidence
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls PatchCallSubstitution PatchCallRefinement PatchCallEffect PatchCallBody PatchCallBodyImport PatchCallTree PatchCallRuntime
      - name: Verify beta30 exact call-tree regression certificate
        working-directory: formal
        run: lake env lean GeneratedTransitiveCallBodyCertificate.lean
      - name: Verify generated beta32 single-call invocation-frame certificate
        working-directory: formal
        run: lake env lean GeneratedTransitiveRuntimeCertificate.lean
      - name: Verify generated beta32 repeated-call invocation-frame certificate
        working-directory: formal
        run: lake env lean GeneratedRepeatedTransitiveRuntimeCertificate.lean
      - name: Reject unfinished beta32 proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/PatchCallRuntime.lean formal/GeneratedTransitiveRuntimeCertificate.lean formal/GeneratedRepeatedTransitiveRuntimeCertificate.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Unfinished beta.32 proof found.'
            exit 1
          fi
