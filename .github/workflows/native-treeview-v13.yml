name: Patch Native TreeView v1.3

on:
  pull_request:
    paths:
      - 'src/native-gui-ir-v12.js'
      - 'src/native-tree-backend-adapter.js'
      - 'src/win32-gui-v13.js'
      - 'src/appkit-gui-v13.js'
      - 'src/gtk-gui-v13.js'
      - 'src/native-gui-build-plan.js'
      - 'scripts/build-native-win32.js'
      - 'scripts/build-native-appkit.js'
      - 'scripts/build-native-gtk.js'
      - 'examples/treeview-window.patch'
      - 'tests/native-treeview.test.js'
      - '.github/workflows/native-treeview-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Native TreeView v1.3 contract tests
        run: node --test tests/native-treeview.test.js

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and smoke native Win32 TreeView
        run: node scripts/build-native-win32.js examples/treeview-window.patch PatchTreeView dist/tree-win --smoke

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and smoke native AppKit TreeView
        run: node scripts/build-native-appkit.js examples/treeview-window.patch PatchTreeView dist/tree-macos --smoke

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install GTK3 and virtual display
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb
      - name: Build and smoke native GTK TreeView
        run: node scripts/build-native-gtk.js examples/treeview-window.patch PatchTreeView dist/tree-linux --smoke
