name: SplitContainer delivery wiring

on:
  push:
    branches: [splitcontainer-stage1]

permissions:
  contents: write

jobs:
  wire-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: splitcontainer-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire SplitContainer delivery surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {s.count(old)}')
              p.write_text(s.replace(old, new))

          replace_once(
              'web/designer-workspace.js',
              "import './designer-panel.js';\nimport './designer-ui-namespace.js';",
              "import './designer-panel.js';\nimport './designer-splitcontainer.js';\nimport './designer-ui-namespace.js';"
          )
          replace_once(
              'scripts/build-site.js',
              "'window-web-accessibility.js','window-web-paintbox.js','window-build.js'",
              "'window-web-accessibility.js','window-web-paintbox.js','window-web-splitcontainer.js','window-build.js'"
          )
          replace_once(
              'scripts/build-site.js',
              "'designer-menu-designer.js','designer-panel.js','designer-ui-namespace.js'",
              "'designer-menu-designer.js','designer-panel.js','designer-splitcontainer.js','designer-ui-namespace.js'"
          )
          replace_once(
              'web/sw.js',
              "'./designer-menu-designer.js', './designer-panel.js', './designer-layout-actions.js'",
              "'./designer-menu-designer.js', './designer-panel.js', './designer-splitcontainer.js', './designer-layout-actions.js'"
          )
          replace_once(
              'web/sw.js',
              "'../src/window-web-accessibility.js', '../src/window-web-paintbox.js', '../src/window-build.js'",
              "'../src/window-web-accessibility.js', '../src/window-web-paintbox.js', '../src/window-web-splitcontainer.js', '../src/window-build.js'"
          )

          p = Path('tests/splitcontainer-stage1.test.js')
          s = p.read_text()
          old = """test('public and offline Studio packaging includes SplitContainer source contract', () => {\n  const buildSite = fs.readFileSync('scripts/build-site.js', 'utf8');\n  const serviceWorker = fs.readFileSync('web/sw.js', 'utf8');\n  assert.match(buildSite, /'panel-split\\.js'/);\n  assert.match(serviceWorker, /'\\.\\.\\/src\\/panel-split\\.js'/);\n});"""
          new = """test('public and offline Studio packaging includes complete SplitContainer delivery graph', () => {\n  const buildSite = fs.readFileSync('scripts/build-site.js', 'utf8');\n  const serviceWorker = fs.readFileSync('web/sw.js', 'utf8');\n  const workspace = fs.readFileSync('web/designer-workspace.js', 'utf8');\n  assert.match(buildSite, /'panel-split\\.js'/);\n  assert.match(buildSite, /'window-web-splitcontainer\\.js'/);\n  assert.match(buildSite, /'designer-splitcontainer\\.js'/);\n  assert.match(serviceWorker, /'\\.\\.\\/src\\/panel-split\\.js'/);\n  assert.match(serviceWorker, /'\\.\\.\\/src\\/window-web-splitcontainer\\.js'/);\n  assert.match(serviceWorker, /'\\.\\/designer-splitcontainer\\.js'/);\n  assert.match(workspace, /import '\\.\\/designer-splitcontainer\\.js';/);\n});"""
          if s.count(old) != 1:
              raise SystemExit('splitcontainer packaging regression anchor not found exactly once')
          p.write_text(s.replace(old, new))
          PY
      - name: Run SplitContainer regression
        run: node --test tests/splitcontainer-stage1.test.js
      - name: Build hosted Studio module closure
        run: node scripts/build-site.js
      - name: Commit validated wiring
        shell: bash
        run: |
          rm .github/workflows/splitcontainer-wiring-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/designer-workspace.js scripts/build-site.js web/sw.js tests/splitcontainer-stage1.test.js .github/workflows/splitcontainer-wiring-fix.yml
          git commit -m "fix: complete SplitContainer Studio and Web delivery wiring"
          git push origin HEAD:splitcontainer-stage1
