name: R0 documentation sync

on:
  push:
    branches:
      - gpt/r0-active-form-materialization-282
    paths:
      - .github/workflows/r0-doc-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt/r0-active-form-materialization-282
          fetch-depth: 0
      - name: Synchronize R0 status docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('docs/ROADMAP.md',
            '- Studio design model/cache: **0.1**, with primary browser Designer refresh using the declaration-only cached snapshot path\n',
            '- Studio design model/cache: **0.1**, with primary browser Designer refresh using the declaration-only cached snapshot path\n- Studio Form materialization: **0.1**, with exactly one active Designer Form fully materialized and inactive Forms retained as lightweight source-backed shells\n')
          replace_once('docs/ROADMAP.md',
            '- [x] primary `refreshDesigner()` consumes the shared declaration-only design cache instead of executing the Patch application; hosted/Offline Studio package the same design-model/cache modules\n',
            '- [x] primary `refreshDesigner()` consumes the shared declaration-only design cache instead of executing the Patch application; hosted/Offline Studio package the same design-model/cache modules\n- [x] `studio-form-materialization/0.1`: only the active Designer Form materializes control DOM while inactive Forms remain lightweight shells\n- [x] PaintBox, Shape, Panel, StatusBar and Table Designer adapters respect the same active-Form boundary; StatusBar design-time rendering now consumes a declaration-only snapshot rather than executing the application\n- [x] real-Chrome Workshop Form 1 → Form 2 → Form 1 switching proves inactive Forms settle with zero Designer controls\n- [x] Run yields to the browser task queue before the large compile/execute/render pipeline, keeping the command surface responsive\n- [x] Workshop Desk expanded from three to six Forms as the canonical large RAD showcase/stress fixture\n')
          replace_once('docs/ROADMAP.md',
            '- [ ] true active-Form Designer materialization/virtualization rather than post-render hiding\n', '')
          replace_once('docs/ROADMAP.md',
            '- [x] Workshop Desk acceptance showcase covering every integrated cross-platform Ready visual/control family, including PaintBox `draw image`, while native-fail-closed ImageList/Button-image and Window-icon consumers remain separate demonstrations\n',
            '- [x] six-Form Workshop Desk acceptance showcase covering every integrated cross-platform Ready visual/control family, including PaintBox `draw image`, while native-fail-closed ImageList/Button-image and Window-icon consumers remain separate demonstrations\n')

          replace_once('docs/RAD_STUDIO_MASTER_BACKLOG.md',
            '- Workshop Desk acceptance application;\n',
            '- six-Form Workshop Desk acceptance application and real-Chrome large-project stress fixture;\n')
          replace_once('docs/RAD_STUDIO_MASTER_BACKLOG.md',
            '- R0 `studio-design-model/0.1` and `studio-design-cache/0.1`, wired into the primary non-executing Designer refresh path;\n',
            '- R0 `studio-design-model/0.1` and `studio-design-cache/0.1`, wired into the primary non-executing Designer refresh path;\n- R0 `studio-form-materialization/0.1`, with only the active Form fully materialized and sibling Forms retained as lightweight source-backed shells;\n')
          replace_once('docs/RAD_STUDIO_MASTER_BACKLOG.md',
            '- [x] Workshop Desk preserves all three Forms in the declaration-only model;\n',
            '- [x] six-Form Workshop Desk is preserved in the declaration-only model and serves as the canonical large RAD showcase;\n')
          replace_once('docs/RAD_STUDIO_MASTER_BACKLOG.md',
            '- [x] public hosted/Offline Studio module closure packages the design model and cache.\n',
            '- [x] public hosted/Offline Studio module closure packages the design model and cache;\n- [x] `studio-form-materialization/0.1` fully materializes only the canonical active Designer Form and leaves inactive Forms as lightweight shells;\n- [x] specialized PaintBox, Shape, Panel, StatusBar and Table adapters obey the active-Form boundary;\n- [x] StatusBar design-time rendering uses a declaration-only snapshot instead of `PatchInterpreter.run()`;\n- [x] real-Chrome Form switching proves inactive Forms settle with zero Designer controls;\n- [x] Run yields one browser task before the large compile/execute/render pipeline.\n')
          replace_once('docs/RAD_STUDIO_MASTER_BACKLOG.md',
            '- [ ] true active-Form Designer materialization/virtualization, not post-render hiding;\n', '')

          replace_once('docs/GPT.md',
            'Last refreshed: **2026-08-29**, after the Offline Studio public release and primary R0 Designer design-model/cache integration.\n',
            'Last refreshed: **2026-08-29**, after Offline Studio publication, primary non-executing Designer integration, active-Form materialization, six-Form Workshop expansion and compiler-oriented Studio branding.\n')
          replace_once('docs/GPT.md',
            '| Studio design model/cache | `studio-design-model/0.1`, `studio-design-cache/0.1` |\n',
            '| Studio design model/cache | `studio-design-model/0.1`, `studio-design-cache/0.1` |\n| Studio Form materialization | `studio-form-materialization/0.1`, one full active Form plus lightweight inactive shells |\n| Studio brand | `compiler-p-v1` through the shared `web/icon.svg` browser/PWA/Offline Studio asset |\n')
          replace_once('docs/GPT.md',
            '- hosted and Offline Studio package the same design-model/cache module closure.\n',
            '- hosted and Offline Studio package the same design-model/cache module closure;\n- `studio-form-materialization/0.1` materializes control DOM only for the active Designer Form;\n- specialized PaintBox, Shape, Panel, StatusBar and Table adapters honor the same Form boundary;\n- StatusBar design-time rendering consumes a declaration-only snapshot rather than executing the app;\n- real-Chrome six-Form Workshop switching proves inactive Forms settle with zero Designer controls;\n- Run yields before the large compile/execute/render task;\n- compiler-oriented `compiler-p-v1` branding is shared by Studio header, favicon/PWA and Offline Studio packaging.\n')
          replace_once('docs/GPT.md',
            '1. true active-Form Designer materialization/virtualization;\n2. share revision snapshots across remaining Designer adapters and define the Worker boundary;\n3. stable keyed/incremental runtime rendering with focus/caret/selection preservation;\n4. measurable Workshop/large-project performance gates;\n5. split runtime/render/build responsibilities out of `web/playground.js`;\n6. make Pages deployment release-aware without weakening fail-closed runtime verification.\n',
            '1. share revision snapshots across remaining Designer adapters and define the Worker boundary;\n2. stable keyed/incremental runtime rendering with focus/caret/selection preservation;\n3. measurable six-Form Workshop/large-project performance gates;\n4. preserve Explorer/Inspector/selection contracts across materialized Form switches;\n5. split runtime/render/build responsibilities out of `web/playground.js`;\n6. make Pages deployment release-aware without weakening fail-closed runtime verification.\n')
          replace_once('docs/GPT.md',
            '| `src/studio-design-cache.js` | Bounded design snapshot cache |\n',
            '| `src/studio-design-cache.js` | Bounded design snapshot cache |\n| `src/studio-form-materialization.js` | Canonical active-Form Designer materialization policy |\n')
          replace_once('docs/GPT.md',
            'Prioritize **R0 #282 virtualization** first: true active-Form materialization on top of the now non-executing cached Designer model, followed by the Worker and keyed-renderer boundaries. In parallel, close the two explicit native R1 resource-consumer gaps. Offline Studio Stage 2 may progress alongside these only through a narrow local-build bridge that reuses the existing compiler/runtime rather than creating a second build system.',
            'Prioritize the next **R0 #282 renderer/performance slice**: stable keyed Form/control identities, incremental visible updates with focus/caret/selection preservation, and measurable six-Form Workshop timing gates. In parallel, share revision snapshots across remaining Designer adapters and define the Worker boundary. The two explicit native R1 resource-consumer gaps and Offline Studio Stage 2 may progress alongside these without creating parallel semantic/build systems.')

          Path('.github/workflows/r0-doc-sync-once.yml').unlink()
          PY
      - name: Verify synchronized status
        run: |
          grep -q 'studio-form-materialization/0.1' docs/ROADMAP.md
          grep -q 'six-Form Workshop Desk' docs/RAD_STUDIO_MASTER_BACKLOG.md
          grep -q 'stable keyed/incremental runtime rendering' docs/GPT.md
          ! grep -q 'true active-Form Designer materialization/virtualization' docs/ROADMAP.md
          ! grep -q 'true active-Form Designer materialization/virtualization' docs/RAD_STUDIO_MASTER_BACKLOG.md
      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/RAD_STUDIO_MASTER_BACKLOG.md docs/GPT.md .github/workflows/r0-doc-sync-once.yml
          git commit -m "Synchronize R0 materialization backlog"
          git push origin HEAD:gpt/r0-active-form-materialization-282
