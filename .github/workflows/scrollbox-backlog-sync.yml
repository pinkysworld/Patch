name: ScrollBox backlog sync

on:
  push:
    branches: [scrollbox-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrollbox-stage1
          fetch-depth: 0
      - name: Synchronize RAD backlog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/RAD_STUDIO_MASTER_BACKLOG.md')
          s = p.read_text()
          s = s.replace(
              'plus source-backed PasswordEdit, MaskedEdit, CheckedListBox and ProgressBar presentation contracts;',
              'plus source-backed PasswordEdit, MaskedEdit, CheckedListBox, ProgressBar, GroupBox and ScrollBox presentation/containment contracts;'
          )
          old = '''## P1.13 GroupBox

- [ ] captioned container;
- [ ] child coordinates/layout;
- [ ] accessibility group semantics.

## P1.14 ScrollBox / ScrollPanel

- [ ] scrollable container and AutoScroll;
- [ ] horizontal/vertical policies;
- [ ] nested content;
- [ ] wheel/touch parity.'''
          new = '''## P1.13 GroupBox

- [x] captioned source-backed Panel presentation via `# @panel-mode group`;
- [x] reuses Panel Stage 2 child coordinates/layout without a second container model;
- [x] Studio/Web accessibility group semantics and caption derived from the Panel id;
- [x] Current Ready native fails closed until an explicit native GroupBox contract is promoted.

## P1.14 ScrollBox / ScrollPanel

- [x] source-backed automatic scrolling via `# @panel-scroll auto` on ordinary Panel;
- [x] Studio/Web content extent includes positioned Panel Stage 2 children beyond the visible viewport;
- [x] browser wheel, trackpad and touch scrolling use the platform overflow behavior with transient scroll position only;
- [x] composes orthogonally with GroupBox presentation;
- [x] Current Ready native fails closed instead of clipping or lowering as a plain Panel;
- [ ] explicit horizontal/vertical policy selectors beyond automatic overflow;
- [ ] nested ScrollBox/Panel composition until nested Panels are promoted.'''
          if old not in s:
              raise SystemExit('expected GroupBox/ScrollBox backlog block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/scrollbox-backlog-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/RAD_STUDIO_MASTER_BACKLOG.md .github/workflows/scrollbox-backlog-sync.yml
          git commit -m "docs: synchronize GroupBox and ScrollBox backlog"
          git push origin HEAD:scrollbox-stage1
