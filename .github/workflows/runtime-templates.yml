name: Patch Studio Runtime Templates

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/build-native-sea-template.js
      - scripts/build-native-window-template.js
      - src/interpreter.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - src/window-events.js
      - src/form-layout.js
      - src/window-compiled.js
      - src/prebuilt-native.js
      - src/prebuilt-window.js
      - src/wasm-direct.js
      - src/compiler.js
      - src/cli.js
      - examples/direct-wasm-recipes.patch
      - examples/counter-window.patch
      - examples/checkbox-window.patch
      - examples/combo-window.patch
      - examples/listbox-window.patch
      - examples/tabs-window.patch
      - examples/forms-navigation.patch
      - tests/tabs-window.test.js
      - .github/workflows/runtime-templates.yml
  push:
    branches: [main]
    paths:
      - scripts/build-native-sea-template.js
      - scripts/build-native-window-template.js
      - src/interpreter.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - src/window-events.js
      - src/form-layout.js
      - src/window-compiled.js
      - src/prebuilt-native.js
      - src/prebuilt-window.js
      - src/wasm-direct.js
      - src/compiler.js
      - src/cli.js
      - examples/direct-wasm-recipes.patch
      - examples/counter-window.patch
      - examples/checkbox-window.patch
      - examples/combo-window.patch
      - examples/listbox-window.patch
      - examples/tabs-window.patch
      - examples/forms-navigation.patch
      - tests/tabs-window.test.js
      - .github/workflows/runtime-templates.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.platform }} runtime templates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build generic Console runtime
        shell: bash
        run: |
          mkdir -p runtime
          node scripts/build-native-sea-template.js --name PatchConsoleRuntime --out dist/PatchConsoleRuntime --raw-out runtime/patch-${{ matrix.platform }}-console-runtime.bin
      - name: Build generic Window runtime
        shell: bash
        run: node scripts/build-native-window-template.js dist
      - name: Prepare Console smoke payload
        shell: bash
        run: |
          node src/cli.js build examples/direct-wasm-recipes.patch --kind console --target wasm-direct --out dist/app.wasm
          node -e "const fs=require('fs'); fs.writeFileSync('dist/patch-app.json', JSON.stringify({format:'patch-prebuilt-native-payload',version:'0.2',name:'Runtime Smoke',kind:'console'}));"
      - name: Seal Console smoke executable
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import { sealConsoleRuntimeBinary } from './src/prebuilt-native.js'; const raw=new Uint8Array(fs.readFileSync('runtime/patch-${{ matrix.platform }}-console-runtime.bin')); const wasm=new Uint8Array(fs.readFileSync('dist/app.wasm')); const sealed=sealConsoleRuntimeBinary(raw,{name:'Runtime Smoke',wasm}); const out='dist/PatchSealedRuntime'+(process.platform==='win32'?'.exe':''); fs.writeFileSync(out,sealed); if(process.platform!=='win32')fs.chmodSync(out,0o755);"

      - name: Smoke sealed Console runtime on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: "& ./dist/PatchSealedRuntime.exe"
      - name: Smoke sealed Console runtime on macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: ./dist/PatchSealedRuntime
      - name: Smoke sealed Console runtime on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: ./dist/PatchSealedRuntime
      - name: Reject oversized sealed payload declaration
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          cp dist/PatchSealedRuntime dist/PatchBadRuntime
          node -e "const fs=require('fs'); const f='dist/PatchBadRuntime'; const b=fs.readFileSync(f); b.writeUInt32LE(0x7fffffff,b.length-12); fs.writeFileSync(f,b);"
          chmod +x dist/PatchBadRuntime
          if ./dist/PatchBadRuntime 2>dist/bad-runtime.log; then
            echo 'Malformed sealed runtime unexpectedly executed.' >&2
            exit 1
          fi
          grep -q 'safety limit' dist/bad-runtime.log

      - name: Smoke legacy Console sidecar compatibility on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: "& ./dist/PatchConsoleRuntime.exe"
      - name: Smoke legacy Console sidecar compatibility on macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: ./dist/PatchConsoleRuntime.app/Contents/MacOS/PatchConsoleRuntime
      - name: Smoke legacy Console sidecar compatibility on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: ./dist/PatchConsoleRuntime

      - name: Prepare compiled Window navigation smoke payload
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import { compile } from './src/compiler.js'; import { validateWindowRuntimeSupport } from './src/window-build.js'; import { buildCompiledWindowArtifact } from './src/window-compiled.js'; const source=fs.readFileSync('examples/forms-navigation.patch','utf8'); const compiled=compile(source,{name:'Runtime Smoke',kind:'window',entry:'forms-navigation.patch'}); validateWindowRuntimeSupport(compiled); const artifact=buildCompiledWindowArtifact(compiled); fs.writeFileSync('dist/patch-app.json',JSON.stringify({format:'patch-prebuilt-native-payload',version:'0.4',name:'Runtime Smoke',kind:'window',execution:'compiled-window-program',compiled:artifact}));"
      - name: Configure Linux Electron sandbox helper
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          APP=$(find dist -maxdepth 2 -type f -name 'PatchWindowRuntime' -perm -111 | head -1)
          test -n "$APP"
          HELPER="$(dirname "$APP")/chrome-sandbox"
          test -f "$HELPER"
          sudo chown root:root "$HELPER"
          sudo chmod 4755 "$HELPER"
          test "$(stat -c '%u:%g:%a' "$HELPER")" = '0:0:4755'

      - name: Smoke Window payload validation on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path dist -Recurse -Filter 'PatchWindowRuntime.exe' | Select-Object -First 1
          if (-not $app) { throw 'Generic Windows Window runtime executable was not found.' }
          & $app.FullName --patch-payload-smoke
      - name: Smoke sandboxed compiled Form navigation on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path dist -Recurse -Filter 'PatchWindowRuntime.exe' | Select-Object -First 1
          if (-not $app) { throw 'Generic Windows Window runtime executable was not found.' }
          & $app.FullName --patch-ui-smoke
      - name: Smoke Window payload validation on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          APP=$(find dist -type d -name 'PatchWindowRuntime.app' | head -1)
          test -n "$APP"
          cp dist/patch-app.json "$(dirname "$APP")/patch-app.json"
          "$APP/Contents/MacOS/PatchWindowRuntime" --patch-payload-smoke
      - name: Smoke sandboxed compiled Form navigation on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          APP=$(find dist -type d -name 'PatchWindowRuntime.app' | head -1)
          test -n "$APP"
          "$APP/Contents/MacOS/PatchWindowRuntime" --patch-ui-smoke
      - name: Smoke Window payload validation on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          APP=$(find dist -maxdepth 2 -type f -name 'PatchWindowRuntime' -perm -111 | head -1)
          test -n "$APP"
          xvfb-run -a "$APP" --patch-payload-smoke
      - name: Smoke sandboxed compiled Form navigation on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          APP=$(find dist -maxdepth 2 -type f -name 'PatchWindowRuntime' -perm -111 | head -1)
          test -n "$APP"
          xvfb-run -a "$APP" --patch-ui-smoke

      - name: Package Windows templates
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/PatchConsoleRuntime.exe' -DestinationPath 'runtime/patch-windows-console-runtime.zip' -Force
          $source = Get-ChildItem -Path dist -Directory -Filter 'PatchWindowRuntime-win32-*' | Select-Object -First 1
          if (-not $source) { throw 'Windows Window runtime folder was not found.' }
          $stage = Join-Path $env:RUNNER_TEMP 'patch-window-runtime-stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse $source.FullName (Join-Path $stage 'PatchWindowRuntime')
          $destination = Join-Path (Resolve-Path runtime).Path 'patch-windows-window-runtime.zip'
          Compress-Archive -Path (Join-Path $stage 'PatchWindowRuntime') -DestinationPath $destination -Force

      - name: Package macOS templates
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/PatchConsoleRuntime.app runtime/patch-macos-console-runtime.zip
          APP=$(find dist -type d -name 'PatchWindowRuntime.app' | head -1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" runtime/patch-macos-window-runtime.zip

      - name: Package Linux templates
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          (cd dist && zip -qry ../runtime/patch-linux-console-runtime.zip PatchConsoleRuntime)
          SOURCE=$(find dist -maxdepth 1 -type d -name 'PatchWindowRuntime-linux-*' | head -1)
          test -n "$SOURCE"
          STAGE="$RUNNER_TEMP/patch-window-runtime-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$SOURCE" "$STAGE/PatchWindowRuntime"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/runtime/patch-linux-window-runtime.zip" PatchWindowRuntime)

      - uses: actions/upload-artifact@v4
        with:
          name: patch-studio-runtime-${{ matrix.platform }}
          path: runtime/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    name: Publish runtime release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: patch-studio-runtime-*
          path: release
          merge-multiple: true
      - name: Publish compiled runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: studio-runtime-v0.6
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Patch Studio Runtime v0.6' --notes 'Prebuilt Windows, macOS and Linux compatibility GUI runtimes for compiled Window artifact v0.2. This release renders named Forms, ComboBox, ListBox and Tabs containers. Tabs page selection stays renderer-local and does not create hidden Patch state. Payload format remains v0.4.'
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber