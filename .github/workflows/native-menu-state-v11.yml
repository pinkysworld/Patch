name: Patch Native Menu State v1.1

# Frozen direct-native compatibility smoke. Current CI and sealed-runtime
# workflows cover normal development changes; run this explicitly when
# auditing the historical v1.1 menu-state backend.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-menu-state:
    name: ${{ matrix.name }} native menu state 1.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Win32
            script: build-native-win32.js
          - os: macos-latest
            name: AppKit
            script: build-native-appkit.js
          - os: ubuntu-latest
            name: GTK3
            script: build-native-gtk.js
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install GTK3 smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb
      - name: Run menu state contract tests
        run: node --test tests/menu-state-window.test.js
      - name: Build and smoke native menu state app
        run: node scripts/${{ matrix.script }} examples/menu-state-window.patch PatchMenuStateV11 dist/menu-state-v11 --smoke --menu-v11
