name: Patch Native AppKit GUI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/native-gui-ir.js
      - src/appkit-gui.js
      - scripts/build-native-appkit.js
      - tests/appkit-gui.test.js
      - tests/menu-dialog-window.test.js
      - examples/forms-navigation.patch
      - examples/menu-dialog-window.patch
      - .github/workflows/native-appkit-gui.yml
  push:
    branches: [main]
    paths:
      - src/native-gui-ir.js
      - src/appkit-gui.js
      - scripts/build-native-appkit.js
      - tests/appkit-gui.test.js
      - tests/menu-dialog-window.test.js
      - examples/forms-navigation.patch
      - examples/menu-dialog-window.patch
      - .github/workflows/native-appkit-gui.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-appkit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Check AppKit backend JavaScript
        run: |
          node --check src/appkit-gui.js
          node --check scripts/build-native-appkit.js
          node --check tests/appkit-gui.test.js
          node --check tests/menu-dialog-window.test.js
      - name: Run AppKit lowering tests
        run: node --test tests/appkit-gui.test.js tests/menu-dialog-window.test.js
      - name: Compile, link and bundle native Patch AppKit Forms application
        run: |
          mkdir -p dist-native-mac
          node scripts/build-native-appkit.js examples/forms-navigation.patch PatchNativeMacSmoke dist-native-mac --smoke
      - name: Compile and execute native Patch AppKit Menu Dialog application
        run: node scripts/build-native-appkit.js examples/menu-dialog-window.patch PatchNativeMacMenuDialog dist-native-menu-dialog --smoke
      - name: Verify native AppKit output contract
        run: |
          for pair in 'dist-native-mac PatchNativeMacSmoke' 'dist-native-menu-dialog PatchNativeMacMenuDialog'; do
            set -- $pair
            dir=$1; name=$2
            test -x "$dir/$name.app/Contents/MacOS/$name"
            node -e "const m=require('./$dir/$name.appkit-build.json'); if(m.electron!==false||m.shell!=='native-appkit'||m.framework!=='AppKit'||m.nativeGuiIrVersion!=='0.6') process.exit(1)"
            test ! -d "$dir/$name.app/Contents/Frameworks/Electron Framework.framework"
          done
          ! find dist-native-mac dist-native-menu-dialog -iname '*Electron*' -print -quit | grep -q .
      - name: Upload native AppKit compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: patch-native-appkit-gui
          path: |
            dist-native-mac/**
            dist-native-menu-dialog/**
          if-no-files-found: error
