name: SpinEdit follow-up helper

on:
  push:
    branches:
      - spinedit-stage1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spinedit-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply lifecycle docs and showcase follow-up
        run: python scripts/apply-spinedit-followup.py
      - name: Run focused SpinEdit and lifecycle regressions
        run: node --test tests/spinedit-stage1.test.js tests/progressbar-stage1.test.js tests/designer-presentation-metadata-lifecycle.test.js
      - name: Run Showcase and documentation regressions
        run: node --test tests/studio-showcase.test.js tests/studio-showcase-loader.test.js tests/studio-authoring-surface.test.js tests/docs-current-studio-surface.test.js
      - name: Build hosted Studio closure
        run: node scripts/build-site.js
      - name: Commit synchronized SpinEdit surface
        run: |
          rm .github/workflows/spinedit-followup-helper.yml scripts/apply-spinedit-followup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/designer-control-duplicate-model.js web/designer-control-clipboard-model.js tests/spinedit-stage1.test.js docs/STUDIO_AUTHORING_SURFACE.md docs/ROADMAP.md docs/RAD_STUDIO_MASTER_BACKLOG.md tests/studio-authoring-surface.test.js tests/docs-current-studio-surface.test.js tests/studio-showcase.test.js examples/patch-studio-showcase.patchproject web/studio-showcase-project.js .github/workflows/spinedit-followup-helper.yml scripts/apply-spinedit-followup.py
          git commit -m "feat: complete SpinEdit RAD lifecycle and showcase"
          git push origin HEAD:spinedit-stage1
