name: Patch Native Menu v1.0

# Frozen direct-native compatibility smoke. Current CI and sealed-runtime
# workflows cover normal development changes; run this explicitly when
# auditing the historical v1.0 menu backend.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-menu:
    name: ${{ matrix.name }} native menu 1.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Win32
            script: build-native-win32.js
          - os: macos-latest
            name: AppKit
            script: build-native-appkit.js
          - os: ubuntu-latest
            name: GTK3
            script: build-native-gtk.js
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install GTK3 smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb
      - name: Run menu contract tests
        run: node --test tests/menu-shortcut-window.test.js
      - name: Build and smoke native menu app
        run: node scripts/${{ matrix.script }} examples/menu-shortcut-window.patch PatchMenuV10 dist/menu-v10 --smoke --menu-v10
