name: ScrollBox CI fix

on:
  push:
    branches: [scrollbox-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scrollbox-stage1
          fetch-depth: 0
      - name: Fix ScrollBox native regression and UI model propagation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/interpreter.js')
          s = p.read_text()
          old = """        if(node.control==='panel'){
          item.panelPresentation=node.panelPresentation??'plain';
          item.controls=this.buildUIItems(node.body, lists, true);
        }"""
          new = """        if(node.control==='panel'){
          item.panelPresentation=node.panelPresentation??'plain';
          item.panelScroll=node.panelScroll??'none';
          item.controls=this.buildUIItems(node.body, lists, true);
        }"""
          if s.count(old) != 1:
              raise SystemExit('interpreter Panel model anchor not unique')
          p.write_text(s.replace(old, new))

          p = Path('tests/scrollbox-stage1.test.js')
          s = p.read_text()
          s = s.replace(
              "import { compile } from '../src/compiler.js';",
              "import { compile } from '../src/compiler.js';\nimport { PatchInterpreter } from '../src/interpreter.js';"
          )
          source_end = """    button \"Apply\" as apply_button at 24, 220 size 120, 40
`;"""
          native_source = """    button \"Apply\" as apply_button at 24, 220 size 120, 40
`;

const NATIVE_SCROLL_SOURCE = `window \"Scrollable native gate\" as main size 640, 420:
  panel as scroll_only at 24, 24 size 320, 180:
    # @panel-scroll auto
    button \"Apply\" as apply_button at 24, 220 size 120, 40
`;"""
          if s.count(source_end) != 1:
              raise SystemExit('ScrollBox source fixture anchor not unique')
          s = s.replace(source_end, native_source)
          runtime_anchor = """  assert.equal(panel.panelPresentation, 'group');
  assert.equal(panel.panelScroll, 'auto');"""
          runtime_replacement = """  assert.equal(panel.panelPresentation, 'group');
  assert.equal(panel.panelScroll, 'auto');
  const runtimePanel = new PatchInterpreter().runAst(compiled.ast).ui[0].controls.find(control => control.type === 'panel');
  assert.equal(runtimePanel.panelScroll, 'auto');"""
          if s.count(runtime_anchor) != 1:
              raise SystemExit('ScrollBox runtime assertion anchor not unique')
          s = s.replace(runtime_anchor, runtime_replacement)
          target_anchor = """  assert.throws(() => assertPatchPanelScrollTarget('auto', 'windows'), /ScrollBox Stage 1 is Studio\\/Web only/i);
  const compiled = compile(SOURCE, { name: 'ScrollBoxStage1', kind: 'window', entry: 'main.patch' });"""
          target_replacement = """  assert.throws(() => assertPatchPanelScrollTarget('auto', 'windows'), /ScrollBox Stage 1 is Studio\\/Web only/i);
  const compiled = compile(NATIVE_SCROLL_SOURCE, { name: 'ScrollBoxStage1', kind: 'window', entry: 'main.patch' });"""
          if s.count(target_anchor) != 1:
              raise SystemExit('ScrollBox native assertion anchor not unique')
          p.write_text(s.replace(target_anchor, target_replacement))
          PY
          rm .github/workflows/scrollbox-ci-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/interpreter.js tests/scrollbox-stage1.test.js .github/workflows/scrollbox-ci-fix.yml
          git commit -m "fix: complete ScrollBox UI model and native gate test"
          git push origin HEAD:scrollbox-stage1
