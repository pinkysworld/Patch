name: Patch Native Sealed TreeView Runtime v1.3

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/sealed-native-gui-v12.js
      - src/native-gui-ir-v12.js
      - src/native-tree-backend-adapter.js
      - native-runtime/sealed-tree-v13.hpp
      - native-runtime/sealed-menu-v12.hpp
      - native-runtime/win32-sealed-gui-v13.cpp
      - native-runtime/appkit-sealed-gui-v13.mm
      - native-runtime/gtk-sealed-gui-v13.cpp
      - examples/treeview-window.patch
      - tests/sealed-tree-payload-v12.test.js
      - .github/workflows/native-sealed-tree-runtime-v13.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test sealed TreeView payload v12 contract
        run: node --test tests/sealed-tree-payload-v12.test.js tests/native-treeview.test.js

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build Win32 sealed TreeView runtime v1.3
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v13.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:PatchTreeRuntimeV13.exe',
            'exit /b %errorlevel%'
          ) | Set-Content build-tree-runtime.cmd -Encoding ascii
          & cmd.exe /d /c build-tree-runtime.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal canonical TreeView app as payload v12
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV12 } from './src/native-gui-ir-v12.js';
          import { sealNativeGuiRuntimeV12 } from './src/sealed-native-gui-v12.js';
          const source = fs.readFileSync('examples/treeview-window.patch', 'utf8');
          const ir = buildNativeGuiIRV12(compile(source, { name: 'SealedTreeView', kind: 'window' }));
          const runtime = fs.readFileSync('PatchTreeRuntimeV13.exe');
          const sealed = sealNativeGuiRuntimeV12(runtime, ir, { platform: 'windows' });
          fs.writeFileSync('SealedTreeView.exe', sealed);
          const footer = new DataView(sealed.buffer, sealed.byteOffset + sealed.byteLength - 20, 20);
          if (footer.getUint32(8, true) !== 12) throw new Error('Expected sealed payload v12.');
          NODE
      - name: Smoke sealed Win32 TreeView runtime v1.3
        shell: pwsh
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          $process = Start-Process -FilePath (Resolve-Path './SealedTreeView.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed TreeView runtime smoke failed with exit code $($process.ExitCode)." }

  macos:
    needs: contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build universal AppKit sealed TreeView runtime v1.3
        run: |
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -arch x86_64 -framework Cocoa native-runtime/appkit-sealed-gui-v13.mm -o PatchTreeRuntimeV13
          chmod +x PatchTreeRuntimeV13
          ARCHS="$(lipo -archs PatchTreeRuntimeV13)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal canonical TreeView app as payload v12
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV12 } from './src/native-gui-ir-v12.js';
          import { sealNativeGuiRuntimeV12 } from './src/sealed-native-gui-v12.js';
          const source = fs.readFileSync('examples/treeview-window.patch', 'utf8');
          const ir = buildNativeGuiIRV12(compile(source, { name: 'SealedTreeView', kind: 'window' }));
          const runtime = fs.readFileSync('PatchTreeRuntimeV13');
          const sealed = sealNativeGuiRuntimeV12(runtime, ir, { platform: 'macos' });
          fs.writeFileSync('SealedTreeView', sealed); fs.chmodSync('SealedTreeView', 0o755);
          NODE
      - name: Smoke sealed AppKit TreeView runtime v1.3
        run: ./SealedTreeView --patch-smoke

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build GTK3 sealed TreeView runtime v1.3
        run: |
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v13.cpp -o PatchTreeRuntimeV13 $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x PatchTreeRuntimeV13
      - name: Seal canonical TreeView app as payload v12
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV12 } from './src/native-gui-ir-v12.js';
          import { sealNativeGuiRuntimeV12 } from './src/sealed-native-gui-v12.js';
          const source = fs.readFileSync('examples/treeview-window.patch', 'utf8');
          const ir = buildNativeGuiIRV12(compile(source, { name: 'SealedTreeView', kind: 'window' }));
          const runtime = fs.readFileSync('PatchTreeRuntimeV13');
          const sealed = sealNativeGuiRuntimeV12(runtime, ir, { platform: 'linux' });
          fs.writeFileSync('SealedTreeView', sealed); fs.chmodSync('SealedTreeView', 0o755);
          NODE
      - name: Smoke sealed GTK TreeView runtime v1.3
        run: xvfb-run -a ./SealedTreeView --patch-smoke
