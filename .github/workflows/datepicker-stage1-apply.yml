name: Apply DatePicker Stage 1

on:
  push:
    branches:
      - rad/datepicker-stage1
    paths:
      - .github/workflows/datepicker-stage1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/datepicker-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply DatePicker patch
        run: python3 scripts/apply-datepicker-stage1.py
      - name: Syntax and targeted regression tests
        run: |
          node --check src/input-presentation.js
          node --check src/window-input-presentation.js
          node --check src/native-current-contract.js
          node --check src/window-webapp.js
          node --test tests/input-presentation.test.js tests/passwordedit-stage1.test.js tests/maskededit-stage1.test.js tests/numberedit-source-contract.test.js tests/datepicker-stage1.test.js tests/studio-showcase.test.js tests/studio-showcase-loader.test.js tests/studio-authoring-surface.test.js tests/docs-current-studio-surface.test.js
          git diff --check
      - name: Commit feature and remove temporary patch harness
        run: |
          git rm .github/workflows/datepicker-stage1-apply.yml scripts/apply-datepicker-stage1.py
          git config user.name "pinkysworld"
          git config user.email "85413447+pinkysworld@users.noreply.github.com"
          git add src tests docs examples web
          git commit -m "RAD: implement DatePicker Stage 1"
          git push origin HEAD:rad/datepicker-stage1
