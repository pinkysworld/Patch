name: R0 Designer integration patch

on:
  push:
    branches:
      - gpt/r0-design-model-integration-282
    paths:
      - .github/workflows/r0-designer-patch-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt/r0-design-model-integration-282
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact guarded source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one guarded match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'web/playground.js',
              "import { diagnosticFromError, formatPatchDiagnostic } from '../src/diagnostics.js';\n",
              "import { diagnosticFromError, formatPatchDiagnostic } from '../src/diagnostics.js';\nimport { createStudioDesignSnapshotCache } from '../src/studio-design-cache.js';\n",
          )
          replace_once(
              'web/playground.js',
              "let runInProgress = false;\n",
              "let runInProgress = false;\nconst designerDesignCache = createStudioDesignSnapshotCache();\n",
          )
          replace_once(
              'web/playground.js',
              "    const preview = new PatchInterpreter().run(code.value);\n    renderWindows(designerCanvas, preview.ui, false);\n",
              "    const preview = designerDesignCache.get(code.value);\n    renderWindows(designerCanvas, preview.ui, false);\n",
          )
          replace_once(
              'scripts/build-site.js',
              "'studio-project.js','studio-resources.js','studio-outline-model.js','studio-diagnostics.js',",
              "'studio-project.js','studio-resources.js','studio-outline-model.js','studio-diagnostics.js','studio-design-model.js','studio-design-cache.js',",
          )
          replace_once(
              'web/sw.js',
              "'../src/studio-project.js', '../src/studio-resources.js', '../src/studio-outline-model.js', '../src/studio-diagnostics.js', '../src/window-compiled.js'",
              "'../src/studio-project.js', '../src/studio-resources.js', '../src/studio-outline-model.js', '../src/studio-diagnostics.js', '../src/studio-design-model.js', '../src/studio-design-cache.js', '../src/window-compiled.js'",
          )

          Path('.github/workflows/r0-designer-patch-once.yml').unlink()
          PY
      - name: Verify R0 integration
        shell: bash
        run: |
          node --check web/playground.js
          node --test tests/studio-designer-design-model-integration.test.js tests/studio-design-model.test.js tests/studio-design-cache.test.js tests/studio-design-model-large-project.test.js
          npm run build:site
          npm run check:site
      - name: Commit guarded integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/playground.js scripts/build-site.js web/sw.js .github/workflows/r0-designer-patch-once.yml
          git commit -m "Wire Designer refresh to declaration-only design snapshots"
          git push origin HEAD:gpt/r0-design-model-integration-282
