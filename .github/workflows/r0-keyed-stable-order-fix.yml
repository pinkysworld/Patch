name: R0 keyed runtime stable order fix

on:
  push:
    branches:
      - gpt/r0-keyed-runtime-renderer-282
    paths:
      - .github/workflows/r0-keyed-stable-order-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt/r0-keyed-runtime-renderer-282
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply stable keyed order fix
        run: python3 .github/scripts/r0_keyed_stable_order_fix.py
      - name: Verify stable keyed order
        run: |
          node --check web/playground.js
          node --test tests/studio-runtime-keyed-renderer.test.js
          node --test tests/workshop-desk-browser.test.js
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/playground.js tests/studio-runtime-keyed-renderer.test.js tests/workshop-desk-browser.test.js
          git commit -m "Avoid redundant keyed Form DOM moves"
          git push origin HEAD:gpt/r0-keyed-runtime-renderer-282
