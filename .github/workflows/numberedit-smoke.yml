name: NumberEdit branch smoke

on:
  push:
    branches: [numberedit-stage1]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numberedit-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run NumberEdit and presentation lifecycle tests
        run: node --test tests/numberedit-stage1.test.js tests/passwordedit-stage1.test.js tests/maskededit-stage1.test.js tests/designer-control-duplicate.test.js tests/designer-control-clipboard-model.test.js tests/designer-presentation-metadata-lifecycle.test.js
      - name: Build hosted Studio closure
        run: node scripts/build-site.js
      - name: Remove temporary smoke workflow
        shell: bash
        run: |
          rm .github/workflows/numberedit-smoke.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/numberedit-smoke.yml
          git commit -m "chore: remove NumberEdit branch smoke"
          git push origin HEAD:numberedit-stage1
