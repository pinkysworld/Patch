name: Patch Offline Compiler

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - native-runtime/**
      - scripts/build-offline-compiler.js
      - scripts/offline-compiler-runner.cjs
      - scripts/build-native-sea-template.js
      - docs/OFFLINE_COMPILER.md
      - web/downloads.html
      - examples/direct-wasm-recipes.patch
      - examples/responsive-window.patch
      - examples/table-native-v09.patch
      - examples/listbox-multiselect-native.patch
      - examples/menu-state-window.patch
      - examples/treeview-window.patch
      - examples/slider-window.patch
      - examples/chrome-window.patch
      - .github/workflows/offline-compiler.yml
      - .github/workflows/native-sealed-chrome-runtime-v15.yml
  push:
    branches: [main]
    paths:
      - src/**
      - native-runtime/**
      - scripts/build-offline-compiler.js
      - scripts/offline-compiler-runner.cjs
      - scripts/build-native-sea-template.js
      - docs/OFFLINE_COMPILER.md
      - web/downloads.html
      - examples/direct-wasm-recipes.patch
      - examples/responsive-window.patch
      - examples/table-native-v09.patch
      - examples/listbox-multiselect-native.patch
      - examples/menu-state-window.patch
      - examples/treeview-window.patch
      - examples/slider-window.patch
      - examples/chrome-window.patch
      - .github/workflows/offline-compiler.yml
      - .github/workflows/native-sealed-chrome-runtime-v15.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            asset: patch-windows-x64.exe
          - os: ubuntu-latest
            platform: linux
            asset: patch-linux-x64
          - os: macos-15
            platform: macos
            asset: patch-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install Linux Window build and smoke dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build host Console runtime
        shell: bash
        run: |
          mkdir -p offline-runtime dist-offline dist-smoke
          node scripts/build-native-sea-template.js --name PatchOfflineConsoleRuntime --out dist-offline/PatchOfflineConsoleRuntime --raw-out offline-runtime/console.bin
      - name: Build Win32 runtime v1.5
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          $script = Join-Path $PWD 'offline-runtime\build-gui-runtime.cmd'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v15.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:offline-runtime\gui.bin',
            'exit /b %errorlevel%'
          ) | Set-Content -Path $script -Encoding ascii
          & cmd.exe /d /c $script
          if ($LASTEXITCODE -ne 0) { throw "MSVC GUI runtime build failed with exit code $LASTEXITCODE." }
      - name: Build GTK runtime v1.5
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v15.cpp -o offline-runtime/gui.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x offline-runtime/gui.bin
      - name: Build AppKit runtime v1.5
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -framework Cocoa \
            native-runtime/appkit-sealed-gui-v15.mm -o offline-runtime/gui.bin
          chmod +x offline-runtime/gui.bin
          test "$(lipo -archs offline-runtime/gui.bin)" = "arm64"
      - name: Build standalone Patch compiler
        shell: bash
        run: |
          node scripts/build-offline-compiler.js --platform '${{ matrix.platform }}' --console-runtime offline-runtime/console.bin --gui-runtime offline-runtime/gui.bin --out "dist-offline/${{ matrix.asset }}"
      - name: Smoke compiler and current local Window linking
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          "dist-offline/${{ matrix.asset }}" --version
          "dist-offline/${{ matrix.asset }}" check examples/direct-wasm-recipes.patch
          "dist-offline/${{ matrix.asset }}" build examples/direct-wasm-recipes.patch --kind console --target web --out dist-smoke/OfflineSmoke.html
          "dist-offline/${{ matrix.asset }}" link examples/direct-wasm-recipes.patch --name OfflineLinked --out dist-smoke/OfflineLinked
          "dist-offline/${{ matrix.asset }}" link examples/responsive-window.patch --name OfflineResponsive --out dist-smoke/OfflineResponsive
          "dist-offline/${{ matrix.asset }}" link examples/table-native-v09.patch --name OfflineTable --out dist-smoke/OfflineTable
          "dist-offline/${{ matrix.asset }}" link examples/listbox-multiselect-native.patch --name OfflineMulti --out dist-smoke/OfflineMulti
          "dist-offline/${{ matrix.asset }}" link examples/menu-state-window.patch --name OfflineMenu --out dist-smoke/OfflineMenu
          "dist-offline/${{ matrix.asset }}" link examples/treeview-window.patch --name OfflineTree --out dist-smoke/OfflineTree
          "dist-offline/${{ matrix.asset }}" link examples/slider-window.patch --name OfflineSlider --out dist-smoke/OfflineSlider
          "dist-offline/${{ matrix.asset }}" link examples/chrome-window.patch --name OfflineChrome --out dist-smoke/OfflineChrome
          test -s dist-smoke/OfflineSmoke.html
      - name: Smoke linked Window apps on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          & ./dist-smoke/OfflineLinked.exe
          if ($LASTEXITCODE -ne 0) { throw "Linked Console smoke failed with exit code $LASTEXITCODE." }
          foreach ($name in @('OfflineResponsive','OfflineTable','OfflineMulti','OfflineMenu','OfflineTree','OfflineSlider','OfflineChrome')) {
            & "./dist-smoke/$name.exe" --patch-smoke
            if ($LASTEXITCODE -ne 0) { throw "$name smoke failed with exit code $LASTEXITCODE." }
            $sealed = [System.IO.File]::ReadAllBytes((Resolve-Path "dist-smoke/$name.exe"))
            if ([BitConverter]::ToUInt32($sealed, $sealed.Length - 12) -ne 14) { throw "$name is not sealed payload v14." }
          }
      - name: Smoke linked Window apps on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          chmod +x dist-smoke/OfflineLinked dist-smoke/OfflineResponsive dist-smoke/OfflineTable dist-smoke/OfflineMulti dist-smoke/OfflineMenu dist-smoke/OfflineTree dist-smoke/OfflineSlider dist-smoke/OfflineChrome
          ./dist-smoke/OfflineLinked
          for name in OfflineResponsive OfflineTable OfflineMulti OfflineMenu OfflineTree OfflineSlider OfflineChrome; do
            xvfb-run -a "./dist-smoke/$name" --patch-smoke
          done
          node - <<'NODE'
          const fs=require('fs');
          for(const name of ['OfflineResponsive','OfflineTable','OfflineMulti','OfflineMenu','OfflineTree','OfflineSlider','OfflineChrome']){
            const sealed=fs.readFileSync(`dist-smoke/${name}`);
            if(sealed.readUInt32LE(sealed.length-12)!==14) throw new Error(`${name} is not sealed payload v14.`);
          }
          NODE
      - name: Smoke linked Window apps on macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          CONSOLE_APP=dist-smoke/OfflineLinked.app/Contents/MacOS/OfflineLinked
          test -x "$CONSOLE_APP"
          "$CONSOLE_APP"
          for name in OfflineResponsive OfflineTable OfflineMulti OfflineMenu OfflineTree OfflineSlider OfflineChrome; do
            APP="dist-smoke/$name.app/Contents/MacOS/$name"
            test -x "$APP"
            "$APP" --patch-smoke
            node - "$APP" <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync(process.argv[2]);
          if(sealed.readUInt32LE(sealed.length-12)!==14) throw new Error(`${process.argv[2]} is not sealed payload v14.`);
          NODE
          done
      - uses: actions/upload-artifact@v7
        with:
          name: offline-compiler-${{ matrix.platform }}-${{ matrix.asset }}
          path: dist-offline/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  macos-intel-kit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build portable Intel macOS compiler kit with runtime v1.5
        shell: bash
        run: |
          ROOT=dist-intel/patch-macos-x64
          mkdir -p "$ROOT/src" "$ROOT/runtime" dist-smoke
          cp -R src/. "$ROOT/src/"
          cp package.json LICENSE "$ROOT/"
          cp "$(command -v node)" "$ROOT/runtime/node"
          chmod +x "$ROOT/runtime/node"
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch x86_64 -framework Cocoa \
            native-runtime/appkit-sealed-gui-v15.mm -o "$ROOT/runtime/gui.bin"
          chmod +x "$ROOT/runtime/gui.bin"
          cat > "$ROOT/patch" <<'EOF'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export PATCH_OFFLINE_NODE_RUNTIME="$ROOT/runtime/node"
          export PATCH_OFFLINE_GUI_RUNTIME="$ROOT/runtime/gui.bin"
          exec "$ROOT/runtime/node" "$ROOT/src/cli-entry.js" "$@"
          EOF
          chmod +x "$ROOT/patch"
          cat > "$ROOT/README.txt" <<'EOF'
          Patch macOS Intel offline compiler kit
          No installed Node.js runtime is required. The Intel Node runtime is included.
          Use: ./patch check app.patch
               ./patch run app.patch
               ./patch build app.patch --target web --out App.html
               ./patch link app.patch --out App
          Console link creates a portable .app containing direct Patch Wasm plus the embedded Intel Node runtime.
          Window link seals Native GUI IR 1.4 into payload v14/runtime v1.5, including responsive Anchor/Dock, Table/Grid, list-backed multi-select ListBox, Menu state/shortcuts, TreeView, Slider and Chrome Stage 1 controls.
          EOF
          (cd dist-intel && tar -czf patch-macos-x64.tar.gz patch-macos-x64)
          test -s dist-intel/patch-macos-x64.tar.gz
      - name: Smoke Intel kit and current Window link paths
        shell: bash
        env:
          PATCH_NATIVE_HEADLESS: '1'
        run: |
          KIT=dist-intel/patch-macos-x64
          "$KIT/patch" check examples/direct-wasm-recipes.patch
          "$KIT/patch" build examples/direct-wasm-recipes.patch --kind console --target web --out dist-smoke/IntelSmoke.html
          "$KIT/patch" link examples/direct-wasm-recipes.patch --name IntelConsole --out dist-smoke/IntelConsole
          test -s dist-smoke/IntelSmoke.html
          CONSOLE_APP=dist-smoke/IntelConsole.app/Contents/MacOS/IntelConsole
          test -x "$CONSOLE_APP"
          actual="$("$CONSOLE_APP")"
          test "$actual" = "8"
          for pair in "responsive-window.patch IntelWindow" "table-native-v09.patch IntelTable" "listbox-multiselect-native.patch IntelMulti" "menu-state-window.patch IntelMenu" "treeview-window.patch IntelTree" "slider-window.patch IntelSlider" "chrome-window.patch IntelChrome"; do
            set -- $pair
            "$KIT/patch" link "examples/$1" --name "$2" --out "dist-smoke/$2"
            APP="dist-smoke/$2.app/Contents/MacOS/$2"
            test -x "$APP"
            "$APP" --patch-smoke
            node - "$APP" <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync(process.argv[2]);
          if(sealed.readUInt32LE(sealed.length-12)!==14) throw new Error('Intel offline compiler Window output is not sealed payload v14.');
          NODE
          done
      - uses: actions/upload-artifact@v7
        with:
          name: offline-compiler-macos-intel
          path: dist-intel/patch-macos-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  freebsd-kit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build portable FreeBSD offline kit
        shell: bash
        run: |
          mkdir -p dist-freebsd/patch-freebsd-x64/src
          cp -R src/. dist-freebsd/patch-freebsd-x64/src/
          cp package.json LICENSE dist-freebsd/patch-freebsd-x64/
          cat > dist-freebsd/patch-freebsd-x64/patch <<'EOF'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec node "$ROOT/src/cli-entry.js" "$@"
          EOF
          chmod +x dist-freebsd/patch-freebsd-x64/patch
          cat > dist-freebsd/patch-freebsd-x64/README.txt <<'EOF'
          Patch FreeBSD offline compiler kit
          Requires Node.js 22+ and a C99-compatible cc on the FreeBSD host.
          After download no network access is required.
          Use: ./patch check app.patch
               ./patch run app.patch
               ./patch build app.patch --target web --out App.html
               ./patch link app.patch --out App
          Window/GUI linking is not supported on FreeBSD yet.
          EOF
          (cd dist-freebsd && tar -czf patch-freebsd-x64.tar.gz patch-freebsd-x64)
          test -s dist-freebsd/patch-freebsd-x64.tar.gz
          node --test tests/offline-linker.test.js
      - name: Smoke portable kit inside FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1.5.3
        with:
          release: '15.1'
          usesh: true
          run: |
            pkg install -y node24
            node --version
            cc --version | head -1
            tar -xzf dist-freebsd/patch-freebsd-x64.tar.gz -C dist-freebsd
            dist-freebsd/patch-freebsd-x64/patch check examples/direct-wasm-recipes.patch
            dist-freebsd/patch-freebsd-x64/patch link examples/direct-wasm-recipes.patch --name OfflineFreeBSD --out dist-freebsd/OfflineFreeBSD
            actual="$(dist-freebsd/OfflineFreeBSD)"
            test "$actual" = "8"
      - uses: actions/upload-artifact@v7
        with:
          name: offline-compiler-freebsd
          path: dist-freebsd/patch-freebsd-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, macos-intel-kit, freebsd-kit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: offline-compiler-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum patch-windows-x64.exe patch-macos-arm64 patch-macos-x64.tar.gz patch-linux-x64 patch-freebsd-x64.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish Patch offline compiler v0.2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: offline-compiler-v0.2
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Patch Offline Compiler v0.2' --notes 'Patch beta.36 offline compiler downloads for Windows, macOS Apple Silicon and Linux, plus portable compiler kits for macOS Intel and FreeBSD. Windows/macOS/Linux Window linking embeds Native GUI IR 1.4 as sealed payload v14/runtime v1.5 with responsive layout, Table/Grid, ListBox, Menu, TreeView, Slider and Chrome Stage 1 controls. Supported run/build/link workflows work locally without a GitHub token.'
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber