name: R0 large Designer preview measurement

on:
  push:
    branches: [gpt/r0-large-preview-measurement-282]
    paths:
      - .github/workflows/r0-large-preview-measurement-once.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Syntax check measurement harness
        run: node --check scripts/measure-studio-large-previews.js
      - name: Measure large Table and Tree Designer previews
        run: node scripts/measure-studio-large-previews.js
