name: Patch Formal Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4 proofs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build Lean formalization
        working-directory: formal
        run: |
          lake update
          lake build
      - name: Reject unfinished proofs
        shell: bash
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b' formal/*.lean; then
            echo 'Unfinished Lean proof found.'
            exit 1
          fi
