name: Deploy Patch Studio

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Patch Studio Runtime Templates]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/configure-pages@v6
      - name: Build public site
        run: npm run build:site
      - name: Add prebuilt native runtime templates
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: studio-runtime-v0.2
        run: |
          mkdir -p _site/runtimes
          if gh release view "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'patch-*-runtime.*' --dir _site/runtimes --clobber
            ls -lh _site/runtimes
          else
            echo "Runtime release $RUNTIME_TAG is not published yet. The runtime-template workflow will trigger a second Pages deployment after publishing it."
          fi
      - name: Validate public site
        run: npm run check:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
