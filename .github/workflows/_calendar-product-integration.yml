name: Calendar Product Integration Helper

on:
  push:
    branches:
      - rad/calendar-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/calendar-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply Calendar product integration
        run: node scripts/_calendar-product-integration.mjs
      - name: Update Calendar current/future contract test
        run: node scripts/_calendar-product-test-fix.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused Calendar and Showcase tests
        run: npm test -- tests/calendar-stage1.test.js tests/studio-showcase.test.js tests/studio-showcase-loader.test.js tests/docs-current-studio-surface.test.js tests/studio-authoring-surface.test.js tests/handbook-site.test.js
      - name: Full repository tests
        run: npm test
      - name: Example checks
        run: npm run check
      - name: Build public site
        run: npm run build:site
      - name: Validate public site
        run: npm run check:site
      - name: Commit verified Calendar product integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            docs/ROADMAP.md \
            docs/RAD_STUDIO_MASTER_BACKLOG.md \
            docs/STUDIO_AUTHORING_SURFACE.md \
            examples/calendar-window.patch \
            examples/patch-studio-showcase.patchproject \
            examples/patch-studio-showcase/README.md \
            examples/patch-studio-showcase/main.patch \
            examples/patch-studio-showcase/forms.patch \
            examples/patch-studio-showcase/logic.patch \
            web/index.html \
            web/examples.html \
            web/studio-showcase-project.js \
            tests/studio-showcase.test.js \
            tests/docs-current-studio-surface.test.js \
            tests/studio-authoring-surface.test.js \
            tests/handbook-site.test.js
          git commit -m "RAD: integrate Calendar across Showcase and docs [skip ci]"
          git push origin HEAD:rad/calendar-stage1
