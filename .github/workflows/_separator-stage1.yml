name: Separator Stage 1 Helper

on:
  push:
    branches:
      - rad/separator-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/separator-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply Separator Stage 1
        run: node scripts/_separator-stage1.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused Separator and Showcase tests
        run: npm test -- tests/designer-shape-studio.test.js tests/studio-showcase.test.js tests/studio-showcase-loader.test.js tests/docs-current-studio-surface.test.js
      - name: Full repository tests
        run: npm test
      - name: Example and project gates
        run: |
          npm run check
          npm run check:project
      - name: Public site gate
        run: |
          npm run build:site
          npm run check:site
      - name: Commit verified Separator Stage 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/designer-shape.js \
            web/designer-workspace.js \
            tests/designer-shape-studio.test.js \
            docs/RAD_STUDIO_MASTER_BACKLOG.md \
            docs/ROADMAP.md \
            docs/STUDIO_AUTHORING_SURFACE.md \
            README.md \
            web/index.html \
            examples/patch-studio-showcase/forms.patch \
            examples/patch-studio-showcase/README.md \
            tests/studio-showcase.test.js \
            examples/patch-studio-showcase.patchproject \
            web/studio-showcase-project.js
          git commit -m "RAD: add Separator Stage 1 [skip ci]"
          git push origin HEAD:rad/separator-stage1
