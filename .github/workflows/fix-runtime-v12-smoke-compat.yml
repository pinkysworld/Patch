name: Patch Runtime v1.2 Smoke Compatibility Fix

on:
  push:
    branches: [agent/runtime-v12-smoke-compat]
    paths:
      - runtime-v12-smoke-compat.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/runtime-v12-smoke-compat
      - name: Apply additive Menu smoke transformation
        run: python scripts/fix-runtime-v12-smoke-compat.py
      - name: Verify source shape
        run: |
          grep -q 'if(!hasDecorations)return 0;' native-runtime/win32-sealed-gui-v12.cpp
          grep -q 'if(!hasDecorations)return 0;' native-runtime/appkit-sealed-gui-v12.mm
          grep -q 'if(!hasDecorations)return 0;' native-runtime/gtk-sealed-gui-v12.cpp
      - name: Commit runtime smoke fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-runtime/win32-sealed-gui-v12.cpp native-runtime/appkit-sealed-gui-v12.mm native-runtime/gtk-sealed-gui-v12.cpp
          git commit -m 'Make runtime v1.2 Menu smoke additive'
          git push origin HEAD:agent/runtime-v12-smoke-compat
