name: Patch Native ListBox v1.2

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build-native-*.js'
      - 'examples/listbox-multiselect-native.patch'
      - 'tests/native-listbox-multiselect.test.js'
      - '.github/workflows/native-listbox-v12.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/build-native-*.js'
      - 'examples/listbox-multiselect-native.patch'
      - 'tests/native-listbox-multiselect.test.js'
      - '.github/workflows/native-listbox-v12.yml'

permissions:
  contents: read

jobs:
  native-listbox:
    name: ${{ matrix.name }} native ListBox 1.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Win32
            script: build-native-win32.js
          - os: macos-latest
            name: AppKit
            script: build-native-appkit.js
          - os: ubuntu-latest
            name: GTK3
            script: build-native-gtk.js
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install GTK3 smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb
      - name: Run native ListBox contract tests
        run: node --test tests/native-listbox-multiselect.test.js
      - name: Build and smoke native multi-select ListBox app
        run: node scripts/${{ matrix.script }} examples/listbox-multiselect-native.patch PatchNativeListV12 dist/native-list-v12 --smoke --list-v12
