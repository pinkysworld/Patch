name: Patch CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
        node: ${{ github.event_name == 'pull_request' && fromJSON('["24"]') || fromJSON('["22","24"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Syntax check
        run: npm run check:syntax
      - name: Repository security policy gate
        run: node scripts/security-policy-check.js
      - name: Table support cross-surface regression
        run: node --test tests/table-support-surface.test.js
      - name: Beta34 Studio hardening regressions
        run: node --test tests/runtime-integrity-manifest.test.js tests/studio-dom-sync.test.js tests/studio-runtime-integrity.test.js tests/native-runtime-trigger-hygiene.test.js
      - name: Studio UX and browser reliability regressions
        run: node --test tests/studio-command-palette.test.js tests/studio-worker-canonical-registration.test.js tests/studio-worker-reload-guard.test.js tests/studio-mutation-guard.test.js tests/studio-startup-diagnostics.test.js
      - name: Site navigation regression
        run: node --test tests/site-navigation.test.js
      - name: Offline downloads regression
        run: node --test tests/offline-downloads-page.test.js
      - name: Studio live-update regression
        run: node --test tests/studio-live-update.test.js
      - name: Studio project lifecycle regression
        run: node --test tests/studio-project-web.test.js
      - name: Studio sealed Table regression
        run: node --test tests/studio-sealed-table-v10.test.js
      - name: Site Designer bundle regression
        run: node --test tests/site-alignment-bundle.test.js
      - name: Formal scope report
        run: node scripts/report-formal-scope.js
      - name: Language, compiler, formal, source/runtime/call/concrete-call certificate, direct-Wasm, C99, app-build, validator, designer and bootstrap-Wasm tests
        run: node scripts/run-tests-ci.js
      - name: Studio Chrome startup smoke
        timeout-minutes: 2
        run: node --test tests/studio-browser-startup.test.js
      - name: Workshop Desk Chrome stress smoke
        if: runner.os == 'Linux' && matrix.node == '24'
        timeout-minutes: 2
        run: node --test tests/workshop-desk-browser.test.js
      - name: Studio browser performance gate
        if: runner.os == 'Linux' && matrix.node == '24'
        timeout-minutes: 2
        run: node --test tests/studio-browser-performance-contract.test.js tests/studio-browser-performance.test.js
      - name: Upload concise test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: patch-test-failures-${{ runner.os }}-node-${{ matrix.node }}
          path: test-failures.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Deterministic parser and compiler grammar fuzz
        if: runner.os == 'Linux' && matrix.node == '24'
        run: npm run fuzz:compiler
      - name: Interpreter direct-Wasm and executable C99 differential corpus
        if: runner.os == 'Linux' && matrix.node == '24'
        run: npm run test:differential
      - name: Patch doctor diagnostics
        run: npm run doctor
      - name: Example smoke tests
        run: npm run check
      - name: Formal correspondence, source-validation and range-coverage smoke test
        run: npm run formal:example
      - name: Generate Lean-checkable range/source/evidence certificate
        run: npm run certify:example
      - name: Execute direct Wasm and generate Lean runtime correspondence certificate
        run: npm run runtime-certify:example
      - name: Generate Lean recipe-call composition certificate
        run: npm run call-certify:example
      - name: Generate Lean concrete recipe-call binding/effect certificate
        run: npm run concrete-call-certify:example
      - name: Generate Lean arithmetic concrete-call certificate
        run: npm run arithmetic-call-certify:example
      - name: Generate Lean structured callee trace certificate
        run: npm run callee-trace-certify:example
      - name: Generate Lean guard-aware structured callee trace certificate
        run: npm run guarded-callee-trace-certify:example
      - name: Generate Lean finite transitive exact call-tree certificate
        run: npm run transitive-callee-trace-certify:example
      - name: Execute direct Wasm and generate invocation-frame runtime certificate
        run: npm run transitive-runtime-certify:example
      - name: Execute repeated direct Wasm calls and generate invocation-frame evidence
        run: npm run transitive-runtime-certify:repeated
      - name: Post-generation formal scope report
        run: node scripts/report-formal-scope.js
      - name: Portable application build
        run: npm run build:example
      - name: Bootstrap WebAssembly application build
        run: npm run build:wasm
      - name: Direct WebAssembly application build
        run: npm run build:wasm-direct
      - name: Portable C99 source build
        run: npm run build:c99
      - name: Standalone single-file Console Web App build
        run: npm run build:web
      - name: Standalone single-file Window Web App build
        run: node src/cli.js build examples/counter-window.patch --target web --out CounterWindow.html
      - name: Generate deterministic release integrity manifest
        run: npm run release:manifest:example
      - name: Execute direct WebAssembly application
        run: npm run run:wasm-direct
      - name: Independently validate direct WebAssembly transition trace
        run: npm run validate:wasm-direct
      - name: Check README website docs and version consistency
        run: npm run check:project
      - name: Build public Patch Studio site
        run: npm run build:site
      - name: Validate public Patch Studio site
        run: npm run check:site
      - name: Validate Table-ready Patch Studio surface
        run: node scripts/check-site-v10.js
