name: LinkLabel Integration Helper

on:
  push:
    branches:
      - rad/linklabel-stage1

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rad/linklabel-stage1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply LinkLabel Showcase and docs integration
        run: node scripts/_linklabel-integration.mjs
      - name: Syntax gate
        run: npm run check:syntax
      - name: Focused LinkLabel integration tests
        run: npm test -- tests/linklabel-stage1.test.js tests/studio-showcase.test.js tests/studio-showcase-loader.test.js tests/docs-current-studio-surface.test.js
      - name: Full repository tests
        run: npm test
      - name: Example and project gates
        run: |
          npm run check
          npm run check:project
      - name: Public site gate
        run: |
          npm run build:site
          npm run check:site
      - name: Commit verified LinkLabel integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            docs/STUDIO_AUTHORING_SURFACE.md \
            docs/ROADMAP.md \
            docs/RAD_STUDIO_MASTER_BACKLOG.md \
            examples/patch-studio-showcase/main.patch \
            examples/patch-studio-showcase/forms.patch \
            examples/patch-studio-showcase/logic.patch \
            examples/patch-studio-showcase/README.md \
            examples/patch-studio-showcase.patchproject \
            web/studio-showcase-project.js \
            web/index.html \
            tests/studio-showcase.test.js \
            tests/docs-current-studio-surface.test.js
          git commit -m "RAD: integrate LinkLabel into Showcase and docs [skip ci]"
          git push origin HEAD:rad/linklabel-stage1
