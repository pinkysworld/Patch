name: Patch Native Win32 Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/native-win32-runtime.yml
      - native-runtime/win32-sealed-gui-v07.cpp
      - scripts/seal-native-win32.js
      - src/sealed-native-gui.js
      - src/native-gui-ir.js
      - src/window-events.js
      - src/window-build.js
      - src/compiler.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - examples/forms-navigation.patch
      - examples/combo-window.patch
      - examples/listbox-window.patch
      - examples/tabs-window.patch
      - examples/radio-window.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - tests/sealed-native-gui.test.js
      - tests/combobox-window.test.js
      - tests/listbox-window.test.js
      - tests/tabs-window.test.js
      - tests/radio-window.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - web/native-build.js
      - scripts/build-site.js
      - scripts/check-site.js
  push:
    branches: [main]
    paths:
      - .github/workflows/native-win32-runtime.yml
      - native-runtime/win32-sealed-gui-v07.cpp
      - scripts/seal-native-win32.js
      - src/sealed-native-gui.js
      - src/native-gui-ir.js
      - src/window-events.js
      - src/window-build.js
      - src/compiler.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - examples/forms-navigation.patch
      - examples/combo-window.patch
      - examples/listbox-window.patch
      - examples/tabs-window.patch
      - examples/radio-window.patch
      - examples/menu-dialog-window.patch
      - examples/result-dialog-window.patch
      - tests/sealed-native-gui.test.js
      - tests/combobox-window.test.js
      - tests/listbox-window.test.js
      - tests/tabs-window.test.js
      - tests/radio-window.test.js
      - tests/menu-dialog-window.test.js
      - tests/result-dialog-window.test.js
      - web/native-build.js
      - scripts/build-site.js
      - scripts/check-site.js

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Compile generic native Win32 GUI runtime v0.7
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-runtime | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          $script = Join-Path $PWD 'dist-runtime\build-runtime.cmd'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 native-runtime\win32-sealed-gui-v07.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-runtime\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content -Path $script -Encoding ascii
          & cmd.exe /d /c $script
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal and smoke canonical Forms app
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/forms-navigation.patch dist-runtime/patch-windows-native-gui-runtime.exe dist-runtime/PatchSealedForms.exe PatchSealedForms
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime/PatchSealedForms.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed native Forms smoke failed with exit code $($process.ExitCode)." }
      - name: Seal and smoke native ComboBox application
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/combo-window.patch dist-runtime/patch-windows-native-gui-runtime.exe dist-runtime/PatchSealedCombo.exe PatchSealedCombo
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime/PatchSealedCombo.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed native ComboBox smoke failed with exit code $($process.ExitCode)." }
      - name: Seal and smoke native ListBox application
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/listbox-window.patch dist-runtime/patch-windows-native-gui-runtime.exe dist-runtime/PatchSealedListBox.exe PatchSealedListBox
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime/PatchSealedListBox.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed native ListBox smoke failed with exit code $($process.ExitCode)." }
      - name: Seal and smoke native Tabs application
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/tabs-window.patch dist-runtime/patch-windows-native-gui-runtime.exe dist-runtime/PatchSealedTabs.exe PatchSealedTabs
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime/PatchSealedTabs.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed native Tabs smoke failed with exit code $($process.ExitCode)." }
      - name: Seal and smoke native Radio application
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/radio-window.patch dist-runtime/patch-windows-native-gui-runtime.exe dist-runtime/PatchSealedRadio.exe PatchSealedRadio
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime/PatchSealedRadio.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed native Radio smoke failed with exit code $($process.ExitCode)." }
      - name: Seal and smoke native Menu Dialog application
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/menu-dialog-window.patch dist-runtime/patch-windows-native-gui-runtime.exe dist-runtime/PatchSealedMenuDialog.exe PatchSealedMenuDialog
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime/PatchSealedMenuDialog.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed native Menu/Dialog smoke failed with exit code $($process.ExitCode)." }
      - name: Seal and smoke native Result Dialog application
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/result-dialog-window.patch dist-runtime/patch-windows-native-gui-runtime.exe dist-runtime/PatchSealedResultDialog.exe PatchSealedResultDialog
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime/PatchSealedResultDialog.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed native Result Dialog smoke failed with exit code $($process.ExitCode)." }
      - name: Verify template and payload-v7 contract
        shell: pwsh
        run: |
          $runtime = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist-runtime/patch-windows-native-gui-runtime.exe'))
          $sealed = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist-runtime/PatchSealedResultDialog.exe'))
          if ($runtime.Length -lt 2 -or $runtime[0] -ne 0x4d -or $runtime[1] -ne 0x5a) { throw 'Runtime is not a PE executable.' }
          if ($sealed.Length -le $runtime.Length) { throw 'Sealed application did not append a payload.' }
          $magic = [Text.Encoding]::ASCII.GetString($sealed, $sealed.Length - 20, 8)
          if ($magic -ne 'PCHGUI01') { throw 'Sealed executable footer magic is missing.' }
          $version = [BitConverter]::ToUInt32($sealed, $sealed.Length - 12)
          if ($version -ne 7) { throw "Expected sealed native GUI payload v7, got v$version." }
          if ($runtime.Length -gt 2097152) { throw "Generic native runtime unexpectedly exceeds 2 MiB: $($runtime.Length) bytes." }
          Write-Host "Generic runtime: $($runtime.Length) bytes; sealed Result Dialog app: $($sealed.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: patch-windows-native-gui-runtime
          path: dist-runtime/patch-windows-native-gui-runtime.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: patch-windows-native-gui-runtime
          path: runtime
      - name: Publish native runtime template
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-win32-runtime-v0.7
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Patch Native Win32 Runtime v0.7' --notes 'Native Win32 sealed-GUI runtime template for token-free Patch Studio builds. Payload v7 adds result-bearing Confirm/Open/Save dialogs via MessageBoxW and native common dialogs while preserving explicit Patch change semantics and the v0.6 Menu/Dialog, Radio, Tabs and control surface.'
          fi
          gh release upload "$TAG" runtime/patch-windows-native-gui-runtime.exe --repo "$GITHUB_REPOSITORY" --clobber
