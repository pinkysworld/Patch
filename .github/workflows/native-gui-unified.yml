name: Patch Native GUI Unified Build

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install Linux native GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Check unified native builder and accessibility contract
        run: |
          node --check src/native-gui-host.js
          node --check src/native-accessibility.js
          node --check src/native-current-contract.js
          node --check src/native-frozen-contract.js
          node --check src/win32-gui-v13.js
          node --check src/win32-gui-v14.js
          node --check src/appkit-gui-v13.js
          node --check src/appkit-gui-v14.js
          node --check src/gtk-gui-v13.js
          node --check src/gtk-gui-v14.js
          node --check scripts/build-native-gui.js
          node --check tests/native-gui-host.test.js
          node --check tests/native-accessibility.test.js
          node --test tests/native-gui-host.test.js tests/native-accessibility.test.js
      - name: Build and execute native Forms app through one command
        shell: bash
        run: node scripts/build-native-gui.js examples/forms-navigation.patch UnifiedPatchApp dist-unified --smoke
      - name: Build and execute native ComboBox app through one command
        shell: bash
        run: node scripts/build-native-gui.js examples/combo-window.patch UnifiedPatchCombo dist-unified-combo --smoke
      - name: Build and execute native ListBox app through one command
        shell: bash
        run: node scripts/build-native-gui.js examples/listbox-window.patch UnifiedPatchListBox dist-unified-listbox --smoke
      - name: Build and execute native Tabs app through one command
        shell: bash
        run: node scripts/build-native-gui.js examples/tabs-window.patch UnifiedPatchTabs dist-unified-tabs --smoke
      - name: Build and execute native Radio app through one command
        shell: bash
        run: node scripts/build-native-gui.js examples/radio-window.patch UnifiedPatchRadio dist-unified-radio --smoke
      - name: Build and execute native Menu Dialog app through one command
        shell: bash
        run: node scripts/build-native-gui.js examples/menu-dialog-window.patch UnifiedPatchMenuDialog dist-unified-menu-dialog --smoke
      - name: Build and execute native Result Dialog app through one command
        shell: bash
        run: node scripts/build-native-gui.js examples/result-dialog-window.patch UnifiedPatchResultDialog dist-unified-result-dialog --smoke
      - name: Verify selected backend metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const expected = process.platform === 'win32' ? 'native-win32' : process.platform === 'darwin' ? 'native-appkit' : 'native-gtk3';
          for (const dir of ['dist-unified','dist-unified-combo','dist-unified-listbox','dist-unified-tabs','dist-unified-radio','dist-unified-menu-dialog','dist-unified-result-dialog']) {
            const files = fs.readdirSync(dir).filter(name => name.endsWith('-build.json'));
            if (files.length !== 1) throw new Error(`Expected one build metadata file in ${dir}, got: ${files.join(', ')}`);
            const meta = JSON.parse(fs.readFileSync(path.join(dir, files[0]), 'utf8'));
            if (meta.shell !== expected) throw new Error(`Expected ${expected}, got ${meta.shell}`);
            if (meta.electron !== false) throw new Error('Unified native build must record electron=false.');
            if (meta.nativeGuiIrVersion !== '1.2') throw new Error(`Expected Native GUI IR 1.2, got ${meta.nativeGuiIrVersion}`);
            if (meta.backendVersion !== '1.3') throw new Error(`Expected backend 1.3, got ${meta.backendVersion}`);
          }
          console.log(`Unified host selected ${expected} frozen Native GUI IR 1.2 / backend 1.3 for Forms, ComboBox, ListBox, Tabs, Radio, Menu/Dialog and Result Dialogs`);
          NODE