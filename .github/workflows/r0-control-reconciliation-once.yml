name: R0 control-level runtime reconciliation

on:
  push:
    branches:
      - gpt/r0-control-reconciliation-282
    paths:
      - .github/workflows/r0-control-reconciliation-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt/r0-control-reconciliation-282
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply guarded runtime reconciliation integration
        run: python3 .github/scripts/r0_control_reconciliation_once.py
      - name: Verify keyed control reconciliation
        run: |
          node --check web/playground.js
          node --test tests/studio-runtime-control-reconciliation.test.js tests/studio-runtime-keyed-renderer.test.js
          node --test tests/workshop-desk-browser.test.js
          node scripts/build-site.js
          npm run check:site
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r0-control-reconciliation-once.yml .github/scripts/r0_control_reconciliation_once.py
          git add web/playground.js tests/studio-runtime-control-reconciliation.test.js tests/studio-runtime-keyed-renderer.test.js tests/workshop-desk-browser.test.js
          git commit -m "Reconcile changed runtime controls inside stable Forms"
          git push origin HEAD:gpt/r0-control-reconciliation-282
