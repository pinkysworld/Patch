name: Patch Beta30 Transitive Callee Traces

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transitive-callee-traces:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run transitive call-tree regression tests
        run: node --test tests/transitive-call-body.test.js tests/transitive-call-body-certificate.test.js
      - name: Generate beta.29 regression certificate
        run: npm run guarded-callee-trace-certify:example
      - name: Generate proof-free beta.30 transitive call-tree certificate
        run: node scripts/generate-transitive-call-body-certificate.js examples/formal-transitive-calls.patch --out formal/GeneratedTransitiveCallBodyCertificate.lean
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Build beta.29 dependencies and beta.30 call-tree semantics
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls PatchCallSubstitution PatchCallRefinement PatchCallEffect PatchCallBody PatchCallBodyImport
          lake env lean PatchCallTree.lean
      - name: Verify beta.29 regression certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedGuardedCallBodyCertificate.lean
      - name: Verify generated beta.30 transitive call-tree certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedTransitiveCallBodyCertificate.lean
      - name: Reject unfinished beta.30 proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/PatchCallTree.lean formal/GeneratedTransitiveCallBodyCertificate.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Unfinished beta.30 proof found.'
            exit 1
          fi
