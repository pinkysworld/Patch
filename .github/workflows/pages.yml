name: Deploy Patch Studio

on:
  push:
    branches: [main]
    paths:
      - web/**
      - scripts/build-site.js
      - scripts/check-site.js
      - scripts/check-site-v10.js
      - package.json
      - src/interpreter.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - src/change-analysis.js
      - src/range-analysis.js
      - src/formal-range.js
      - src/formal-guard.js
      - src/formal-calls.js
      - src/formal-bridge.js
      - src/formal-source.js
      - src/source-validation.js
      - src/guard-validation.js
      - src/compiler.js
      - src/bundle.js
      - src/wasm.js
      - src/wasm-direct.js
      - src/c99.js
      - src/webapp.js
      - src/window-webapp.js
      - src/window-build.js
      - src/window-events.js
      - src/window-layout-policy.js
      - src/designer.js
      - src/form-layout.js
      - src/window-compiled.js
      - src/native-gui-ir.js
      - src/native-gui-ir-v08.js
      - src/sealed-native-gui.js
      - src/sealed-native-package.js
      - src/prebuilt-native.js
      - src/prebuilt-window.js
      - src/local-native-kit.js
      - src/concrete-call-witness.js
      - src/concrete-call-certificate.js
      - src/concrete-call-body.js
      - src/concrete-call-body-certificate.js
      - .github/workflows/pages.yml
      - .github/workflows/runtime-templates.yml
      - .github/workflows/native-win32-runtime.yml
      - .github/workflows/native-linux-runtime.yml
      - .github/workflows/native-macos-runtime.yml
      - .github/workflows/native-responsive-runtime.yml
      - .github/workflows/native-sealed-table-runtime.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Patch Studio Runtime Templates, Patch Native Win32 Runtime, Patch Native Linux Runtime, Patch Native macOS Runtime, Patch Native Responsive Runtime, Patch Native Sealed Table Runtime]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/configure-pages@v6
      - name: Build public site
        run: npm run build:site
      - name: Check Table-capable native runtime releases
        id: native_runtime
        env:
          GH_TOKEN: ${{ github.token }}
          WIN32_RUNTIME_TAG: native-win32-runtime-v1.0
          LINUX_NATIVE_RUNTIME_TAG: native-linux-runtime-v1.0
          MACOS_NATIVE_RUNTIME_TAG: native-macos-runtime-v1.0
        shell: bash
        run: |
          missing=0
          for tag in "$WIN32_RUNTIME_TAG" "$LINUX_NATIVE_RUNTIME_TAG" "$MACOS_NATIVE_RUNTIME_TAG"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Found $tag"
            else
              echo "Waiting for $tag"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Table-capable runtime v1.0 is not fully published yet. This Pages run will finish successfully without replacing the current site; successful runtime publication triggers another Pages run.'
          fi
      - name: Add compiled prebuilt native runtime templates
        if: steps.native_runtime.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: studio-runtime-v0.6
          WIN32_RUNTIME_TAG: native-win32-runtime-v1.0
          LINUX_NATIVE_RUNTIME_TAG: native-linux-runtime-v1.0
          MACOS_NATIVE_RUNTIME_TAG: native-macos-runtime-v1.0
        run: |
          mkdir -p _site/runtimes
          if gh release view "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'patch-*-runtime.*' --dir _site/runtimes --clobber
          else
            echo "Compatibility runtime release $RUNTIME_TAG is not published yet."
          fi
          gh release download "$WIN32_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'patch-windows-native-gui-runtime.exe' --dir _site/runtimes --clobber
          gh release download "$LINUX_NATIVE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'patch-linux-native-gui-runtime.bin' --dir _site/runtimes --clobber
          gh release download "$MACOS_NATIVE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'patch-macos-native-gui-runtime.bin' --dir _site/runtimes --clobber
          ls -lh _site/runtimes
      - name: Validate public site
        if: steps.native_runtime.outputs.ready == 'true'
        run: npm run check:site
      - name: Validate Table-ready Studio surface
        if: steps.native_runtime.outputs.ready == 'true'
        run: node scripts/check-site-v10.js
      - uses: actions/upload-pages-artifact@v5
        if: steps.native_runtime.outputs.ready == 'true'
        with:
          path: _site
      - name: Deploy
        if: steps.native_runtime.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
