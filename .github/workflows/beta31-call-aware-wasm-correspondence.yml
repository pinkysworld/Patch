name: Patch Beta31 Call-Aware Wasm Correspondence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  call-aware-wasm-correspondence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run beta31 runtime/call-tree regression tests
        run: node --test tests/transitive-call-body.test.js tests/transitive-call-body-certificate.test.js tests/transitive-runtime-correspondence.test.js tests/transitive-runtime-certificate.test.js
      - name: Generate beta30 transitive regression certificate
        run: npm run transitive-callee-trace-certify:example
      - name: Execute direct Wasm and generate beta31 call-aware runtime certificate
        run: npm run transitive-runtime-certify:example
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Build beta30 and beta31 Lean bridge
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls PatchCallSubstitution PatchCallRefinement PatchCallEffect PatchCallBody PatchCallBodyImport PatchCallTree PatchCallRuntime
      - name: Verify beta30 transitive regression certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedTransitiveCallBodyCertificate.lean
      - name: Verify generated beta31 call-aware direct-Wasm certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedTransitiveRuntimeCertificate.lean
      - name: Reject unfinished beta31 proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/PatchCallRuntime.lean formal/GeneratedTransitiveRuntimeCertificate.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Unfinished beta.31 proof found.'
            exit 1
          fi
