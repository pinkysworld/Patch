name: R0 fallback documentation sync 2

on:
  push:
    branches: [gpt/r0-full-render-fallback-282]
    paths:
      - .github/workflows/r0-fallback-doc-sync2-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply exact documentation sync
        run: python3 scripts/r0-fallback-doc-sync-once.py
      - name: Verify synchronized product status
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'studio-runtime-selection-state/0.1' docs/RAD_STUDIO_MASTER_BACKLOG.md
          grep -F '?patch-runtime-render=full' docs/RAD_STUDIO_MASTER_BACKLOG.md
          grep -F 'studio-design-snapshots/0.1' docs/ROADMAP.md
          grep -F '?patch-runtime-render=full' docs/ROADMAP.md
          npm run check:project
      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r0-fallback-doc-sync-once.yml
          rm .github/workflows/r0-fallback-doc-sync2-once.yml
          rm scripts/r0-fallback-doc-sync-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/RAD_STUDIO_MASTER_BACKLOG.md .github/workflows/r0-fallback-doc-sync-once.yml .github/workflows/r0-fallback-doc-sync2-once.yml scripts/r0-fallback-doc-sync-once.py
          git commit -m 'Sync R0 renderer and snapshot backlog status'
          git push
