name: R0 full render fallback safe gate 2

on:
  push:
    branches: [gpt/r0-full-render-fallback-282]
    paths:
      - .github/workflows/r0-full-render-fallback-safe2-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply guarded product patch
        run: python3 scripts/r0-full-render-fallback-once.py
      - name: Verify full render fallback
        shell: bash
        run: |
          set -euo pipefail
          node --check web/studio-runtime-render-policy.js
          node --check web/playground.js
          node --test tests/studio-runtime-render-policy.test.js tests/studio-runtime-full-render-integration.test.js tests/studio-runtime-keyed-renderer.test.js tests/studio-runtime-selection-state.test.js tests/studio-runtime-selection-integration.test.js
          node --test tests/workshop-desk-browser.test.js
          node scripts/build-site.js
          npm run check:site
      - name: Commit verified product patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r0-full-render-fallback-once.yml
          rm .github/workflows/r0-full-render-fallback-safe-once.yml
          rm .github/workflows/r0-full-render-fallback-safe2-once.yml
          rm scripts/r0-full-render-fallback-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add explicit full runtime render fallback'
          git push
