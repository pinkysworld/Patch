name: NumberEdit core wiring

on:
  push:
    branches: [numberedit-stage1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numberedit-stage1
          fetch-depth: 0
      - name: Wire NumberEdit contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          # Compiler manifest/AST wiring. NumberEdit attaches after password/mask metadata.
          patch('src/compiler.js',
              "} from './panel-split.js';\nimport {\n  attachWindowInputMasks,",
              "} from './panel-split.js';\nimport {\n  attachWindowInputNumbers,\n  buildWindowInputNumberManifest\n} from './input-number.js';\nimport {\n  attachWindowInputMasks,")
          patch('src/compiler.js',
              "  const windowInputMask = buildWindowInputMaskManifest(source, ast);\n  const windowListboxPresentation =",
              "  const windowInputMask = buildWindowInputMaskManifest(source, ast);\n  const windowInputNumber = buildWindowInputNumberManifest(source, ast);\n  const windowListboxPresentation =")
          patch('src/compiler.js',
              "  attachWindowInputMasks(ast, windowInputMask);\n  attachWindowListboxPresentations",
              "  attachWindowInputMasks(ast, windowInputMask);\n  attachWindowInputNumbers(ast, windowInputNumber);\n  attachWindowListboxPresentations")
          patch('src/compiler.js',
              "    windowInputPresentation, windowInputMask, windowListboxPresentation,",
              "    windowInputPresentation, windowInputMask, windowInputNumber, windowListboxPresentation,")

          # Interpreter UI model carries presentation only, not persistent state.
          patch('src/interpreter.js',
              "        if(node.control==='slider'){\n          item.min=node.min;",
              "        if(node.control==='input'&&node.inputNumber){\n          item.inputNumber={min:node.inputNumber.min,max:node.inputNumber.max,step:node.inputNumber.step};\n        }\n        if(node.control==='slider'){\n          item.min=node.min;")

          # Studio runtime renders a number input and dispatches a numeric transient value.
          patch('web/studio-window-renderer.js',
              "  } else if (control.type === 'input') {\n    el = document.createElement('input');\n    el.className = 'patch-input';\n    el.value = control.value ?? '';\n    el.placeholder = control.id ?? '';\n    if (context.interactive) el.addEventListener('input', () => context.dispatch(control.id, 'changed', { value: el.value }));\n    else el.readOnly = true;\n  } else if (control.type === 'memo') {",
              "  } else if (control.type === 'input') {\n    el = document.createElement('input');\n    el.className = control.inputNumber ? 'patch-input patch-numberedit' : 'patch-input';\n    el.value = control.value ?? '';\n    el.placeholder = control.id ?? '';\n    if (control.inputNumber) {\n      el.type = 'number';\n      el.min = String(control.inputNumber.min);\n      el.max = String(control.inputNumber.max);\n      el.step = String(control.inputNumber.step);\n      el.inputMode = 'decimal';\n      el.dataset.patchNumberEdit = 'true';\n    }\n    if (context.interactive) {\n      if (control.inputNumber) el.addEventListener('change', () => context.dispatch(control.id, 'changed', { value: el.value === '' ? Number.NaN : Number(el.value) }));\n      else el.addEventListener('input', () => context.dispatch(control.id, 'changed', { value: el.value }));\n    } else el.readOnly = true;\n  } else if (control.type === 'memo') {")

          # Window event adapter specializes NumberEdit input changed(value) to finite bounded numbers.
          patch('src/window-events.js',
              " * are Boolean. Slider `changed` values are finite numbers inside the declared\n * source-backed range. Input, ComboBox, Radio and text-bound ListBox `changed`",
              " * are Boolean. Slider and NumberEdit `changed` values are finite numbers inside\n * their declared source-backed ranges. Plain Input, ComboBox, Radio and text-bound ListBox `changed`")
          patch('src/window-events.js',
              "    if (['input', 'combo', 'radio'].includes(controlType) && typeof payload.value !== 'string') {\n      throw new PatchRuntimeError(`The 'changed' action for ${controlType} '${control}' needs a text event-local value.`);\n    }",
              "    if (controlType === 'input' && controlNode?.inputNumber) {\n      if (typeof payload.value !== 'number' || !Number.isFinite(payload.value)) {\n        throw new PatchRuntimeError(`The 'changed' action for NumberEdit '${control}' needs a finite number event-local value.`);\n      }\n      const min = Number(controlNode.inputNumber.min);\n      const max = Number(controlNode.inputNumber.max);\n      if (payload.value < min || payload.value > max) {\n        throw new PatchRuntimeError(`The 'changed' action for NumberEdit '${control}' needs a value from ${min} to ${max}.`);\n      }\n    } else if (['input', 'combo', 'radio'].includes(controlType) && typeof payload.value !== 'string') {\n      throw new PatchRuntimeError(`The 'changed' action for ${controlType} '${control}' needs a text event-local value.`);\n    }")
          patch('src/window-events.js',
              "      if (node.kind === 'tabs') {\n        for (const page of node.body ?? []) {",
              "      if (node.kind === 'uiControl' && node.control === 'panel') {\n        const nested = find(node.body);\n        if (nested) return nested;\n      }\n      if (node.kind === 'tabs') {\n        for (const page of node.body ?? []) {")

          # Native Current Ready fails closed.
          patch('src/native-current-contract.js',
              "      if (node.inputMask) {\n        throw new NativeGuiError(`MaskedEdit Stage 1 Input${name} is Studio/Web only. Current Ready native ${PATCH_CURRENT_NATIVE_RUNTIME_VERSION} has no input-mask contract; validation fails closed rather than dropping mask enforcement and lowering it as a plain Input.`);\n      }",
              "      if (node.inputMask) {\n        throw new NativeGuiError(`MaskedEdit Stage 1 Input${name} is Studio/Web only. Current Ready native ${PATCH_CURRENT_NATIVE_RUNTIME_VERSION} has no input-mask contract; validation fails closed rather than dropping mask enforcement and lowering it as a plain Input.`);\n      }\n      if (node.inputNumber) {\n        throw new NativeGuiError(`NumberEdit Stage 1 Input${name} is Studio/Web only. Current Ready native ${PATCH_CURRENT_NATIVE_RUNTIME_VERSION} has no numeric-input presentation contract; validation fails closed rather than lowering it as a text Input.`);\n      }")

          # Standalone Web enhancement runs after the existing Window enhancement stack.
          patch('src/webapp.js',
              "import { enhanceStandaloneWindowSplitContainers } from './window-web-splitcontainer.js';",
              "import { enhanceStandaloneWindowSplitContainers } from './window-web-splitcontainer.js';\nimport { enhanceStandaloneWindowNumberEdits } from './window-web-numberedit.js';")
          patch('src/webapp.js',
              "return enhanceStandaloneWindowSplitContainers(enhanceStandaloneWindowPaintBoxes(enhanceStandaloneWindowWebApp(addSourceBackedWindowLayout(addStandaloneWindowPictures(addWindowListboxMultiselect(addReadOnlyWindowTables(buildStandaloneWindowWebApp(compiled, name))), options.resources)))));",
              "return enhanceStandaloneWindowNumberEdits(enhanceStandaloneWindowSplitContainers(enhanceStandaloneWindowPaintBoxes(enhanceStandaloneWindowWebApp(addSourceBackedWindowLayout(addStandaloneWindowPictures(addWindowListboxMultiselect(addReadOnlyWindowTables(buildStandaloneWindowWebApp(compiled, name))), options.resources))))));")
          patch('src/webapp.js',
              "return enhanceStandaloneWindowSplitContainers(enhanceStandaloneWindowPaintBoxes(enhanceStandaloneWindowWebApp(addSourceBackedWindowLayout(addStandaloneWindowPictures(addWindowListboxMultiselect(addReadOnlyWindowTables(buildStandaloneWindowWebApp(inferred, name))), options.resources)))));",
              "return enhanceStandaloneWindowNumberEdits(enhanceStandaloneWindowSplitContainers(enhanceStandaloneWindowPaintBoxes(enhanceStandaloneWindowWebApp(addSourceBackedWindowLayout(addStandaloneWindowPictures(addWindowListboxMultiselect(addReadOnlyWindowTables(buildStandaloneWindowWebApp(inferred, name))), options.resources))))));")

          # All pre-control metadata scanners must treat @input-number as part of the same source-backed control unit.
          for path in ['src/designer.js','src/window-layout-policy.js','web/designer-control-duplicate-model.js','web/designer-control-clipboard-model.js']:
              p=Path(path); s=p.read_text(); old='input-mode|input-mask|listbox-mode';
              if s.count(old) != 1: raise SystemExit(f'{path}: metadata anchor count {s.count(old)}')
              p.write_text(s.replace(old,'input-mode|input-mask|input-number|listbox-mode'))
          patch('src/window-input-presentation.js',
              "const DESIGNER_METADATA_RE = /^\\s*#\\s*@(layout|taborder|locked|input-mode|input-mask)\\b/i;",
              "const DESIGNER_METADATA_RE = /^\\s*#\\s*@(layout|taborder|locked|input-mode|input-mask|input-number)\\b/i;")
          p=Path('src/input-presentation.js'); s=p.read_text();
          old='input-mode|input-mask|listbox-mode';
          if s.count(old) < 1: raise SystemExit('src/input-presentation.js: metadata anchor missing')
          p.write_text(s.replace(old,'input-mode|input-mask|input-number|listbox-mode'))

          # Studio module graph.
          patch('web/designer-workspace.js',
              "import './designer-splitcontainer.js';\nimport './designer-ui-namespace.js';",
              "import './designer-splitcontainer.js';\nimport './designer-numberedit.js';\nimport './designer-ui-namespace.js';")

          # Hosted/offline deterministic package lists and service-worker cache closure.
          patch('scripts/build-site.js',
              "'window-web-paintbox.js','window-web-splitcontainer.js','window-build.js'",
              "'window-web-paintbox.js','window-web-splitcontainer.js','window-web-numberedit.js','window-build.js'")
          patch('scripts/build-site.js',
              "'panel-scroll.js','panel-split.js','input-presentation.js'",
              "'panel-scroll.js','panel-split.js','input-number.js','input-presentation.js'")
          patch('scripts/build-site.js',
              "'designer-panel.js','designer-splitcontainer.js','designer-ui-namespace.js'",
              "'designer-panel.js','designer-splitcontainer.js','designer-numberedit.js','designer-ui-namespace.js'")

          patch('web/sw.js',
              "'./designer-panel.js', './designer-splitcontainer.js', './designer-layout-actions.js'",
              "'./designer-panel.js', './designer-splitcontainer.js', './designer-numberedit.js', './designer-layout-actions.js'")
          patch('web/sw.js',
              "'../src/window-web-paintbox.js', '../src/window-web-splitcontainer.js', '../src/window-build.js'",
              "'../src/window-web-paintbox.js', '../src/window-web-splitcontainer.js', '../src/window-web-numberedit.js', '../src/window-build.js'")
          patch('web/sw.js',
              "'../src/window-layout-policy.js', '../src/panel-scroll.js', '../src/panel-split.js', '../src/studio-project.js'",
              "'../src/window-layout-policy.js', '../src/panel-scroll.js', '../src/panel-split.js', '../src/input-number.js', '../src/studio-project.js'")

          Path('.github/workflows/numberedit-core-wiring.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: wire NumberEdit Stage 1 through Studio and Web"
          git push origin HEAD:numberedit-stage1
