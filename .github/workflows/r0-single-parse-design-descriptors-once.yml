name: R0 single-parse Designer descriptors

on:
  push:
    branches:
      - gpt/r0-single-parse-design-descriptors-282
    paths:
      - .github/workflows/r0-single-parse-design-descriptors-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt/r0-single-parse-design-descriptors-282
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply guarded single-parse integration
        run: python3 .github/scripts/r0_single_parse_design_descriptors_once.py
      - name: Verify descriptor parity and shared revision path
        run: |
          node --check src/designer.js
          node --check web/studio-design-snapshots.js
          node --test tests/studio-designer-ast-descriptors.test.js tests/studio-design-snapshot-service.test.js tests/designer.test.js tests/studio-design-model.test.js tests/studio-design-cache.test.js
          node scripts/build-site.js
          npm run check:site
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r0-single-parse-design-descriptors-once.yml .github/scripts/r0_single_parse_design_descriptors_once.py
          git add src/designer.js web/studio-design-snapshots.js tests/studio-designer-ast-descriptors.test.js
          git commit -m "Reuse the parsed Designer AST for descriptors"
          git push origin HEAD:gpt/r0-single-parse-design-descriptors-282
