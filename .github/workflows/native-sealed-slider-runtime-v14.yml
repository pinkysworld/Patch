name: Patch Native Sealed Slider Runtime v1.4

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/sealed-native-gui-v13.js'
      - 'src/native-gui-ir-v13.js'
      - 'src/native-slider-backend-adapter.js'
      - 'native-runtime/sealed-slider-v14.hpp'
      - 'native-runtime/sealed-tree-v13.hpp'
      - 'native-runtime/win32-sealed-gui-v14.cpp'
      - 'native-runtime/appkit-sealed-gui-v14.mm'
      - 'native-runtime/gtk-sealed-gui-v14.cpp'
      - 'examples/slider-window.patch'
      - 'tests/sealed-slider-payload-v13.test.js'
      - 'tests/native-slider.test.js'
      - '.github/workflows/native-sealed-slider-runtime-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test sealed Slider payload v13 contract
        run: node --test tests/sealed-slider-payload-v13.test.js tests/native-slider.test.js

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build Win32 sealed Slider runtime v1.4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-runtime-v14 | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v14.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-runtime-v14\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content dist-runtime-v14\build-slider-runtime.cmd -Encoding ascii
          & cmd.exe /d /c dist-runtime-v14\build-slider-runtime.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal payload v13 and smoke Win32 runtime
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV13 } from './src/native-gui-ir-v13.js';
          import { sealNativeGuiRuntimeV13 } from './src/sealed-native-gui-v13.js';
          const source = fs.readFileSync('examples/slider-window.patch', 'utf8');
          const ir = buildNativeGuiIRV13(compile(source, { name: 'SealedSlider', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v14/patch-windows-native-gui-runtime.exe');
          const sealed = sealNativeGuiRuntimeV13(runtime, ir, { platform: 'windows' });
          fs.writeFileSync('SealedSlider.exe', sealed);
          '@ | Set-Content seal-slider.mjs -Encoding utf8
          node seal-slider.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload v13 sealing failed.' }
          $process = Start-Process -FilePath (Resolve-Path './SealedSlider.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed Slider runtime smoke failed with exit code $($process.ExitCode)." }

  macos:
    needs: contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build universal AppKit sealed Slider runtime v1.4
        run: |
          mkdir -p dist-runtime-v14
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 -arch arm64 -arch x86_64 -framework Cocoa native-runtime/appkit-sealed-gui-v14.mm -o dist-runtime-v14/patch-macos-native-gui-runtime.bin
          chmod +x dist-runtime-v14/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime-v14/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal payload v13 and smoke AppKit runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV13 } from './src/native-gui-ir-v13.js';
          import { sealNativeGuiRuntimeV13 } from './src/sealed-native-gui-v13.js';
          const source = fs.readFileSync('examples/slider-window.patch', 'utf8');
          const ir = buildNativeGuiIRV13(compile(source, { name: 'SealedSlider', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v14/patch-macos-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV13(runtime, ir, { platform: 'macos' });
          fs.writeFileSync('SealedSlider', sealed); fs.chmodSync('SealedSlider', 0o755);
          NODE
          ./SealedSlider --patch-smoke

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build GTK3 sealed Slider runtime v1.4
        run: |
          mkdir -p dist-runtime-v14
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v14.cpp -o dist-runtime-v14/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-runtime-v14/patch-linux-native-gui-runtime.bin
      - name: Seal payload v13 and smoke GTK runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV13 } from './src/native-gui-ir-v13.js';
          import { sealNativeGuiRuntimeV13 } from './src/sealed-native-gui-v13.js';
          const source = fs.readFileSync('examples/slider-window.patch', 'utf8');
          const ir = buildNativeGuiIRV13(compile(source, { name: 'SealedSlider', kind: 'window' }));
          const runtime = fs.readFileSync('dist-runtime-v14/patch-linux-native-gui-runtime.bin');
          const sealed = sealNativeGuiRuntimeV13(runtime, ir, { platform: 'linux' });
          fs.writeFileSync('SealedSlider', sealed); fs.chmodSync('SealedSlider', 0o755);
          NODE
          xvfb-run -a ./SealedSlider --patch-smoke
