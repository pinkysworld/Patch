name: Patch Native Sealed Table Runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/native-sealed-table-runtime.yml
      - native-runtime/sealed-table-v10.hpp
      - native-runtime/win32-sealed-gui-v10.cpp
      - native-runtime/appkit-sealed-gui-v10.mm
      - native-runtime/gtk-sealed-gui-v10.cpp
      - native-runtime/sealed-responsive-v09.hpp
      - native-runtime/win32-sealed-gui-v09.cpp
      - native-runtime/appkit-sealed-gui-v09.mm
      - native-runtime/gtk-sealed-gui-v09.cpp
      - src/sealed-native-gui.js
      - src/native-gui-ir-v08.js
      - src/native-gui-ir.js
      - src/compiler.js
      - src/parser.js
      - scripts/seal-native-win32.js
      - scripts/seal-native-macos.js
      - scripts/seal-native-linux.js
      - examples/table-native-v09.patch
      - tests/sealed-native-table-v09.test.js
      - tests/sealed-native-gui.test.js
      - tests/sealed-native-responsive.test.js
  push:
    branches: [main]
    paths:
      - .github/workflows/native-sealed-table-runtime.yml
      - native-runtime/sealed-table-v10.hpp
      - native-runtime/win32-sealed-gui-v10.cpp
      - native-runtime/appkit-sealed-gui-v10.mm
      - native-runtime/gtk-sealed-gui-v10.cpp
      - src/sealed-native-gui.js
      - src/native-gui-ir-v08.js
      - scripts/seal-native-win32.js
      - scripts/seal-native-macos.js
      - scripts/seal-native-linux.js
      - examples/table-native-v09.patch
      - tests/sealed-native-table-v09.test.js
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PATCH_SEALED_GUI_VERSION: 9

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test sealed payload contracts
        shell: pwsh
        run: node --test tests/sealed-native-gui.test.js tests/sealed-native-responsive.test.js tests/sealed-native-table-v09.test.js
      - name: Build Win32 sealed Table runtime v1.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-table-runtime | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          $script = Join-Path $PWD 'dist-table-runtime\build-runtime.cmd'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 native-runtime\win32-sealed-gui-v10.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-table-runtime\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content -Path $script -Encoding ascii
          & cmd.exe /d /c $script
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal and smoke Table Win32 app
        shell: pwsh
        run: |
          node scripts/seal-native-win32.js examples/table-native-v09.patch dist-table-runtime/patch-windows-native-gui-runtime.exe dist-table-runtime/PatchTable.exe PatchTable
          $sealed = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist-table-runtime/PatchTable.exe'))
          $version = [BitConverter]::ToUInt32($sealed, $sealed.Length - 12)
          if ($version -ne 9) { throw "Expected sealed GUI payload v9, got v$version." }
          $process = Start-Process -FilePath (Resolve-Path 'dist-table-runtime/PatchTable.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sealed Table Win32 smoke failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v7
        with:
          name: patch-windows-native-gui-runtime-v10
          path: dist-table-runtime/patch-windows-native-gui-runtime.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test sealed payload contracts
        run: node --test tests/sealed-native-gui.test.js tests/sealed-native-responsive.test.js tests/sealed-native-table-v09.test.js
      - name: Build universal AppKit sealed Table runtime v1.0
        shell: bash
        run: |
          mkdir -p dist-table-runtime
          clang++ -std=c++17 -O2 -mmacosx-version-min=11.0 \
            -arch arm64 -arch x86_64 -framework Cocoa \
            native-runtime/appkit-sealed-gui-v10.mm \
            -o dist-table-runtime/patch-macos-native-gui-runtime.bin
          chmod +x dist-table-runtime/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-table-runtime/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal and smoke Table AppKit app
        shell: bash
        run: |
          node scripts/seal-native-macos.js examples/table-native-v09.patch dist-table-runtime/patch-macos-native-gui-runtime.bin dist-table-runtime/PatchTable PatchTable
          node - <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync('dist-table-runtime/PatchTable');
          if(sealed.readUInt32LE(sealed.length-12)!==9) throw new Error('Expected sealed GUI payload v9.');
          NODE
          dist-table-runtime/PatchTable --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-macos-native-gui-runtime-v10
          path: dist-table-runtime/patch-macos-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Test sealed payload contracts
        run: node --test tests/sealed-native-gui.test.js tests/sealed-native-responsive.test.js tests/sealed-native-table-v09.test.js
      - name: Build GTK3 sealed Table runtime v1.0
        shell: bash
        run: |
          mkdir -p dist-table-runtime
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v10.cpp -o dist-table-runtime/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-table-runtime/patch-linux-native-gui-runtime.bin
      - name: Seal and smoke Table GTK app
        shell: bash
        run: |
          node scripts/seal-native-linux.js examples/table-native-v09.patch dist-table-runtime/patch-linux-native-gui-runtime.bin dist-table-runtime/PatchTable PatchTable
          node - <<'NODE'
          const fs=require('fs');
          const sealed=fs.readFileSync('dist-table-runtime/PatchTable');
          if(sealed.readUInt32LE(sealed.length-12)!==9) throw new Error('Expected sealed GUI payload v9.');
          NODE
          chmod +x dist-table-runtime/PatchTable
          xvfb-run -a dist-table-runtime/PatchTable --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-linux-native-gui-runtime-v10
          path: dist-table-runtime/patch-linux-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patch-windows-native-gui-runtime-v10
          path: runtime/windows
      - uses: actions/download-artifact@v8
        with:
          name: patch-macos-native-gui-runtime-v10
          path: runtime/macos
      - uses: actions/download-artifact@v8
        with:
          name: patch-linux-native-gui-runtime-v10
          path: runtime/linux
      - name: Publish Table-capable native runtime templates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          publish_runtime() {
            local tag="$1" title="$2" asset="$3" notes="$4"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          }
          publish_runtime native-win32-runtime-v1.0 'Patch Native Win32 Runtime v1.0' runtime/windows/patch-windows-native-gui-runtime.exe 'Token-free Win32 sealed-GUI runtime. Runtime v1.0 consumes sealed payload v9 / Native GUI IR 0.8 Table metadata, uses report-mode WC_LISTVIEWW, and preserves runtime-v0.9 accessibility plus responsive Anchor/Dock behavior.'
          publish_runtime native-macos-runtime-v1.0 'Patch Native macOS Runtime v1.0' runtime/macos/patch-macos-native-gui-runtime.bin 'Unsigned universal AppKit sealed-GUI runtime. Runtime v1.0 consumes sealed payload v9 / Native GUI IR 0.8 Table metadata, uses multi-column NSTableView, and preserves runtime-v0.9 accessibility plus responsive Anchor/Dock behavior.'
          publish_runtime native-linux-runtime-v1.0 'Patch Native Linux Runtime v1.0' runtime/linux/patch-linux-native-gui-runtime.bin 'GTK3 sealed-GUI runtime. Runtime v1.0 consumes sealed payload v9 / Native GUI IR 0.8 Table metadata, uses GtkTreeView/GtkListStore, and preserves runtime-v0.9 ATK accessibility plus responsive Anchor/Dock behavior.'
