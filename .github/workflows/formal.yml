name: Patch Formal Verification

on:
  push:
    branches: [main]
    paths:
      - formal/**
      - src/compiler.js
      - src/parser.js
      - src/change-analysis.js
      - src/range-analysis.js
      - src/formal-*.js
      - src/source-validation.js
      - src/guard-validation.js
      - src/certificate.js
      - src/runtime-certificate.js
      - src/runtime-path-witness.js
      - src/call-certificate.js
      - src/concrete-call-witness.js
      - src/concrete-call-certificate.js
      - src/concrete-call-body.js
      - src/concrete-call-body-certificate.js
      - src/transitive-call-body.js
      - src/transitive-call-body-certificate.js
      - src/direct-trace-validator.js
      - src/direct-effect-validator.js
      - src/transitive-runtime-correspondence.js
      - src/transitive-runtime-certificate.js
      - src/wasm-direct.js
      - scripts/generate-*-certificate.js
      - examples/range-soundness.patch
      - examples/runtime-correspondence.patch
      - examples/formal-*.patch
      - package.json
      - .github/workflows/formal.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - formal/**
      - src/compiler.js
      - src/parser.js
      - src/change-analysis.js
      - src/range-analysis.js
      - src/formal-*.js
      - src/source-validation.js
      - src/guard-validation.js
      - src/certificate.js
      - src/runtime-certificate.js
      - src/runtime-path-witness.js
      - src/call-certificate.js
      - src/concrete-call-witness.js
      - src/concrete-call-certificate.js
      - src/concrete-call-body.js
      - src/concrete-call-body-certificate.js
      - src/transitive-call-body.js
      - src/transitive-call-body-certificate.js
      - src/direct-trace-validator.js
      - src/direct-effect-validator.js
      - src/transitive-runtime-correspondence.js
      - src/transitive-runtime-certificate.js
      - src/wasm-direct.js
      - scripts/generate-*-certificate.js
      - examples/range-soundness.patch
      - examples/runtime-correspondence.patch
      - examples/formal-*.patch
      - package.json
      - .github/workflows/formal.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Lean 4 proofs + generated certificates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate static certificate from production compiler
        run: npm run certify:example
      - name: Execute direct Wasm and generate runtime correspondence certificate
        run: npm run runtime-certify:example
      - name: Generate recipe-call composition certificate from production compiler
        run: npm run call-certify:example
      - name: Generate concrete recipe-call binding/effect certificate
        run: npm run concrete-call-certify:example
      - name: Generate arithmetic concrete-call certificate
        run: npm run arithmetic-call-certify:example
      - name: Generate structured callee trace certificate
        run: npm run callee-trace-certify:example
      - name: Generate guard-aware structured callee trace certificate
        run: npm run guarded-callee-trace-certify:example
      - name: Generate finite transitive exact call-tree certificate
        run: npm run transitive-callee-trace-certify:example
      - name: Execute direct Wasm and generate invocation-frame runtime certificate
        run: npm run transitive-runtime-certify:example
      - name: Execute repeated direct Wasm calls and generate invocation-frame certificate
        run: npm run transitive-runtime-certify:repeated
      - name: Install Elan and pinned Lean
        run: bash scripts/install-pinned-lean.sh
      - name: Build Lean formalization and invocation-frame runtime assurance boundaries
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls PatchCallSubstitution PatchCallRefinement PatchCallEffect PatchCallBody PatchCallBodyImport PatchCallTree PatchCallRuntime
      - name: Verify generated production certificate
        working-directory: formal
        run: lake env lean GeneratedCertificate.lean
      - name: Verify generated direct-runtime correspondence certificate
        working-directory: formal
        run: lake env lean GeneratedRuntimeCertificate.lean
      - name: Verify generated recipe-call composition certificate
        working-directory: formal
        run: lake env lean GeneratedCallCertificate.lean
      - name: Verify generated concrete recipe-call certificate
        working-directory: formal
        run: lake env lean GeneratedConcreteCallCertificate.lean
      - name: Verify generated arithmetic concrete-call certificate
        working-directory: formal
        run: lake env lean GeneratedArithmeticCallCertificate.lean
      - name: Verify generated structured callee trace certificate
        working-directory: formal
        run: lake env lean GeneratedConcreteCallBodyCertificate.lean
      - name: Verify generated guard-aware callee trace certificate
        working-directory: formal
        run: lake env lean GeneratedGuardedCallBodyCertificate.lean
      - name: Verify generated finite transitive exact call-tree certificate
        working-directory: formal
        run: lake env lean GeneratedTransitiveCallBodyCertificate.lean
      - name: Verify generated invocation-frame direct-Wasm certificate
        working-directory: formal
        run: lake env lean GeneratedTransitiveRuntimeCertificate.lean
      - name: Verify repeated-call invocation-frame direct-Wasm certificate
        working-directory: formal
        run: lake env lean GeneratedRepeatedTransitiveRuntimeCertificate.lean
      - name: Reject unfinished proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -R -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/*.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Unfinished Lean proof found.'
            exit 1
          fi
