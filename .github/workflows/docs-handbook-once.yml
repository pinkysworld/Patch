name: Patch handbook integration

on:
  push:
    branches:
      - gpt/docs-handbook-license
    paths:
      - .github/workflows/docs-handbook-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gpt/docs-handbook-license
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply guarded handbook integration
        run: python3 .github/scripts/docs_handbook_once.py
      - name: Verify handbook and site closure
        run: |
          node --check scripts/build-site.js
          node --test tests/handbook-site.test.js tests/site-navigation.test.js tests/user-documentation-site.test.js
          node scripts/build-site.js
          npm run check:site
      - name: Commit verified handbook integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/docs-handbook-once.yml .github/scripts/docs_handbook_once.py
          git add LICENSE web/docs.html web/tutorials.html web/examples.html web/docs-handbook.css web/sw.js scripts/build-site.js tests/handbook-site.test.js tests/site-navigation.test.js
          git commit -m "Publish multi-page Patch handbook"
          git push origin HEAD:gpt/docs-handbook-license
