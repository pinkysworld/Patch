name: Patch Native Window Icon Packaging v1.10

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/native-window-icon-packaging.js'
      - 'src/native-window-icon-package-v110.js'
      - 'src/native-window-icon-backend-adapter.js'
      - 'src/native-gui-ir-v19.js'
      - 'src/sealed-native-gui-v19.js'
      - 'tests/native-window-icon-packaging.test.js'
      - 'tests/native-window-icon-package-v110.test.js'
      - '.github/workflows/native-window-icon-packaging-v110.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Validate deterministic icon formats and runtime-v1.10 package plans
        run: node --test tests/native-window-icon-packaging.test.js tests/native-window-icon-package-v110.test.js
