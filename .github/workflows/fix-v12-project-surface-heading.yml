name: Patch v1.2 Project Surface Heading Fix

on:
  push:
    branches: [agent/current-runtime-v12-switch]
    paths:
      - v12-project-surface-heading.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/current-runtime-v12-switch
      - name: Update exact beta.35 roadmap heading marker
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/check-project-surface.js')
          text = p.read_text()
          old = "'### beta.35: browser ListBox multi-selection'"
          new = "'### beta.35: browser and native ListBox multi-selection'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale heading marker, found {text.count(old)}')
          p.write_text(text.replace(old, new))
      - name: Verify project surface checker
        run: node scripts/check-project-surface.js
      - name: Commit exact marker fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-project-surface.js
          git commit -m 'Align project surface check with beta.35 native list milestone'
          git push origin HEAD:agent/current-runtime-v12-switch
