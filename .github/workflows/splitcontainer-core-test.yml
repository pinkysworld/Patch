name: SplitContainer core regression

on:
  push:
    branches: [splitcontainer-stage1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run SplitContainer core tests
        id: split_tests
        continue-on-error: true
        run: node --test --test-reporter=tap tests/splitcontainer-stage1.test.js > splitcontainer-test.tap 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: splitcontainer-core-tap
          path: splitcontainer-test.tap
      - name: Fail when regression suite failed
        if: steps.split_tests.outcome != 'success'
        run: exit 1
