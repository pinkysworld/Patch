name: Patch Offline Compiler Native v1.10 Contract

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Verify Current Ready v1.10 and v1.8 compatibility contract
        run: node --test tests/offline-linker-v19.test.js tests/offline-compiler-v110-promotion-workflow.test.js
