name: Patch Beta28 Callee Traces

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  callee-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run structured callee trace regression tests
        run: node --test tests/concrete-call-body.test.js tests/concrete-call-body-certificate.test.js
      - name: Generate proof-free structured callee trace certificate
        run: node scripts/generate-concrete-call-body-certificate.js examples/formal-callee-trace.patch --out formal/GeneratedConcreteCallBodyCertificate.lean
      - name: Install pinned Lean
        run: bash scripts/install-pinned-lean.sh
      - name: Check structured exact callee-body and caller-import theorems
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          elan override set leanprover/lean4:v4.30.0
          lake update
          lake build PatchFormal PatchSignature PatchChecker PatchEvidence PatchSource PatchRange PatchRuntime PatchRuntimeCapability PatchGuarded PatchCalls PatchCallSubstitution PatchCallRefinement PatchCallEffect PatchCallBody PatchCallBodyImport
      - name: Verify generated structured callee trace certificate
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake env lean GeneratedConcreteCallBodyCertificate.lean
      - name: Reject unfinished beta.28 proofs
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -n -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)|(:=|=>|by|exact)[[:space:]]+(sorry|admit)([[:space:]]|$)' formal/PatchCallBody.lean formal/PatchCallBodyImport.lean formal/GeneratedConcreteCallBodyCertificate.lean || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Unfinished beta.28 proof found.'
            exit 1
          fi
