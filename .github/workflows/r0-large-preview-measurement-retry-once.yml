name: R0 large Designer preview measurement retry

on:
  push:
    branches: [gpt/r0-large-preview-measurement-282]
    paths:
      - .github/workflows/r0-large-preview-measurement-retry-once.yml

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Correct Node-side measurement predicates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/measure-studio-large-previews.js')
          text = path.read_text()
          replacements = {
              "state => state?.active === '0' && state.rows === ${TABLE_ROWS}": "state => state?.active === '0' && state.rows === TABLE_ROWS",
              "state => state?.active === '1' && state.treeNodes === ${TREE_NODES}": "state => state?.active === '1' && state.treeNodes === TREE_NODES",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Syntax check measurement harness
        run: node --check scripts/measure-studio-large-previews.js
      - name: Measure large Table and Tree Designer previews
        run: node scripts/measure-studio-large-previews.js
      - name: Commit corrected harness and remove temporary workflows
        run: |
          set -euo pipefail
          git rm .github/workflows/r0-large-preview-measurement-once.yml
          git rm .github/workflows/r0-large-preview-measurement-retry-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/measure-studio-large-previews.js
          git commit -m 'Measure large Designer preview scaling'
          git push
