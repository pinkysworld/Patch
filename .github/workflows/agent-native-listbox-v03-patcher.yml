name: Agent Win32 ListBox Patcher

on:
  push:
    branches:
      - agent/native-listbox-v03

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/native-listbox-v03
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Patch Win32 AOT emitter
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/win32-gui.js')
          s=p.read_text()
          def rep(old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, got {n}')
              return s.replace(old,new,1)
          s=rep("PATCH_WIN32_GUI_BACKEND_VERSION = '0.2'","PATCH_WIN32_GUI_BACKEND_VERSION = '0.3'",'version')
          s=rep('CK_CHECKBOX=4, CK_COMBO=5 };','CK_CHECKBOX=4, CK_COMBO=5, CK_LISTBOX=6 };','enum')
          marker='static void SetWindowTextIfDifferent(HWND hwnd'
          helper=r'''static std::wstring ListBoxText(HWND hwnd) {\n  const LRESULT selected = SendMessageW(hwnd, LB_GETCURSEL, 0, 0);\n  if (selected == LB_ERR) return L"";\n  const LRESULT len = SendMessageW(hwnd, LB_GETTEXTLEN, (WPARAM)selected, 0);\n  if (len == LB_ERR || len < 0) return L"";\n  std::wstring value((size_t)len + 1, L'\\0');\n  const LRESULT copied = SendMessageW(hwnd, LB_GETTEXT, (WPARAM)selected, (LPARAM)value.data());\n  value.resize(copied > 0 ? (size_t)copied : 0);\n  return value;\n}\nstatic void SetListBoxSelection(HWND hwnd, const std::wstring& value) {\n  if (ListBoxText(hwnd) == value) return;\n  const LRESULT found = SendMessageW(hwnd, LB_FINDSTRINGEXACT, (WPARAM)-1, (LPARAM)value.c_str());\n  SendMessageW(hwnd, LB_SETCURSEL, found == LB_ERR ? (WPARAM)-1 : (WPARAM)found, 0);\n}\n'''
          s=rep(marker,helper+marker,'helpers')
          s=rep("control.type === 'combo' ? 'CBN_SELCHANGE' : 'EN_CHANGE'","control.type === 'combo' ? 'CBN_SELCHANGE' : control.type === 'listbox' ? 'LBN_SELCHANGE' : 'EN_CHANGE'",'notify')
          s=rep("control.type === 'combo' ? `Event_${index}(ComboText(controlHwnd));` : `Event_${index}(WindowText(controlHwnd));`","control.type === 'combo' ? `Event_${index}(ComboText(controlHwnd));` : control.type === 'listbox' ? `Event_${index}(ListBoxText(controlHwnd));` : `Event_${index}(WindowText(controlHwnd));`",'dispatch')
          old="""  if (control.type === 'combo') {
    const state = states.get(control.binding);
    return `  if (gControls[${index}]) SetComboSelection(gControls[${index}], ${stateName(state.name)});`;
  }
  return '';"""
          new="""  if (control.type === 'combo') {
    const state = states.get(control.binding);
    return `  if (gControls[${index}]) SetComboSelection(gControls[${index}], ${stateName(state.name)});`;
  }
  if (control.type === 'listbox') {
    const state = states.get(control.binding);
    return `  if (gControls[${index}]) SetListBoxSelection(gControls[${index}], ${stateName(state.name)});`;
  }
  return '';"""
          s=rep(old,new,'refresh')
          s=rep(""": control.type === 'combo'
          ? 'WS_CHILD | WS_VISIBLE | WS_TABSTOP | WS_VSCROLL | CBS_DROPDOWNLIST'
          : 'WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_AUTOCHECKBOX';""",""": control.type === 'combo'
          ? 'WS_CHILD | WS_VISIBLE | WS_TABSTOP | WS_VSCROLL | CBS_DROPDOWNLIST'
          : control.type === 'listbox'
            ? 'WS_CHILD | WS_VISIBLE | WS_TABSTOP | WS_VSCROLL | WS_BORDER | LBS_NOTIFY'
            : 'WS_CHILD | WS_VISIBLE | WS_TABSTOP | BS_AUTOCHECKBOX';""",'style')
          s=rep("const klass = control.type === 'text' ? 'L\"STATIC\"' : control.type === 'input' ? 'L\"EDIT\"' : control.type === 'combo' ? 'L\"COMBOBOX\"' : 'L\"BUTTON\"';","const klass = control.type === 'text' ? 'L\"STATIC\"' : control.type === 'input' ? 'L\"EDIT\"' : control.type === 'combo' ? 'L\"COMBOBOX\"' : control.type === 'listbox' ? 'L\"LISTBOX\"' : 'L\"BUTTON\"';",'class')
          old="""  const options = control.type === 'combo'
    ? control.options.map(option => `    SendMessageW(gControls[${index}], CB_ADDSTRING, 0, (LPARAM)L${cppString(option)});`).join('\\n')
    : '';"""
          new="""  const options = control.type === 'combo'
    ? control.options.map(option => `    SendMessageW(gControls[${index}], CB_ADDSTRING, 0, (LPARAM)L${cppString(option)});`).join('\\n')
    : control.type === 'listbox'
      ? control.options.map(option => `    SendMessageW(gControls[${index}], LB_ADDSTRING, 0, (LPARAM)L${cppString(option)});`).join('\\n')
      : '';"""
          s=rep(old,new,'options')
          s=rep("combo: 'CK_COMBO' })[type]","combo: 'CK_COMBO', listbox: 'CK_LISTBOX' })[type]",'kind')
          p.write_text(s)
          PY
          node --check src/win32-gui.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIR } from './src/native-gui-ir.js';
          import { emitWin32GuiCpp } from './src/win32-gui.js';
          const source=fs.readFileSync('examples/listbox-window.patch','utf8');
          const cpp=emitWin32GuiCpp(buildNativeGuiIR(compile(source,{name:'NativeListBox',kind:'window'})));
          for(const token of ['LISTBOX','LBS_NOTIFY','LBN_SELCHANGE','LB_ADDSTRING','LB_GETCURSEL']) if(!cpp.includes(token)) throw new Error('missing '+token);
          NODE
      - name: Commit and remove temporary patcher
        shell: bash
        run: |
          rm .github/workflows/agent-native-listbox-v03-patcher.yml
          git config user.name 'patch-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/win32-gui.js .github/workflows/agent-native-listbox-v03-patcher.yml
          git commit -m 'feat: add Win32 ListBox AOT backend'
          git push origin HEAD:agent/native-listbox-v03
