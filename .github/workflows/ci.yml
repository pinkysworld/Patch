name: Patch CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Syntax check
        run: node --check src/parser.js && node --check src/interpreter.js && node --check src/cli.js && node --check src/cli-entry.js && node --check src/compiler.js && node --check src/change-analysis.js && node --check src/range-analysis.js && node --check src/formal-range.js && node --check src/formal-guard.js && node --check src/formal-calls.js && node --check src/formal-bridge.js && node --check src/formal-source.js && node --check src/source-validation.js && node --check src/guard-validation.js && node --check src/certificate.js && node --check src/runtime-certificate.js && node --check src/call-certificate.js && node --check src/concrete-call-witness.js && node --check src/concrete-call-certificate.js && node --check src/concrete-call-body.js && node --check src/concrete-call-body-certificate.js && node --check src/runtime-path-witness.js && node --check src/wasm.js && node --check src/wasm-direct.js && node --check src/c99.js && node --check src/webapp.js && node --check src/window-webapp.js && node --check src/window-build.js && node --check src/window-events.js && node --check src/native-app.js && node --check src/direct-trace-validator.js && node --check src/direct-effect-validator.js && node --check src/designer.js && node --check scripts/generate-call-certificate.js && node --check scripts/generate-concrete-call-certificate.js && node --check scripts/generate-concrete-call-body-certificate.js && node --check scripts/build-native-sea.js && node --check scripts/build-native-window.js && node --check scripts/validate-direct-trace.js && node --check scripts/check-project-surface.js && node --check scripts/check-site.js && node --check web/native-build.js && node --check web/playground.js && node --check web/sw.js
      - name: Language, compiler, formal, source/runtime/call/concrete-call certificate, direct-Wasm, C99, app-build, validator, designer and bootstrap-Wasm tests
        run: npm test
      - name: Example smoke tests
        run: npm run check
      - name: Formal correspondence, source-validation and range-coverage smoke test
        run: npm run formal:example
      - name: Generate Lean-checkable range/source/evidence certificate
        run: npm run certify:example
      - name: Execute direct Wasm and generate Lean runtime correspondence certificate
        run: npm run runtime-certify:example
      - name: Generate Lean recipe-call composition certificate
        run: npm run call-certify:example
      - name: Generate Lean concrete recipe-call binding/effect certificate
        run: npm run concrete-call-certify:example
      - name: Generate Lean arithmetic concrete-call certificate
        run: npm run arithmetic-call-certify:example
      - name: Generate Lean structured callee trace certificate
        run: npm run callee-trace-certify:example
      - name: Portable application build
        run: npm run build:example
      - name: Bootstrap WebAssembly application build
        run: npm run build:wasm
      - name: Direct WebAssembly application build
        run: npm run build:wasm-direct
      - name: Portable C99 source build
        run: npm run build:c99
      - name: Standalone single-file Console Web App build
        run: npm run build:web
      - name: Standalone single-file Window Web App build
        run: node src/cli.js build examples/counter-window.patch --target web --out CounterWindow.html
      - name: Execute direct WebAssembly application
        run: npm run run:wasm-direct
      - name: Independently validate direct WebAssembly transition trace
        run: npm run validate:wasm-direct
      - name: Check README website docs and version consistency
        run: npm run check:project
      - name: Build public Patch Studio site
        run: npm run build:site
      - name: Validate public Patch Studio site
        run: npm run check:site
