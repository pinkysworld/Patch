name: Paper CI

on:
  push:
    branches:
      - 'paper/**'
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: patch-scp-manuscript
          path: paper/main.pdf
          if-no-files-found: error
