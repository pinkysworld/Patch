name: Deploy Patch Studio

on:
  push:
    branches: [main]
    paths:
      - web/**
      - tests/studio-browser-startup.test.js
      - tests/studio-startup-diagnostics.test.js
      - scripts/build-site.js
      - scripts/check-site.js
      - scripts/check-site-v10.js
      - scripts/check-site-v12.js
      - scripts/check-site-beta36.js
      - scripts/runtime-integrity-manifest.js
      - package.json
      - src/interpreter.js
      - src/parser.js
      - src/expression.js
      - src/change.js
      - src/change-analysis.js
      - src/range-analysis.js
      - src/formal-range.js
      - src/formal-guard.js
      - src/formal-calls.js
      - src/formal-bridge.js
      - src/formal-source.js
      - src/source-validation.js
      - src/guard-validation.js
      - src/call-site-validation.js
      - src/independent-range-expression.js
      - src/independent-guard-expression.js
      - src/compiler.js
      - src/bundle.js
      - src/wasm.js
      - src/wasm-direct.js
      - src/c99.js
      - src/webapp.js
      - src/window-webapp.js
      - src/window-build.js
      - src/window-events.js
      - src/window-layout-policy.js
      - src/designer.js
      - src/form-layout.js
      - src/window-compiled.js
      - src/native-gui-ir-v12.js
      - src/native-gui-ir-v13.js
      - src/native-gui-ir-v14.js
      - src/native-current-contract.js
      - src/native-frozen-contract.js
      - src/native-gui-frozen-lower.js
      - src/native-gui-frozen-seal.js
      - src/native-tree-backend-adapter.js
      - src/native-slider-backend-adapter.js
      - src/native-chrome-backend-adapter.js
      - src/sealed-native-gui-v12.js
      - src/sealed-native-gui-v13.js
      - src/sealed-native-gui-v14.js
      - src/sealed-native-package.js
      - src/prebuilt-native.js
      - src/prebuilt-window.js
      - src/local-native-kit.js
      - src/concrete-call-witness.js
      - src/concrete-call-certificate.js
      - src/concrete-call-body.js
      - src/concrete-call-body-certificate.js
      - .github/workflows/pages.yml
      - .github/workflows/pages-status.yml
      - .github/workflows/runtime-templates.yml
      - .github/workflows/native-responsive-runtime.yml
      - .github/workflows/native-sealed-menu-release-v12.yml
      - .github/workflows/native-sealed-tree-runtime-v13.yml
      - .github/workflows/native-sealed-slider-runtime-v14.yml
      - .github/workflows/native-sealed-chrome-runtime-v15.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Patch Studio Runtime Templates, Patch Native Responsive Runtime, Patch Native Sealed Menu Runtime v1.2 Release, Patch Native Sealed TreeView Runtime v1.3, Patch Native Sealed Slider Runtime v1.4, Patch Native Sealed Chrome Runtime v1.5]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/configure-pages@v6
      - name: Build public site
        run: npm run build:site
      - name: Check required Patch Studio runtime releases
        id: native_runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: studio-runtime-v0.6
          WIN32_RUNTIME_TAG: native-win32-runtime-v1.5
          LINUX_NATIVE_RUNTIME_TAG: native-linux-runtime-v1.5
          MACOS_NATIVE_RUNTIME_TAG: native-macos-runtime-v1.5
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tag in "$RUNTIME_TAG" "$WIN32_RUNTIME_TAG" "$LINUX_NATIVE_RUNTIME_TAG" "$MACOS_NATIVE_RUNTIME_TAG"; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Found $tag"
            else
              echo "Missing required release: $tag" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Required Patch Studio runtime releases are incomplete. Refusing to report a successful Pages run without a deployment.' >&2
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Add and verify compiled native runtime templates
        if: steps.native_runtime.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: studio-runtime-v0.6
          WIN32_RUNTIME_TAG: native-win32-runtime-v1.5
          LINUX_NATIVE_RUNTIME_TAG: native-linux-runtime-v1.5
          MACOS_NATIVE_RUNTIME_TAG: native-macos-runtime-v1.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/runtimes

          for file in \
            patch-windows-console-runtime.bin patch-macos-console-runtime.bin patch-linux-console-runtime.bin \
            patch-windows-window-runtime.zip patch-macos-window-runtime.zip patch-linux-window-runtime.zip; do
            gh release download "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir _site/runtimes --clobber
          done

          WIN_FILE=patch-windows-native-gui-runtime.exe
          LINUX_FILE=patch-linux-native-gui-runtime.bin
          MACOS_FILE=patch-macos-native-gui-runtime.bin
          gh release download "$WIN32_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$WIN_FILE" --dir _site/runtimes --clobber
          gh release download "$LINUX_NATIVE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$LINUX_FILE" --dir _site/runtimes --clobber
          gh release download "$MACOS_NATIVE_RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MACOS_FILE" --dir _site/runtimes --clobber

          release_digest() {
            local tag="$1" asset="$2"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .digest"
          }

          manifest_args=(
            --dir _site/runtimes
            --out _site/runtimes/runtime-manifest.json
          )
          add_verified_entry() {
            local tag="$1" file="$2" digest
            digest="$(release_digest "$tag" "$file")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "GitHub release asset $tag/$file is missing a valid SHA-256 digest: $digest" >&2
              exit 1
            fi
            manifest_args+=(--entry "$file|$tag|$digest")
          }

          add_verified_entry "$WIN32_RUNTIME_TAG" "$WIN_FILE"
          add_verified_entry "$LINUX_NATIVE_RUNTIME_TAG" "$LINUX_FILE"
          add_verified_entry "$MACOS_NATIVE_RUNTIME_TAG" "$MACOS_FILE"
          for file in \
            patch-windows-console-runtime.bin patch-macos-console-runtime.bin patch-linux-console-runtime.bin \
            patch-windows-window-runtime.zip patch-macos-window-runtime.zip patch-linux-window-runtime.zip; do
            add_verified_entry "$RUNTIME_TAG" "$file"
          done

          node scripts/runtime-integrity-manifest.js "${manifest_args[@]}"
          cat _site/runtimes/runtime-manifest.json
          ls -lh _site/runtimes
      - name: Validate current Patch Studio site surface
        if: steps.native_runtime.outputs.ready == 'true'
        run: npm run check:site
      - uses: actions/upload-pages-artifact@v5
        if: steps.native_runtime.outputs.ready == 'true'
        with:
          path: _site
      - name: Deploy
        if: steps.native_runtime.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed Patch Studio critical assets
        if: steps.native_runtime.outputs.ready == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLIC_URL: https://minh.systems/Patch/
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="deploy-${GITHUB_SHA}"

          fetch_asset() {
            local url="$1" output="$2"
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 3 --retry-all-errors \
              --output "$output" "$url"
            test -s "$output"
          }

          verify_base() {
            local base="${1%/}/" label="$2" index_file revision
            index_file="/tmp/patch-pages-index-${label}"
            fetch_asset "${base}index.html?smoke=${cache_bust}" "$index_file"
            grep -F 'data-patch-version="0.2.0-beta.36"' "$index_file" >/dev/null
            revision="$(grep -oE '\./style\.css\?v=[0-9a-f]{16}' "$index_file" | head -n1 | sed 's/.*?v=//')"
            if [[ ! "$revision" =~ ^[0-9a-f]{16}$ ]]; then
              echo "${label} did not publish a valid Patch site revision." >&2
              exit 1
            fi
            grep -F "./studio-bootstrap.js?v=${revision}" "$index_file" >/dev/null
            grep -F "./studio-accessibility.js?v=${revision}" "$index_file" >/dev/null
            grep -F "./studio-command-palette.js?v=${revision}" "$index_file" >/dev/null
            grep -F "./studio-command-palette.css?v=${revision}" "$index_file" >/dev/null
            grep -F 'viewBox="0 0 22 22"' "$index_file" >/dev/null
            grep -F 'shape-rendering="crispEdges"' "$index_file" >/dev/null

            assets=(
              site-navigation.css
              site-refresh.css
              studio-command-palette.css
              playground.js
              native-build.js
              studio-bootstrap.js
              studio-command-palette.js
              studio-accessibility.js
              designer-multiselect.js
              sw.js
              src/compiler.js
              src/call-site-validation.js
              src/independent-range-expression.js
              src/independent-guard-expression.js
              src/native-current-contract.js
              src/native-frozen-contract.js
            )
            for asset in "${assets[@]}"; do
              fetch_asset "${base}${asset}?v=${revision}&smoke=${cache_bust}" /tmp/patch-pages-smoke
            done

            fetch_asset "${base}playground.js?v=${revision}&smoke=${cache_bust}" /tmp/patch-pages-playground
            grep -F "./src/compiler.js?v=${revision}" /tmp/patch-pages-playground >/dev/null
            fetch_asset "${base}native-build.js?v=${revision}&smoke=${cache_bust}" /tmp/patch-pages-native-build
            grep -F "./src/native-current-contract.js?v=${revision}" /tmp/patch-pages-native-build >/dev/null
            fetch_asset "${base}src/native-current-contract.js?v=${revision}&smoke=${cache_bust}" /tmp/patch-pages-current
            grep -F "./native-gui-ir-v14.js?v=${revision}" /tmp/patch-pages-current >/dev/null
            grep -F "native-win32-runtime-v1.5" /tmp/patch-pages-current >/dev/null
            fetch_asset "${base}src/native-frozen-contract.js?v=${revision}&smoke=${cache_bust}" /tmp/patch-pages-frozen
            grep -F "./native-gui-ir-v12.js?v=${revision}" /tmp/patch-pages-frozen >/dev/null
            fetch_asset "${base}src/compiler.js?v=${revision}&smoke=${cache_bust}" /tmp/patch-pages-compiler
            grep -F "./parser.js?v=${revision}" /tmp/patch-pages-compiler >/dev/null
            fetch_asset "${base}studio-bootstrap.js?v=${revision}&smoke=${cache_bust}" /tmp/patch-pages-bootstrap
            grep -F 'sw.js?v=${encodeURIComponent(siteRevision)}' /tmp/patch-pages-bootstrap >/dev/null
            echo "Patch Studio ${label} revision ${revision} smoke passed: $base"
          }

          verify_base "$PAGE_URL" pages
          if [ "${PUBLIC_URL%/}" != "${PAGE_URL%/}" ]; then
            verify_base "$PUBLIC_URL" public
          fi
      - name: Verify deployed Patch Studio in Chrome
        if: steps.native_runtime.outputs.ready == 'true'
        env:
          PATCH_STUDIO_SMOKE_URL: https://minh.systems/Patch/?startup-diagnostic-smoke=1
        run: node --test tests/studio-browser-startup.test.js