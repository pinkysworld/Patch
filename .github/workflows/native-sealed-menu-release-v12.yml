name: Patch Native Sealed Menu Runtime v1.2 Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/native-sealed-menu-release-v12.yml
      - native-runtime/sealed-menu-v12.hpp
      - native-runtime/sealed-table-v10.hpp
      - native-runtime/sealed-list-v11.hpp
      - native-runtime/win32-sealed-gui-v12.cpp
      - native-runtime/appkit-sealed-gui-v12.mm
      - native-runtime/gtk-sealed-gui-v12.cpp
      - src/sealed-native-gui-v11.js
      - src/native-gui-ir-v11.js
      - examples/menu-state-window.patch
  push:
    branches: [main]
    paths:
      - .github/workflows/native-sealed-menu-release-v12.yml
      - native-runtime/sealed-menu-v12.hpp
      - native-runtime/sealed-table-v10.hpp
      - native-runtime/sealed-list-v11.hpp
      - native-runtime/win32-sealed-gui-v12.cpp
      - native-runtime/appkit-sealed-gui-v12.mm
      - native-runtime/gtk-sealed-gui-v12.cpp
      - src/sealed-native-gui-v11.js
      - src/native-gui-ir-v11.js
      - examples/menu-state-window.patch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PATCH_SEALED_GUI_VERSION: 11

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Test payload v11 Menu contract
        run: node --test tests/sealed-menu-payload-v11.test.js

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build Win32 runtime v1.2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-runtime-v12 | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found.' }
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found.' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          @(
            '@echo off',
            "call `"$devcmd`" -arch=x64 -host_arch=x64",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl.exe /nologo /EHsc /std:c++17 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /DPATCH_WIN32_RUNTIME_V11_RESTORE_ENTRY=PatchRuntimeV11CompatibilityMain native-runtime\win32-sealed-gui-v12.cpp user32.lib gdi32.lib comctl32.lib comdlg32.lib oleacc.lib ole32.lib oleaut32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist-runtime-v12\patch-windows-native-gui-runtime.exe',
            'exit /b %errorlevel%'
          ) | Set-Content dist-runtime-v12\build.cmd -Encoding ascii
          & cmd.exe /d /c dist-runtime-v12\build.cmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC runtime build failed with exit code $LASTEXITCODE." }
      - name: Seal and smoke canonical Menu app
        shell: pwsh
        run: |
          node --input-type=module -e "import fs from 'node:fs';import{compile}from'./src/compiler.js';import{buildNativeGuiIRV11}from'./src/native-gui-ir-v11.js';import{sealNativeGuiRuntimeV11}from'./src/sealed-native-gui-v11.js';const source=fs.readFileSync('examples/menu-state-window.patch','utf8');const ir=buildNativeGuiIRV11(compile(source,{name:'MenuV12',kind:'window'}));const runtime=fs.readFileSync('dist-runtime-v12/patch-windows-native-gui-runtime.exe');fs.writeFileSync('dist-runtime-v12/MenuV12.exe',sealNativeGuiRuntimeV11(runtime,ir,{platform:'windows'}));"
          $sealed = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist-runtime-v12/MenuV12.exe'))
          if ([BitConverter]::ToUInt32($sealed, $sealed.Length - 12) -ne 11) { throw 'Expected payload v11.' }
          $process = Start-Process -FilePath (Resolve-Path 'dist-runtime-v12/MenuV12.exe') -ArgumentList '--patch-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Win32 v1.2 smoke failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v7
        with:
          name: patch-windows-native-gui-runtime-v12
          path: dist-runtime-v12/patch-windows-native-gui-runtime.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Build universal AppKit runtime v1.2
        shell: bash
        run: |
          mkdir -p dist-runtime-v12
          clang++ -std=c++17 -O2 -fblocks -mmacosx-version-min=11.0 \
            -arch arm64 -arch x86_64 -framework Cocoa \
            native-runtime/appkit-sealed-gui-v12.mm \
            -o dist-runtime-v12/patch-macos-native-gui-runtime.bin
          chmod +x dist-runtime-v12/patch-macos-native-gui-runtime.bin
          ARCHS="$(lipo -archs dist-runtime-v12/patch-macos-native-gui-runtime.bin)"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
      - name: Seal and smoke canonical Menu app
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV11 } from './src/native-gui-ir-v11.js';
          import { sealNativeGuiRuntimeV11 } from './src/sealed-native-gui-v11.js';
          const source=fs.readFileSync('examples/menu-state-window.patch','utf8');
          const ir=buildNativeGuiIRV11(compile(source,{name:'MenuV12',kind:'window'}));
          const runtime=fs.readFileSync('dist-runtime-v12/patch-macos-native-gui-runtime.bin');
          const sealed=sealNativeGuiRuntimeV11(runtime,ir,{platform:'macos'});
          fs.writeFileSync('dist-runtime-v12/MenuV12',sealed);fs.chmodSync('dist-runtime-v12/MenuV12',0o755);
          const footer=new DataView(sealed.buffer,sealed.byteOffset+sealed.byteLength-20,20);if(footer.getUint32(8,true)!==11)throw new Error('Expected payload v11.');
          NODE
          dist-runtime-v12/MenuV12 --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-macos-native-gui-runtime-v12
          path: dist-runtime-v12/patch-macos-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb
      - name: Build GTK3 runtime v1.2
        shell: bash
        run: |
          mkdir -p dist-runtime-v12
          g++ -std=c++17 -O2 native-runtime/gtk-sealed-gui-v12.cpp -o dist-runtime-v12/patch-linux-native-gui-runtime.bin $(pkg-config --cflags --libs gtk+-3.0)
          chmod +x dist-runtime-v12/patch-linux-native-gui-runtime.bin
      - name: Seal and smoke canonical Menu app
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compile } from './src/compiler.js';
          import { buildNativeGuiIRV11 } from './src/native-gui-ir-v11.js';
          import { sealNativeGuiRuntimeV11 } from './src/sealed-native-gui-v11.js';
          const source=fs.readFileSync('examples/menu-state-window.patch','utf8');
          const ir=buildNativeGuiIRV11(compile(source,{name:'MenuV12',kind:'window'}));
          const runtime=fs.readFileSync('dist-runtime-v12/patch-linux-native-gui-runtime.bin');
          const sealed=sealNativeGuiRuntimeV11(runtime,ir,{platform:'linux'});
          fs.writeFileSync('dist-runtime-v12/MenuV12',sealed);fs.chmodSync('dist-runtime-v12/MenuV12',0o755);
          const footer=new DataView(sealed.buffer,sealed.byteOffset+sealed.byteLength-20,20);if(footer.getUint32(8,true)!==11)throw new Error('Expected payload v11.');
          NODE
          xvfb-run -a dist-runtime-v12/MenuV12 --patch-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: patch-linux-native-gui-runtime-v12
          path: dist-runtime-v12/patch-linux-native-gui-runtime.bin
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: patch-windows-native-gui-runtime-v12
          path: runtime/windows
      - uses: actions/download-artifact@v8
        with:
          name: patch-macos-native-gui-runtime-v12
          path: runtime/macos
      - uses: actions/download-artifact@v8
        with:
          name: patch-linux-native-gui-runtime-v12
          path: runtime/linux
      - name: Publish native runtime v1.2 templates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          publish_runtime() {
            local tag="$1" title="$2" asset="$3" notes="$4"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          }
          publish_runtime native-win32-runtime-v1.2 'Patch Native Win32 Runtime v1.2' runtime/windows/patch-windows-native-gui-runtime.exe 'Token-free Win32 sealed-GUI runtime v1.2. Consumes payload v11 / Native GUI IR 1.1 with Table, persistent list state, native multi-select ListBox, Menu separators, portable shortcuts and source-backed enabled/checked MenuItem state.'
          publish_runtime native-macos-runtime-v1.2 'Patch Native macOS Runtime v1.2' runtime/macos/patch-macos-native-gui-runtime.bin 'Unsigned universal AppKit sealed-GUI runtime v1.2. Consumes payload v11 / Native GUI IR 1.1 with Table, persistent list state, native multi-select ListBox, Menu separators, portable shortcuts and source-backed enabled/checked MenuItem state.'
          publish_runtime native-linux-runtime-v1.2 'Patch Native Linux Runtime v1.2' runtime/linux/patch-linux-native-gui-runtime.bin 'GTK3 sealed-GUI runtime v1.2. Consumes payload v11 / Native GUI IR 1.1 with Table, persistent list state, native multi-select ListBox, Menu separators, portable shortcuts and source-backed enabled/checked MenuItem state.'
